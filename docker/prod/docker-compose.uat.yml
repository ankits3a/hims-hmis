# ══════════════════════════════════════════════════════════════════════════════════════════════
# PHASE 11i T3 — THE UAT OVERLAY. `docker compose -f docker-compose.prod.yml -f this`.
#
# UAT runs THE SAME BUILD THAT WILL SHIP, against its own database, in its own compose project, on
# this same box. That is the whole design: a rehearsal on a different build proves nothing about the
# build that ships.
#
# ═══ "THE SAME BUILD" MEANS `hmis-uat/*`, NOT `hmis-prod/*`, AND THIS FILE ONCE SAID OTHERWISE ═══
#
# `deploy.sh`'s uat target sets `IMAGE_NS=hmis-uat` and builds `hmis-uat/{server,web,db}:latest`
# from the checkout. This overlay declared no `image:` at all, so every service inherited the base
# file's `hmis-prod/*:latest` — **production's currently-deployed build** — and the freshly built
# candidate sat on the daemon unused. The header's old wording, "UAT runs THE PRODUCTION IMAGE",
# reads as though that were the intent. It is not: the sentence means the artefact that will ship,
# not the artefact production happens to be running.
#
# **This was the worst of the five defects that kept UAT from standing up, because it is the only
# one that SUCCEEDS.** The other four fail loudly — an unbound variable, an empty site address, a
# port nothing listens on, a reload that cannot connect. This one brings a stack up, serves it, and
# rehearses the wrong code.
#
# What this file changes is only what MUST differ — the images, the ports (production holds
# 80/443/5434), the memory (this box has 15 GB and production must never be starved by a training
# session), the archiving (there is no backup repository and there must not be one), and which
# services run at all.
#
# ═══ WHY THE FIVE MONITORING SERVICES ARE BEHIND A PROFILE AND NOT DELETED ═══
#
# A compose override cannot REMOVE a service the base declares — there is no such operation, and
# an override that tried would be a service with half its definition. `profiles:` is how compose
# says "not part of this run": a profiled service is excluded from `up`, and — the part that
# matters here — from `compose config --services`, which is what deploy.sh step 6b enumerates when
# it asserts that every declared service is running. So UAT's census names the four it runs and
# does not go looking for a prometheus that was never meant to start.
#
# The base file is UNTOUCHED, which is the property worth having: nothing about production's
# deploy changes because UAT exists.
#
# ═══ NOTHING HERE IS SHARED WITH PRODUCTION ═══
#
# Volumes and networks are namespaced by compose project. Under `-p hmis-uat` the volume declared
# as `hmis_prod_pgdata` becomes the object `hmis-uat_hmis_prod_pgdata` — a different volume from
# production's `hmis-prod_hmis_prod_pgdata`, on a different network. This file declares no
# `external: true` volume and no `name:` override, and `deploy-parity.test.ts` asserts that,
# because either would be the one way to reach across.
# ══════════════════════════════════════════════════════════════════════════════════════════════
services:
  db:
    image: hmis-uat/db:latest
    # NO ARCHIVING. `archive_command` would run `pgbackrest` against a stanza that does not exist,
    # and a failing archive_command does not fail loudly — it fills pg_wal until the disk does.
    command: !override ["postgres"]
    # `.env.pgbackrest` is derived by deploy.sh for production only; UAT's db container must not
    # be handed a backup credential it has no repository for and no business holding.
    env_file: !reset null
    # 5435, not 5434: production's db publishes 5434 on loopback and this box runs both.
    ports: !override ["127.0.0.1:5435:5432"]
    volumes: !override
      - hmis_prod_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1g"
        reservations:
          memory: "256m"

  api:
    image: hmis-uat/server:latest
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "768m"
        reservations:
          memory: "128m"

  worker:
    image: hmis-uat/server:latest
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"
        reservations:
          memory: "128m"

  caddy:
    image: hmis-uat/web:latest
    # 80 and 443 belong to production and taking either would be an outage, not a collision — this
    # is the single most dangerous line in the file and it is an `!override` precisely because
    # compose MERGES port lists by default.
    #
    # 2026-09-30: staging is https://stagehmis.crkmch.com. Production's caddy terminates TLS for it
    # and proxies to `host.docker.internal:8444`, which is THIS binding. 172.17.0.1 is docker0's
    # address: a container on any bridge reaches it through `host-gateway`, and the internet does
    # not (measured with throwaway containers before this line was written). A bare "8444:8080"
    # would publish on every interface, and docker's published ports bypass ufw.
    # Container side is 8080 because `Caddyfile.uat`'s site address is `http://{$HMIS_UAT_SITE}:8080`
    # — the earlier `8443:443` bug was exactly these two numbers disagreeing.
    ports: !override ["172.17.0.1:8444:8080"]
    # The staff Android APKs (apps/mobile/scripts/build-apk.sh), served at /app/ by Caddyfile.uat.
    # Read-only, and a host directory outside every compose project — no volume is shared.
    volumes:
      - /opt/hmis-context/mobile-apk:/downloads:ro
    # WITHOUT THIS, `Caddyfile.uat`'s `{$HMIS_UAT_SITE}` AND `{$HMIS_UAT_BASIC_AUTH_HASH}` EXPAND TO
    # EMPTY — caddy reads them from its own process environment and neither the base file nor this
    # one gave it any. The `:?` form makes compose refuse with the variable's name rather than
    # starting an edge with no site address and no basic-auth hash, which is the failure that would
    # have served UAT unauthenticated.
    environment:
      HMIS_UAT_SITE: ${HMIS_UAT_SITE:?set HMIS_UAT_SITE in the UAT .env — the address UAT answers on}
      HMIS_UAT_BASIC_AUTH_HASH: ${HMIS_UAT_BASIC_AUTH_HASH:?set HMIS_UAT_BASIC_AUTH_HASH in the UAT .env — mint with `docker run --rm caddy:2-alpine caddy hash-password --plaintext '<pw>'`}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"
        reservations:
          memory: "64m"

  # ── the five that do not run on UAT ─────────────────────────────────────────────────────────
  # Not deleted (an override cannot) and not disabled by scale (`compose config --services` would
  # still name them and step 6b would still wait for them). A profile nothing enables is the only
  # expression compose has for "declared, and not part of this run".
  node-exporter:
    profiles: ["monitoring"]
  postgres-exporter:
    profiles: ["monitoring"]
  prometheus:
    profiles: ["monitoring"]
  grafana:
    profiles: ["monitoring"]
  alertmanager:
    profiles: ["monitoring"]
