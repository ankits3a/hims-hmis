# Plan 11a / D9, flag ⑨ — the worker's own liveness alert, and the blind spot the spike found
# (finding 6): `scheduler_heartbeats` (kernel/db/schema/worker.ts) gains a row only once a job
# has STARTED at least once, so a staleness threshold over EXISTING rows alone reads GREEN
# exactly when a job has never run at all — the worst possible failure to miss. This file ships
# BOTH legs, and the second is the whole point of the rule:
#
#   1. HmisSchedulerJobStale{Interval,Daily} — a job that HAS a heartbeat row and has gone quiet.
#   2. HmisSchedulerJobMissing               — a job that has NO row at all.
#
# Leg 2 is proven by drill in the T6 gate report: a job name with no heartbeat row fires
# HmisSchedulerJobMissing while the staleness legs stay silent for it — they have no series to
# threshold against, which is exactly the blind spot this rule exists to close.
#
# The TWELVE job names and their cadences are transcribed verbatim from `registerAllJobs`
# (apps/core/src/kernel/worker/jobs.ts) — this file invents no cadence of its own. The tenth,
# `sweepInterfaceHeartbeats` (Plan 11c D6), is an INTERVAL job, so it joins leg 1a and leg 2 and
# leaves leg 1b alone. `apps/core/test/alerts-parity.test.ts` fails if this file and that registry
# ever disagree, which is why a count in a comment here is worth keeping honest.
groups:
  - name: hmis-scheduler
    rules:
      # Leg 1a — the SIX `every(ms)` jobs (five until Plan 15 T4 added `flagLateSurgeons`). The
      # slowest shipped cadence is still 60s
      # (WORKER_TEMP_ROLES_INTERVAL_MS, and now WORKER_INTERFACE_SWEEP_INTERVAL_MS beside it at the
      # same 60s default), so the 300s threshold is unchanged: 5 minutes is a wide margin over one
      # missed tick before paging anyone, while still catching a genuinely stuck loop inside the
      # same shift.
      - alert: HmisSchedulerJobStaleInterval
        expr: |
          hmis_scheduler_heartbeat_staleness_seconds{
            job=~"runDispatchCycle|runDueTimers|sweepExpiredTempRoles|runNotifyPump|sweepInterfaceHeartbeats|flagLateSurgeons"
          } > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scheduler job {{ $labels.job }} has not ticked in over 5 minutes"
          description: >-
            {{ $labels.job }} last started {{ $value | humanizeDuration }} ago. Check
            `docker compose -p hmis-prod logs worker`.

      # Leg 1b — the SIX `dailyIst` jobs (five until Plan 14 T8 added `sweepBatchExpiry` at 06:30). Each runs once every ~24h by design
      # (kernel/worker/scheduler.ts's `isDailyDue`), so staleness legitimately climbs to ~24h
      # between runs; 26h (93600s) gives a two-hour margin for scheduling jitter before treating
      # a missed day as an incident.
      - alert: HmisSchedulerJobStaleDaily
        expr: |
          hmis_scheduler_heartbeat_staleness_seconds{
            job=~"sweepGuardianMajority|sweepAppointmentNoShows|sweepBatchExpiry|runDailyClose|createEventPartitions|retentionSweep|rollupUserDayFacts"
          } > 93600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Daily scheduler job {{ $labels.job }} missed its run"
          description: >-
            {{ $labels.job }} last started {{ $value | humanizeDuration }} ago (expected about
            once every 24h). Check `docker compose -p hmis-prod logs worker`.

      # Leg 2 — THE BLIND SPOT (spike finding 6, flag ⑨). A job that has NEVER started has no row
      # in scheduler_heartbeats at all, so it has no series for leg 1 to threshold against — that
      # is precisely what leg 1 cannot see. `absent()` over each of the ELEVEN expected job names
      # closes it: every term that matches carries that job's own name as $labels.job (from the
      # positive equality matcher inside it), so `or` fires one alert instance PER missing job
      # rather than one alert for all of them together.
      - alert: HmisSchedulerJobMissing
        expr: |
          absent(hmis_scheduler_heartbeat_staleness_seconds{job="runDispatchCycle"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="runDueTimers"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="sweepExpiredTempRoles"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="runNotifyPump"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="sweepGuardianMajority"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="sweepAppointmentNoShows"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="runDailyClose"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="createEventPartitions"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="retentionSweep"})
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="sweepInterfaceHeartbeats"})
          # Plan 14 T8 / DD14 — the ELEVENTH job. A batch-expiry sweep that silently stopped would
          # be invisible in exactly the way that matters: the worklist would simply keep saying
          # nothing, which is what it says when there is nothing to say.
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="sweepBatchExpiry"})
          # Plan 15 T4 / F1 — the TWELFTH job. A surgeon-late flag that silently stopped is invisible
          # in the same way the batch sweep is: the digest simply keeps saying nothing, which is what
          # it says when nobody is late.
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="flagLateSurgeons"})
          # PLAN 07c T8 — the THIRTEENTH job, a DAILY one (`dailyIst("02:00")`): the per-user
          # rollup the five-period briefs are served from. It joins leg 1b's alternation above and
          # this chain; the INTERVAL leg does not move. A brief that quietly goes on serving
          # last week's rollup is exactly the kind of silence leg 2 exists to break.
          or absent(hmis_scheduler_heartbeat_staleness_seconds{job="rollupUserDayFacts"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scheduler job {{ $labels.job }} has never reported a heartbeat"
          description: >-
            No scheduler_heartbeats row exists for {{ $labels.job }} — it has never started. A
            staleness threshold over existing rows cannot see this; that is what this rule is
            for.
