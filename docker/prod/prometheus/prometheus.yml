# Plan 11a / D9 — Prometheus for the hmis-prod stack (FORK-D: same box, measured ~0.6% of it).
#
# Mounted as a DIRECTORY alongside alerts.yml (T3-1/T4-9's measured inode lesson: a single-file
# bind mount pins the container to the replaced inode, and deploy.sh's `install(1)` replaces the
# inode on every config update — the edge, or here the evaluator, would keep reading the OLD
# bytes for the container's whole life). `--web.enable-lifecycle` below is what then lets a
# config or rule-file EDIT take effect without recreating the container:
#
#     curl -X POST http://127.0.0.1:9090/-/reload
#
# (loopback only — the README's monitoring section names this as the config-update procedure).
#
# Both exporters are reached by SERVICE NAME over the `hmis-prod` compose network. Neither
# publishes a host port (D13's port map: "api and the exporters are compose-network-internal
# only and publish nothing") — only this file and grafana bind 127.0.0.1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  # Plan 11c / D11 — the restore-drill watcher, a SECOND file on purpose. `alerts.yml` is pinned
  # three ways by `apps/core/test/alerts-parity.test.ts`, which reads that ONE hardcoded path and
  # parses it with matchers that throw on shapes they do not recognise; its `job=~` parser matches
  # FILE-WIDE and asserts exactly two legs. Backup rules do not belong inside the scheduler-parity
  # surface, so they are loaded beside it instead. See alerts-backup.yml's own header.
  - /etc/prometheus/alerts-backup.yml
  # Plan 11d / D7 — the THIRD rule file, and the ALERT-PATH surface. The same
  # reasoning as the second one, one more time: `alerts.yml` is the SCHEDULER-parity surface
  # that alerts-parity.test.ts pins FILE-WIDE, `alerts-backup.yml` is the BACKUP surface, and
  # this file watches the thing that carries every other rule's verdict to a human being.
  # Before it, a crash-looping alertmanager and a rotated app password were both
  # indistinguishable from a quiet night. See alerts-meta.yml's own header for the limit.
  #
  # apps/core/test/deploy-parity.test.ts (Plan 11d / D8) is what now stops this line, the file
  # on disk and deploy.sh's install of it from drifting apart: all three are ONE set, checked
  # in both directions, with the count of them pinned before anything is compared.
  - /etc/prometheus/alerts-meta.yml

# Plan 11c / D10 — WHERE A FIRING RULE ACTUALLY GOES. Until this block existed, every rule in
# `alerts.yml` evaluated correctly, turned red on Prometheus's own /alerts page, and reached
# NOBODY: an alert nothing is configured to deliver is a dashboard widget. Alertmanager is the
# ninth service in `docker-compose.prod.yml`, reached by SERVICE NAME over the `hmis-prod` compose
# network — it publishes 127.0.0.1:9093 for `amtool` and for a tunnel, and Prometheus does not use
# that publication.
#
# NO `depends_on` WAS ADDED TO THE PROMETHEUS SERVICE for this. Prometheus retries an
# alertmanager it cannot resolve, indefinitely and harmlessly, and a hard dependency would mean a
# broken alert sink could stop metrics being collected at all — the wrong trade for a stack whose
# whole point is to keep observing while something is wrong.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    # HONOR_LABELS, AND IT IS LOAD-BEARING — measured, not stylistic (spike Question D). The
    # custom query in postgres-exporter/queries.yml returns its OWN "job" column (the scheduled
    # job name). Without honor_labels, Prometheus's target-label collision rule renames a
    # scraped "job" label to "exported_job" and keeps this SCRAPE's job name ("postgres") on the
    # metric instead — every per-job matcher in alerts.yml would then match nothing. WITH it, the
    # scraped label wins, exactly as the spike measured it:
    #   hmis_scheduler_heartbeat_staleness_seconds{job="runDispatchCycle",...}
    honor_labels: true
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Plan 11d / D7 — ALERTMANAGER BECOMES A SCRAPE TARGET, and this job exists for
  # exactly one reason: so that `up{job="alertmanager"}` and the
  # `alertmanager_notifications_*` families exist on this box AT ALL. Nothing else reads
  # job="alertmanager". Until this line, the alert sink was the one process in the stack
  # that nothing observed — and it is the process every other rule depends on to be
  # heard.
  #
  # Reached by SERVICE NAME over the hmis-prod compose network, the same reach the
  # `alerting:` block above already uses. The 127.0.0.1:9093 publication is for `amtool` on
  # the box and for an SSH tunnel; Prometheus does not use it.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
