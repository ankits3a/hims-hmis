# Plan 11a / D8 — pgBackRest for the hmis-prod cluster.
#
# WHERE THIS FILE LIVES, AND WHY IT IS A DIRECTORY MOUNT. deploy.sh installs it to
# /opt/hmis-prod/pgbackrest/ and the compose `db` service mounts THAT DIRECTORY at
# /etc/pgbackrest:ro. A single-file bind mount pins the container to the file's inode and
# install(1) replaces the inode, so a config update would stay invisible to the running container
# for the whole life of that container — measured by T3 on the Caddyfile, not predicted. Mount the
# directory; never the file.
#
# NO SECRET, NO ENDPOINT AND NO BUCKET NAME IS IN THIS FILE (GC2, D4). Everything provider-shaped
# arrives as PGBACKREST_* environment variables which deploy.sh derives from the root-only
# /opt/hmis-prod/.env.r2 and hands to the `db` service alone:
#
#     PGBACKREST_REPO1_S3_ENDPOINT   PGBACKREST_REPO1_S3_BUCKET   PGBACKREST_REPO1_S3_REGION
#     PGBACKREST_REPO1_S3_KEY        PGBACKREST_REPO1_S3_KEY_SECRET
#     PGBACKREST_REPO1_CIPHER_PASS
#
# Stage 3 re-points those six at MinIO on the NAS. Nothing in this file is rewritten (GC1).

[global]
# S3 protocol, not "Cloudflare" — that is the whole of ruling 3 and of D4. The destination is a
# protocol, the credentials are configuration, and neither is a line of code.
repo1-type=s3
repo1-path=/hmis-prod
# R2 serves the S3 API with path-style addressing; `host` style (the pgBackRest default) puts the
# bucket in the hostname and is not the safe default there.
repo1-s3-uri-style=path

# spec E-2 — CLIENT-SIDE repository encryption, so the object store only ever holds ciphertext.
# The passphrase is PGBACKREST_REPO1_CIPHER_PASS, generated once on the box by deploy.sh and
# preserved across every later run. LOSING IT MAKES EVERY BACKUP IN THE REPO UNREADABLE; it is
# escrowed alongside SECRET_KEY, and CHANGING IT ORPHANS EVERYTHING ALREADY WRITTEN.
repo1-cipher-type=aes-256-cbc

# BOTH retention knobs are set, and that is a measured requirement rather than tidiness: every
# single backup the spike took printed
#     option 'repo1-retention-archive' is not set - archive logs will not be expired
# i.e. the WAL in the repo would grow for ever. With nightly fulls, 14 of them is roughly a
# fortnight of full-fidelity point-in-time recovery, and the archive follows the same window.
repo1-retention-full=14
repo1-retention-full-type=count
repo1-retention-archive=14
repo1-retention-archive-type=full

compress-type=zst
compress-level=6

# BUNDLING IS WHAT MAKES A REMOTE REPOSITORY VIABLE AT ALL, AND THE NUMBER IS NOT A GUESS. The
# same 33 MB / 1670-file cluster, backed up to the real bucket three times on this box:
#
#     process-max=2, no bundling  ->  886s     (3.6 MB of repo at ~4 KB/s: pure per-object latency)
#     process-max=8, no bundling  ->  226s
#     process-max=8, BUNDLING     ->   24s     — and 23s again under the service's own 2-CPU cap
#
# 37x, for an identical 3.6 MB backup set. The cost of a remote repo is one round trip per OBJECT,
# and a Postgres cluster is mostly tiny relation files, so the fix is to stop making one object per
# file. Without this a nightly full stops fitting in the night long before the database is large.
repo1-bundle=y
# Latency-bound, not CPU-bound: these processes spend their time waiting on the object store. The
# 2-CPU service limit was applied to the measuring container for the last run above, and the time
# did not move.
process-max=8

# Force an immediate checkpoint instead of waiting out checkpoint_timeout, so a nightly full
# starts when cron says it does.
start-fast=y

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[hmis]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
# MEASURED, AND THE STANZA CANNOT BE CREATED WITHOUT IT. The docker entrypoint creates the
# superuser named by POSTGRES_USER — `hmis` here — while pgBackRest otherwise connects as the OS
# user it runs as, `postgres`. The spike's first stanza-create died on exactly that:
#     FATAL: role "postgres" does not exist
#     ERROR: [056]: unable to find primary cluster - cannot proceed
pg1-user=hmis
