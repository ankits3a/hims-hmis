# Plan 11a / D13 — the stage-1 production stack, running BESIDE the dev stack on one box
# (owner ruling 2). Everything about that coexistence is structural, not a convention:
#
#   * the compose project is `hmis-prod` and dev's is `hmis`, so a `compose down`/`up` against
#     one can never act on the other (AGENT-RULES rule 7 as amended 2026-08-22);
#   * the databases are different CONTAINERS on different VOLUMES on different PORTS — dev
#     Postgres stays on 5433 and is never touched here, prod Postgres is 127.0.0.1:5434;
#   * this file is COPIED to /opt/hmis-prod by deploy.sh and compose is run from there, so a git
#     operation in the /opt/hmis checkout cannot mutate what production is running.
#
# Port map, stated once (D13): dev Postgres 5433 (untouched) · prod Postgres 127.0.0.1:5434 ·
# Caddy 80/443 · Grafana 127.0.0.1:3001 and Prometheus 127.0.0.1:9090 (T6) · api and the
# exporters are compose-network-internal only and publish nothing.
#
# There is no `build:` key anywhere below, deliberately. Images are built FROM THE CHECKOUT by
# deploy.sh and run FROM THE DAEMON by tag: production never executes from a working tree.
#
# D4/GC1 portability: postgres, a node image built from this repo, and Caddy. No cloud load
# balancer, no cloud volume, no cloud DNS API, no cloud secrets manager. Racked on on-prem metal
# tomorrow, nothing here is REWRITTEN — the hostname in the Caddyfile and the backup endpoint in
# /opt/hmis-prod/.env are RE-POINTED.
#
# Sequential ownership: T3 (this file's creation) · T4 (the db image gains pgBackRest) ·
# T6 (prometheus, grafana and the two exporters). Leave it clean for them.
name: hmis-prod

services:
  # ------------------------------------------------------------------------------------------
  # db — production Postgres, now carrying pgBackRest (T4, D8, FORK-C). T3 predicted that "nothing
  # else about the service changes" when the image was swapped; that turned out not to be true and
  # could not be, because `archive_command` is what makes archiving continuous and it is a server
  # setting, not an image layer. Four things change here and nothing outside this service does:
  # the image, the `command` that turns archiving on, the env file that carries the repo
  # credentials to THIS container and no other, and two mounts.
  # ------------------------------------------------------------------------------------------
  db:
    image: hmis-prod/db:latest
    restart: unless-stopped
    # FORK-C, dissolved by measurement: `archive_command` runs INSIDE this container, so the
    # binary has to be in this image (see docker/prod/db.Dockerfile) and the setting has to be on
    # the server. It is passed on the command line rather than written into postgresql.conf so
    # that it lives in git beside the rest of the deployment — and so that a restored copy of this
    # cluster comes up with archiving OFF, because the setting was never in the backed-up config.
    #
    # archive_timeout bounds the RPO: a quiet hour still ships a WAL segment every 5 minutes, so
    # the worst case is 5 minutes of writes rather than "whenever 16 MB finally fills".
    command:
      - "postgres"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=hmis archive-push %p"
      - "-c"
      - "archive_timeout=300"
    # Loopback only. The dev database on 5433 is a different container on a different volume and
    # is never addressed from this project.
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the deploy .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deploy .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the deploy .env}
    env_file:
      # GC2: the repo endpoint, bucket, keys and cipher passphrase. deploy.sh derives this file
      # (mode 600) from /opt/hmis-prod/.env.r2; it is deliberately NOT the stack-wide .env, so the
      # api and worker containers never see a backup credential they have no use for.
      - .env.pgbackrest
    volumes:
      - hmis_prod_pgdata:/var/lib/postgresql/data
      # A DIRECTORY, for the inode reason spelled out on the caddy service below.
      - ./pgbackrest:/etc/pgbackrest:ro
      # pgBackRest's own log. On a volume because the one time anybody reads it is after an
      # archive-push started failing, which is exactly when the container has been recreated.
      - pgbackrest_log:/var/log/pgbackrest
    healthcheck:
      # D12. `$$` escapes compose interpolation so the CONTAINER's own environment expands here.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        # Ruling 2 makes these load-bearing rather than hygiene: the dev suite runs on this same
        # box and must not be able to starve production, nor production the suite. Sized against
        # the spike's measurements on a 16 GB box — the whole T6 monitoring stack came in at
        # ~96 MiB, so the headroom below is real.
        limits:
          cpus: "2.0"
          memory: "4g"
        reservations:
          memory: "1g"

  # ------------------------------------------------------------------------------------------
  # api — the Nest server. One image, several entrypoints (D3): the process is the COMMAND.
  # Publishes no port; Caddy reaches it over the compose network.
  # ------------------------------------------------------------------------------------------
  api:
    image: hmis-prod/server:latest
    restart: unless-stopped
    command: ["node", "dist/src/main.js"]
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # D12 + T1-2: there is no curl and no wget in node:22-bookworm-slim, so the check is node's
      # own fetch. /health is degraded-never-down by design, so any 2xx is alive.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1g"
        reservations:
          memory: "256m"

  # ------------------------------------------------------------------------------------------
  # worker — the scheduler process. THE WORKER DELIBERATELY HAS NO HEALTHCHECK (D12): it has no
  # HTTP surface, its liveness is its `scheduler_heartbeats` row, and that row is what T6's
  # alert rule reads. A pgrep-style check would assert that a process exists, which is not the
  # thing anyone needs to know. Do not add one.
  # ------------------------------------------------------------------------------------------
  worker:
    image: hmis-prod/server:latest
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "768m"
        reservations:
          memory: "256m"

  # ------------------------------------------------------------------------------------------
  # caddy — the edge. The image is the Dockerfile's `web` target: caddy:2-alpine with the built
  # SPA at /srv (T1-1). The Caddyfile is NOT baked in; it is deploy-directory config (D13) so it
  # can be corrected without a rebuild, and deploy.sh copies it here.
  #
  # `service_started`, not `service_healthy`: if the api is sick the site should still serve the
  # SPA and return the api's own error, not vanish. Caddy resolves `api:3000` per request, so it
  # tolerates the api restarting under it.
  #
  # No compose healthcheck: caddy:2-alpine carries no HTTP client, and the check that actually
  # matters is the external one deploy.sh performs — /api/health through Caddy over HTTPS
  # (the API moved under /api/* in Plan 11g; a bare /health at the edge is now the SPA).
  # ------------------------------------------------------------------------------------------
  caddy:
    image: hmis-prod/web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (443/udp) is deliberately NOT published: the host firewall admits 80/tcp and
      # 443/tcp only, and clients negotiate HTTP/2 over TCP with no loss of function.
    volumes:
      # A DIRECTORY, not the Caddyfile itself, and that is load-bearing. A single-file bind mount
      # is bound to the file's INODE: deploy.sh replacing the file (install(1) unlinks and
      # recreates) leaves the container reading the OLD inode, so the edge silently keeps serving
      # the previous config and a `caddy reload` reloads it. Measured on this box, not reasoned:
      # after a config change the host file hashed one way and /etc/caddy/Caddyfile inside the
      # container still hashed the other. Mounting the directory makes the lookup go through the
      # directory every time, so a replaced file is seen. T4 and T6: same trap, same answer.
      - ./caddy:/etc/caddy:ro
      # ACME account keys and issued certificates. Without this volume every restart would ask
      # Let's Encrypt for a fresh certificate and hit the rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512m"
        reservations:
          memory: "64m"

  # ------------------------------------------------------------------------------------------
  # node-exporter — host metrics (D9). COMPOSE-NETWORK-INTERNAL ONLY: no `ports:` entry, so it
  # publishes nothing new (D13's port map). Prometheus reaches it by service name over the
  # `hmis-prod` network, which is also why it must listen on 0.0.0.0 (the image's default) rather
  # than loopback — inside ITS OWN container namespace, 127.0.0.1 is unreachable from Prometheus's.
  # `pid: host` and the three read-only host mounts are what let it report the HOST's CPU/memory/
  # disk rather than its own tiny container's.
  # ------------------------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(rootfs/)?(dev|proc|sys|run|var/lib/docker/.+)($$|/)"
    expose:
      - "9100"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "128m"
        reservations:
          memory: "32m"

  # ------------------------------------------------------------------------------------------
  # postgres-exporter — the shipped `scheduler_heartbeats` table read out as
  # `hmis_scheduler_heartbeat_staleness_seconds` (D9, spike finding 6/question D), plus the
  # image's own built-in `pg_up`/`pg_stat_*` collectors. NO NEW INSTRUMENTATION: `queries.yml`
  # is a SELECT against a table Plan 08.5 already shipped.
  #
  # `DATA_SOURCE_NAME` is built from the SAME `POSTGRES_*` values the `db` service's own
  # `environment:` block already interpolates from `/opt/hmis-prod/.env` (compose reads that file
  # for `${...}` substitution because deploy.sh runs it with `--project-directory` pointed there)
  # — GC2 is satisfied by reusing that value, never by adding a second credential anywhere.
  # `sslmode=disable` because this connection never leaves the compose network's own bridge.
  # ------------------------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:?set POSTGRES_USER in the deploy .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deploy .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in the deploy .env}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
      # A DIRECTORY, per T3-1/T4-9's measured inode lesson: a single-file bind mount is pinned to
      # the file's inode, and deploy.sh's `install(1)` replaces the inode on every config update.
      - ./postgres-exporter:/etc/postgres-exporter:ro
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "128m"
        reservations:
          memory: "32m"

  # ------------------------------------------------------------------------------------------
  # prometheus — scrapes itself, node-exporter and postgres-exporter over the compose network;
  # evaluates prometheus/alerts.yml (D9 + flag ⑨). `127.0.0.1` ONLY (D13's port map): reached by
  # SSH tunnel, never the public interface. `--web.enable-lifecycle` is what lets a config or
  # rule-file edit take effect on a redeploy WITHOUT recreating the container (the README's
  # monitoring section names the reload call) — `docker-compose.prod.yml` gained no new
  # dependency to get it; it is a flag the shipped image already understands.
  # ------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    volumes:
      # A DIRECTORY: prometheus.yml AND alerts.yml both live under it (T3-1's lesson, again).
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - node-exporter
      - postgres-exporter
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"
        reservations:
          memory: "128m"

  # ------------------------------------------------------------------------------------------
  # grafana — the provisioned dashboard (D9). `127.0.0.1` ONLY, same reasoning as prometheus
  # above. Datasource and dashboard are FILE-PROVISIONED (grafana/provisioning/), never clicked
  # together by hand, so a fresh container comes up already wired to Prometheus.
  #
  # NO ADMIN PASSWORD IS SET HERE, AND THAT IS DELIBERATE, NOT AN OVERSIGHT (GC2): this task's
  # Files list does not include deploy.sh's credential-minting block (D13's pgBackRest cipher
  # passphrase is the only secret deploy.sh mints, and "change nothing else" in that file is the
  # brief's own instruction), so there is nowhere for a generated Grafana password to be
  # escrowed. Grafana's stock default (admin/admin, forced change on first login) is what ships;
  # the README's monitoring section makes changing it on first tunnel login step one. The surface
  # is loopback-only either way — no public port is added by this service.
  # ------------------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "256m"
        reservations:
          memory: "64m"

  # ------------------------------------------------------------------------------------------
  # alertmanager — Plan 11c / D10. THE NINTH SERVICE, and the one that makes the other eight
  # worth running: until it existed, every rule in prometheus/alerts.yml evaluated correctly,
  # turned red on a page nobody had open, and reached NO HUMAN BEING. `severity: critical` now
  # leaves the box as email, immediately; `warning` is batched. The routing lives in
  # alertmanager/alertmanager.yml.tpl (placeholders — GC2, the repo is public) and deploy.sh
  # renders it into $DEPLOY_DIR/alertmanager/ from the owner's /opt/hmis-prod/.env.smtp.
  #
  # `127.0.0.1` ONLY, like prometheus and grafana above (D13's port map). The published port is
  # for `amtool` on the box and for an SSH tunnel; Prometheus reaches this service by NAME over
  # the compose network and does not use the publication at all.
  #
  # THE NAMED VOLUME IS NOT OPTIONAL AND IT IS NOT TIDINESS — it was MEASURED (11c spike):
  # `prom/alertmanager:v0.27.0` declares `VOLUME /alertmanager` in its own image. Without a named
  # volume here, docker creates a fresh ANONYMOUS volume on every recreate — the silence log and
  # the notification log are lost each time (so a silenced 03:00 alert un-silences itself on the
  # next deploy, and a notification already sent is sent again), and the box accumulates one
  # orphaned volume per deploy for ever. Plan 11a's gate report §7.8 rejected a task over exactly
  # this specimen with prometheus. `alertmanager_data` below is the ONE new entry the production
  # volume roster gains.
  #
  # `--cluster.listen-address=` (EMPTY, deliberately) disables the gossip listener. There is one
  # replica on one box; leaving the cluster port listening would be a service nobody uses and a
  # startup log full of peer-discovery noise on every boot.
  # ------------------------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="
    volumes:
      # A DIRECTORY, the same lesson as caddy/, pgbackrest/ and prometheus/ (T3-1's measured
      # inode trap): alertmanager.yml AND the smtp_password file both live under it, and
      # deploy.sh's install(1)/write replaces their inodes on every run.
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "256m"
        reservations:
          memory: "64m"

volumes:
  # Named inside the `hmis-prod` project, so the real volume is `hmis-prod_hmis_prod_pgdata` —
  # a different object from dev's `hmis_hmis_pgdata`, which nothing here may touch (rule 7).
  hmis_prod_pgdata:
  # There is no repo volume: repo1 is S3 (R2 today, MinIO on the NAS at stage 3), which is where
  # D4's destination flexibility belongs. Only pgBackRest's local log survives the container.
  pgbackrest_log:
  caddy_data:
  caddy_config:
  # T6/D9. TSDB and the dashboard/session DB — without these a container recreate would lose a
  # year of history and every hand-tweak to the provisioned dashboard alike.
  prometheus_data:
  grafana_data:
  # Plan 11c / D10 — the silence log and the notification log. MEASURED, not stylistic: the
  # v0.27.0 image declares `VOLUME /alertmanager`, so with no named volume here every recreate
  # strands a fresh anonymous volume AND forgets which alerts it has already sent and which the
  # operator silenced. See the service's own comment above.
  alertmanager_data:
