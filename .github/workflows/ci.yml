name: ci
# 2026-09-02: four jobs in parallel instead of one `pnpm verify`. The one-job form took 35–51 min
# because core's jest ran alone after typecheck+lint; now static checks, two core shards and web
# run side by side, and a newer push to the same ref cancels the older run. These job names are
# the required checks on `main`'s branch protection — rename them there too if you rename here.
on:
  push:            # every branch: a lane gets its verdict before the PR exists
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # THE PRINT RELAY IS A DEPENDENCY-FREE .mjs OUTSIDE BOTH TEST PROJECTS, so until FD-25 nothing
      # in this repository ever executed it: `tools/` is not a workspace package, so `pnpm typecheck`
      # never reads it despite the `// @ts-check` at its head, and apps/core's jest rootDir and
      # apps/web's vitest root each stop at their own package. Its own `--self-test` had been a guard
      # nobody ran since the day it was written — which is how a `JSON.parse` outside a try survived
      # in the one process that turns a queued job into paper.
      #
      # A STEP in `static`, deliberately, and not a job: the required checks on main's branch
      # protection are `static`, `core` and `web`, and adding a fourth name would need that setting
      # changed in lockstep across eight lanes. ~3 s, no services.
      #
      # THE TWO END-TO-END CHECKS ARE SKIPPED HERE ON PURPOSE, AND THE SKIP IS FORCED RATHER THAN
      # ASSUMED. An earlier version of this comment claimed `ubuntu-latest` has no chromium and let
      # the test decide for itself. That was FALSE — actions/runner-images symlinks
      # /usr/local/share/chromium/chrome-linux/chrome to /usr/bin/chromium in
      # install-google-chrome.sh, and the image readme lists Chromium under Browsers and Drivers. So
      # those two checks would have RUN: spawning a headless browser, scraping a `ws://` URL out of
      # stderr, speaking raw CDP, and waiting on a hard-coded 900 ms layout settle — inside a
      # REQUIRED check, where a monthly runner-image bump that moves any one of those reddens `main`
      # for all eight lanes at once, and freezes every merge.
      #
      # `RELAY_CHROMIUM` is the switch the test already honours, so pointing it at a path that
      # cannot exist makes the skip deterministic and makes this comment true: 13 of 15 gate in CI,
      # all 15 gate on the build host, and nothing in a required check launches a browser.
      # Gating the other two would need a pinned browser, not the image's — that is its own change.
      - run: node --test tools/print-relay/spool.test.mjs
        env:
          RELAY_CHROMIUM: /nonexistent-chromium-ci-forces-the-skip

  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hmis
          POSTGRES_PASSWORD: hmis
          POSTGRES_DB: hmis_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hmis" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://hmis:hmis@localhost:5433/hmis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hmis/contracts test
        if: matrix.shard == 1
      - run: pnpm --filter @hmis/core exec jest -w 2 --shard=${{ matrix.shard }}/2

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hmis/web test
      # THE WEB APP WAS NEVER BUILT IN CI, AND THAT IS HOW A BROKEN `styles.css` REACHED `main`.
      #
      # `vitest` does not compile CSS: it resolves `import "./styles.css"` to a stub, so an
      # unterminated comment in that file is invisible to every one of the 649 web tests. PLAN 16c
      # lost one line (`}` plus the `/**` opening the next comment) and shipped green; the front
      # desk's own token block never closed, and the app could not paint AT ALL until it was found
      # by hand in a browser two days later.
      #
      # `vite build` is the cheapest thing that would have caught it — it runs Tailwind for real,
      # resolves every import and type-checks nothing that `tsc` already covers. ~10s.
      - run: pnpm --filter @hmis/web run build
