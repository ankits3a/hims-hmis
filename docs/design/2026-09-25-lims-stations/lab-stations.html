<title>Lab Reception Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Paper & Pine, as on the owner-approved boards. One light theme by choice. */
:root {
  --paper:#f4f7f4; --card:#ffffff; --ink:#132420; --line:#dfe7e1; --line2:#ecf1ed; --dim:#5c6f66; --wash:#eef3ef;
  --green:#0e6b4e; --green-soft:rgba(14,107,78,.08); --green-line:rgba(14,107,78,.35);
  --gold:#dd8f1c; --gold-ink:#9a6208; --gold-soft:rgba(221,143,28,.10); --gold-line:rgba(221,143,28,.45);
  --red:#b23a30; --red-soft:rgba(178,58,48,.08); --red-line:rgba(178,58,48,.4);
  --agent:#132420; --agent-fg:#d9efe4; --agent-dim:#9dbdae; --mint:#35c48f;
  --sans:'IBM Plex Sans', 'IBM Plex Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; background: var(--paper); }
body { margin: 0; color: var(--ink); font: 13.5px/19px var(--sans); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; text-align: left; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.mo { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tag { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.kb { display: inline-flex; align-items: center; justify-content: center; height: 16px; min-width: 20px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); background: var(--card); font-family: var(--mono); font-size: 9px; font-weight: 600; color: var(--dim); flex-shrink: 0; }
.kb.g { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #d6ece1; }
.kb.dk { border-color: #2c443a; background: #1c332b; color: var(--agent-dim); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 23px; padding: 0 9px; border-radius: 4px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--dim); white-space: nowrap; }
.pill.on { border-color: var(--green-line); background: var(--green-soft); color: var(--green); }
.pill.gd { border-color: var(--gold-line); background: var(--gold-soft); color: var(--gold-ink); }
.pill.rd { border-color: var(--red-line); background: var(--red-soft); color: var(--red); }
.pill.ink { border-color: var(--ink); color: var(--ink); }
.pill.sm { height: 20px; padding: 0 7px; font-size: 10px; }
button.pill:hover { border-color: var(--green-line); }
.stamp { display: inline-flex; padding: 2px 10px; border-radius: 4px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; white-space: nowrap; }
.stamp.pd { border: 2px solid var(--green); color: var(--green); }
.stamp.un { border: 2px solid var(--gold); color: var(--gold-ink); }
.pri { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 6px; background: var(--green); color: #f2faf6; font-size: 13px; font-weight: 600; border: 1px solid var(--green); white-space: nowrap; }
.pri:hover { background: #0b5a41; }
.pri.big { height: 44px; padding: 0 20px; font-size: 13.5px; }
.pri[aria-disabled="true"] { background: var(--line); color: var(--dim); }
.pri:disabled { background: var(--line); border-color: var(--line); color: var(--dim); cursor: not-allowed; }
.sec { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.sec:hover { border-color: var(--dim); }
.sec.grn { border-color: var(--green); color: var(--green); font-weight: 600; }
.sec.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.sec:disabled { opacity: .5; cursor: not-allowed; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.in { height: 40px; width: 100%; border-radius: 6px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-size: 14px; }
select.in { padding-right: 8px; }
.in.sm { height: 32px; font-size: 13px; }
.in:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.agchip { display: flex; align-items: flex-start; gap: 9px; padding: 9px 11px; border-radius: 6px; background: var(--agent); color: var(--agent-fg); font-size: 11.5px; line-height: 17px; }
.agchip b { color: #fff; font-weight: 600; }
.agchip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); flex-shrink: 0; margin-top: 6px; }
.agdo { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 5px; background: var(--mint); color: #0b2018; font-size: 11px; font-weight: 700; flex-shrink: 0; white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex-grow: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.dim { color: var(--dim); }

/* ── three columns: patient lane · work · patient list ── */
.app { height: 100%; display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: 46px minmax(0,1fr) 58px; }
.top { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--card); border-bottom: 1px solid var(--line); min-width: 0; position: relative; }
.brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.dia { width: 10px; height: 10px; border-radius: 2px; background: var(--green); transform: rotate(45deg); flex-shrink: 0; }
.bn { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.nav { display: flex; gap: 2px; margin-left: 8px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nv { height: 30px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.nv:hover { background: var(--wash); color: var(--ink); }
.nv[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--green); }
.nv .n { font-family: var(--mono); font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--gold-soft); color: var(--gold-ink); }
.nvbtn { display: none; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; }
.navdrop { position: absolute; top: 44px; left: 12px; z-index: 45; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 28px rgba(19,36,32,.16); padding: 6px; display: grid; min-width: 230px; }
.navdrop .nv { justify-content: space-between; height: 34px; }
.iconbtn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 5px; border: 1px solid var(--line); color: var(--dim); flex-shrink: 0; }
.vr { width: 1px; height: 22px; background: var(--line); flex-shrink: 0; }
.who { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.av { width: 26px; height: 26px; border-radius: 50%; background: var(--green-soft); border: 1px solid var(--green-line); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
.listbtn { display: none; }
.body { display: grid; grid-template-columns: 296px minmax(0,1fr) 352px; min-height: 0; position: relative; }
.lane { border-right: 1px solid var(--line); background: var(--card); overflow-y: auto; min-height: 0; }
.centre { min-width: 0; min-height: 0; overflow-y: auto; padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.centre > * { flex-shrink: 0; }
.right { border-left: 1px solid var(--line); background: var(--paper); overflow-y: auto; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.right > * { flex-shrink: 0; }
.scrim { display: none; }
@media (max-width: 1279px) {
  .body { grid-template-columns: 272px minmax(0,1fr); overflow: hidden; }
  .right { position: absolute; top: 0; right: 0; bottom: 0; width: min(352px, 100vw); z-index: 30; transform: translateX(105%); box-shadow: -12px 0 32px rgba(19,36,32,.18); }
  .app.list-open .right { transform: none; }
  .app.list-open .scrim { display: block; position: absolute; inset: 0; z-index: 20; background: rgba(19,36,32,.28); }
  .listbtn { display: inline-flex; }
  .hide-lg { display: none !important; }
}
@media (max-width: 1099px) { .nav { display: none; } .nvbtn { display: inline-flex; } }
@media (max-width: 899px) {
  .body { display: block; overflow-y: auto; overflow-x: hidden; }
  .lane { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .centre { overflow: visible; padding-inline: 16px; }
  .right { position: fixed; top: 46px; bottom: 58px; }
  .hide-md { display: none !important; }
}
@media (max-width: 720px) {
  .top { gap: 8px; padding: 0 12px; }
  .hide-sm { display: none !important; }
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  .tiles > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .nextcard { flex-direction: column; align-items: stretch !important; }
  h1.hello { font-size: 21px !important; line-height: 27px !important; }
}
/* the lane: whoever is in hand */
.lane-pad { padding: 18px 18px 26px; }
.lane-p { margin: 9px 0 0; font-size: 12.5px; line-height: 18px; color: var(--dim); }
.lane .tag { display: block; }
.lane .sect { margin-top: 20px; }
.kvr { display: flex; align-items: baseline; gap: 8px; margin-top: 7px; }
.kvr span { flex-grow: 1; font-size: 12.5px; color: var(--dim); }
.kvr b { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.vrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 4px; border-top: 1px solid var(--line2); }
.vrow:hover { background: var(--wash); }
.vrow.sel { background: var(--green-soft); box-shadow: inset 3px 0 0 var(--green); }
.vrow .when { width: 56px; flex-shrink: 0; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.vrow .l1 { display: block; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .l2 { display: block; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flowbars { display: flex; gap: 5px; margin-top: 16px; }
.flowbars i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.flowbars i.done { background: var(--green); }
.flowbars i.cur { background: var(--ink); }
.lane-toggle { display: none; margin-top: 14px; width: 100%; }
@media (max-width: 899px) { .lane-toggle { display: inline-flex; } .lane-more:not(.open) { display: none; } .lane-pad { padding-bottom: 16px; } }
.src { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .1em; padding: 1px 6px; border-radius: 3px; background: var(--wash); color: var(--dim); flex-shrink: 0; white-space: nowrap; }
.src.em { background: var(--red-soft); color: var(--red); }
.src.rp { background: var(--green-soft); color: var(--green); }
.src.rf, .src.hm { background: var(--gold-soft); color: var(--gold-ink); }
/* ── centre ── */
h1.hello { margin: 0; font-size: 25px; line-height: 31px; font-weight: 600; letter-spacing: -.012em; text-wrap: balance; }
h1.tk { margin: 0; font-size: 19px; line-height: 25px; font-weight: 700; letter-spacing: -.01em; }
.sub { margin: 3px 0 0 0; font-size: 12.5px; color: var(--dim); }
.brief { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 8px; padding: 12px 14px; display: flex; gap: 11px; align-items: flex-start; }
.brief p { margin: 5px 0 0 0; font-size: 12.5px; line-height: 18px; }
.scanbox { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 10px; border: 2px dashed var(--green-line); background: var(--green-soft); }
.results { display: grid; }
.scanacts { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 11px; border-top: 1px dashed var(--green-line); }
.sact { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 6px; background: var(--card); border: 1px solid var(--green-line); color: var(--green); font-size: 12.5px; font-weight: 500; }
.sact:hover { background: var(--green); color: #f2faf6; border-color: var(--green); }
.res { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line2); width: 100%; }
.res:hover { background: var(--wash); }
.nextcard { display: flex; align-items: center; gap: 18px; padding: 15px 16px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
@media (max-width: 1400px) { .tiles { grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); } }
.tile { padding: 11px 12px 12px 12px; }
.tile .v { margin-top: 7px; font-family: var(--mono); font-size: 22px; line-height: 24px; font-weight: 600; letter-spacing: -.02em; }
.tile .nt { margin-top: 3px; font-size: 11px; color: var(--dim); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px 10px 14px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 13px; font-weight: 600; }
.tablist { display: flex; gap: 4px; padding: 10px 16px 0 16px; border-bottom: 1px solid var(--line2); overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 6px 6px 0 0; font-size: 12.5px; margin-bottom: -1px; font-weight: 500; color: var(--dim); border: 1px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { font-weight: 600; color: var(--green); border: 1px solid var(--line2); border-bottom-color: var(--card); background: var(--card); }
.tab .mo { font-size: 10.5px; opacity: .75; }
.ptabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.ptabs .tab[aria-selected="true"] { border-color: var(--line); border-bottom-color: var(--paper); background: var(--paper); }
.nrow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line2); }
.nrow:last-child { border-bottom: 0; }
.nrow .ref { width: 92px; flex-shrink: 0; font-size: 11px; color: var(--dim); }
.nrow .w { font-size: 12.5px; font-weight: 500; }
.nrow .y { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
@media (max-width: 720px) { .nrow { flex-wrap: wrap; } .nrow .ref { width: auto; } }
.empty { padding: 16px; font-size: 12.5px; color: var(--dim); }
.qa { display: flex; gap: 8px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); font-weight: 500; }
.back:hover { color: var(--ink); }
.pstrip { display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start; flex-wrap: wrap; }
.pav { width: 44px; height: 44px; border-radius: 6px; background: var(--wash); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--dim); flex-shrink: 0; }
.pname { font-size: 16px; font-weight: 600; }
.pmeta { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 2px; }
.tblw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; padding: 9px 12px; background: var(--wash); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .r { text-align: right; }
table.t tr.grp td { background: var(--paper); font-size: 11.5px; font-weight: 600; padding-block: 7px; }
table.t tr.muted td { color: var(--dim); }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--wash); }
.cap { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(19,36,32,.18); display: inline-block; }
.tube { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.enc { padding: 12px 14px; border-top: 1px solid var(--line2); display: grid; gap: 7px; }
.enc:first-of-type { border-top: 0; }
.chk { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 500; color: var(--dim); text-align: left; }
.chk[aria-pressed="true"] { border-color: var(--green-line); background: var(--green-soft); color: var(--green); font-weight: 600; }
.chk .bx { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 500; color: var(--dim); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--green); color: #f2faf6; font-weight: 600; }
.checks { display: grid; gap: 8px; padding: 12px 14px; }
.checkrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.checkrow .lbl { flex: 1 1 220px; font-size: 12.5px; }
.checkrow .lbl small { display: block; color: var(--dim); font-size: 11.5px; }
.bill { display: grid; }
.bl { display: flex; align-items: baseline; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line2); font-size: 12.5px; }
.bl .a { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bl.tot { border-top: 2px solid var(--ink); font-weight: 600; font-size: 14px; }
.bl.tot .a { font-size: 20px; letter-spacing: -.02em; }
.actbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.actbar .note { font-size: 12px; color: var(--dim); flex: 1 1 260px; }
.refuse { border: 1px solid var(--red-line); background: var(--red-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.refuse code { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--red); white-space: nowrap; }
.warnline { border: 1px solid var(--gold-line); background: var(--gold-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.drop { position: relative; }
.drop-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 28px rgba(19,36,32,.14); max-height: 300px; overflow-y: auto; }
.drop-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line2); width: 100%; }
.drop-item:first-child { border-top: 0; }
.drop-item:hover, .drop-item.act { background: var(--wash); }
.slip { width: 280px; max-width: 100%; background: #fff; border: 1px dashed #b9c8bf; border-radius: 4px; padding: 14px 16px 16px; font-family: var(--mono); font-size: 11px; line-height: 16px; }
.slip .big { font-size: 46px; line-height: 50px; font-weight: 700; text-align: center; margin: 6px 0 2px; }
.slip hr { border: 0; border-top: 1px dashed #c9d6ce; margin: 9px 0; }
.slip .c { text-align: center; }
.inl { padding: 12px 14px; background: var(--paper); border-top: 1px solid var(--line2); display: grid; gap: 10px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.formgrid label { display: grid; gap: 5px; }
.downbar { background: var(--gold); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; font-weight: 500; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ── right rail ── */
.clocks { border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--card); }
.clocks-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: var(--agent); color: var(--agent-fg); }
.clocks-h b { font-size: 12.5px; font-weight: 600; flex-grow: 1; }
.crow { display: flex; align-items: flex-start; gap: 11px; padding: 10px 14px; border-top: 1px solid var(--line2); }
.crow .d { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.crow .w { font-size: 12.5px; font-weight: 500; }
.crow .y { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.crow .c { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }

/* ── right rail ── */
function readyTimes(p) {
  const o = p.order, base = o && o.raisedAt ? o.raisedAt : now();
  const at = tat => { const m = /^(\d+) h$/.exec(tat); if (m) return 'today ' + hm(base + (+m[1]) * 3600 + 1200); if (tat === 'same day') return 'today 16:30'; if (tat === 'next day') return 'tomorrow 18:00'; const d = /^(\d+) days$/.exec(tat); if (d) return 'in ' + d[1] + ' days'; return tat; };
  const g = {};
  for (const c of lineCodes(o)) { const k = at(C[c].tat); (g[k] = g[k] || []).push(c); }
  const rank = k => k.startsWith('today') ? k : k.startsWith('tomorrow') ? 'x' + k : 'y' + k.padStart(12, '0');
  return Object.entries(g).sort((a, b) => rank(a[0]) < rank(b[0]) ? -1 : 1);
}
function sayText(p) {
  const o = p.order, m = money(p), n = lineCodes(o).length, first = p.n.split(' ')[0].replace('Mohd.', 'Mohd');
  const rt = readyTimes(p), last = rt.length ? rt[rt.length - 1][0] : '';
  const fast = checksFor(p).some(c => c.id === 'fast');
  const wa = o.channels.includes('whatsapp');
  if (S.sayLang === 'hi') return `${first} जी, आपकी ${n} जांचें हैं। ` + (m.ub.length && !PAYER[p.payer].credit ? (m.due > 0 ? `${rupee(m.due)} अभी देने हैं` : 'पूरा पैसा') + (m.wal ? `, ${rupee(m.wal)} आपके वॉलेट से कटेंगे` : '') + '। ' : 'पैसे जमा हो चुके हैं। ') + (fast ? 'आप खाली पेट हैं, यह ठीक है। ' : '') + `टोकन मिलते ही कलेक्शन, चेयर 1 पर जाइए। रिपोर्ट ${last.replace('today', 'आज').replace('tomorrow', 'कल').replace('in ', '').replace(' days', ' दिन में')} तक ${wa ? 'WhatsApp पर आ जाएगी' : 'काउंटर पर मिलेगी'}।`;
  return `${first}, you have ${n} test${n > 1 ? 's' : ''}. ` + (m.ub.length && !PAYER[p.payer].credit ? (m.due > 0 ? `${rupee(m.due)} to pay now` : 'Nothing to pay in cash') + (m.wal ? `; ${rupee(m.wal)} comes from your wallet` : '') + '. ' : 'Payment is done. ') + (fast ? 'Being fasting is right for these tests. ' : '') + `After the token, go to Collection, chair 1. The report ${wa ? 'comes on WhatsApp' : 'is ready at this counter'} ${last}.`;
}
function copilotHTML(p) {
  const o = p.order;
  const items = [];
  if (o) {
    for (const n of copilotNotes(p)) { if ((n.act && n.act.do === 'applyPkg') || /No package/.test(n.text)) continue; items.push([/serves both/.test(n.text) ? 'ok' : 'warn', n.text, n.act]); }
    const ch = checksFor(p);
    const f = ch.find(c => c.id === 'fast'); if (f && p.lastMeal) items.push(['ok', 'Fasting since <b>' + p.lastMeal + '</b>: ' + f.sub.split(' · ')[1] + '. Fasting tests are valid.']);
    if (ch.some(c => c.id === 'consent')) items.push(['warn', '<b>HIV 1 & 2</b> needs counselling and a recorded consent before the draw. The report goes in person only.']);
    if (ch.some(c => c.id === 'am')) items.push(['warn', 'A morning-only test is in the order and it is past 9 am.']);
    if (PAYER[p.payer].credit) items.push(['ok', '<b>' + PAYER[p.payer].n + '</b>: ' + PAYER[p.payer].note + '. No money at the counter.']);
    if (p.wallet && !PAYER[p.payer].credit) items.push(['ok', 'Wallet holds <b>' + rupee(p.wallet) + '</b>. Deduct only; it cannot take a deposit here.']);
  }
  const pendV = p.today.filter(e => e.id !== S.pvisit && !(p.orders && p.orders[e.id] && p.orders[e.id].ticket));
  if (pendV.length && !p.unregistered) items.unshift(['warn', `<b>${pendV.length} more visit${pendV.length > 1 ? 's' : ''} today:</b> ${pendV.map(e => DOC[e.doc].dept + ' (' + docN(e.doc) + ')').join(', ')}. Start ${pendV.length > 1 ? 'them' : 'it'} from the left lane; ${pendV.length > 1 ? 'they join' : 'it joins'} the same token.`]);
  if (p.unregistered) items.push(['warn', '<b>Not registered.</b> The front desk creates the UHID and bills; this counter does not register patients.']);
  if (p.status === 'pickup') { const r = p.reports[0]; items.push([r.status === 'held' ? 'warn' : 'ok', r.status === 'held' ? `Report <b>${r.id}</b> is held: ${rupee(r.due)} unpaid. Collect it, then print.` : r.status === 'amended' ? `Report <b>${r.id}</b> was amended; <b>v${r.v}</b> is the one to hand over.` : `Report <b>${r.id}</b> is ready. Check who is collecting before you print.`]); }
  if (!o && S.rel && p.reports[0]) { const r0 = p.reports[0], e = relE(p.id, r0.id);
    if (e) { if (e.restricted) items.push(['warn', 'In person only: counselling recorded first, the patient alone, ID card seen, a sealed envelope. Never by message.']);
      else if (e.st === 'read') items.push(['ok', `Already read on WhatsApp at <b>${hm(e.readAt)}</b>. Print only if paper is asked for.`]);
      else if (e.fallback || e.noWA) items.push(['warn', 'WhatsApp failed on this number; an SMS link went instead. Ask if another number has WhatsApp.']);
      if (e.abn) items.push(['warn', `Abnormal result${e.abnNote || e.note ? ': <b>' + esc(e.abnNote || e.note) + '</b>' : ''}. The doctor has it on screen; tell the patient to see the doctor today.`]);
      if (e.partial) items.push(['ok', esc(e.partial) + '. It will come as the next version, the same way.']); } }
  if (p.links.length) items.push(['ok', p.links.length + ' family member' + (p.links.length > 1 ? 's' : '') + ' share this phone. Every linked number receives reports; HIV results never go by message.']);
  const adv = o ? pkgAdvice(p) : null;
  const value = !o ? '' : adv ? `<div class="valcard"><b>${adv.k.n}</b> covers ${adv.cov.join(', ')} for <b>${rupee(adv.k.p)}</b> instead of ${rupee(adv.ala)}. <b style="color:var(--mint)">Saves ${rupee(adv.save)}.</b>${adv.extra.length ? ' Also includes ' + adv.extra.map(c => C[c].n).join(', ') + ': optional, nobody prescribed it.' : ''}<div style="margin-top:8px"><button class="agdo" data-do="applyPkg" data-arg="${p.id}|${adv.k.code}">Offer the package</button></div></div>` : `<div class="valcard">${PAYER[p.payer].credit ? 'Credit patient: packages do not apply.' : unbilled(o).length ? 'No package is cheaper than the tests as ordered.' : 'Everything is paid; nothing to compare.'}</div>`;
  const rt = o && liveL(o).length ? readyTimes(p) : [];
  const quick = o ? ['What does the patient pay?', 'When will the report be ready?', 'Is there a cheaper package?'] : ['Which report is the latest?', 'Who else is on this phone?'];
  return `<section class="cop${Date.now() - S.zoom < 450 ? ' zoom' : ''}" aria-label="Counter copilot"><div class="cop-h"><span class="pulse"></span><b>Copilot</b><span>for ${esc(p.n)}</span></div>` +
    (items.length ? `<div class="cop-sec"><span class="tag">Checked for you</span>${items.map(x => `<div class="ci ${x[0]}"><i>${x[0] === 'ok' ? '✓' : '!'}</i><div>${x[1]}${x[2] ? `<div><button class="agdo" data-do="${x[2].do}" data-arg="${esc(x[2].arg)}">${x[2].label}</button></div>` : ''}</div></div>`).join('')}</div>` : '') +

  const due = now() + e.left, hod = -e.left > 900, d = supDraft(e);
  return `<div class="chead"><div><h1>${esc(e.plain)}</h1><div class="dim" style="font-size:12.5px;margin-top:2px">${e.st} · owner ${esc(e.owner)} · <span style="color:var(--red)" data-due="${due}">over ${clockText(-e.left)}</span></div></div></div>` +
    `<section class="box"><div class="ck"><span class="t">${esc(plainTxt(e.detail))}</span></div>` +
    `<div class="ck"><span class="t">Escalation chain<small>1 · ${esc(e.owner)} was on it · 2 · you at ${hm(due)} · 3 · ${STAFF.hod.n}, head of department, at ${hm(due + 900)}${hod ? ' <b style="color:var(--red)">(paged)</b>' : ''}</small></span></div></section>` +
    `<section class="step"><div class="step-h"><h2>Act</h2><span class="dim">every escalation needs one; it is logged with your name</span></div><div class="box">` +
    (e.doo && !NAVDOO.includes(e.doo) ? `<div class="ck"><span class="t"><b>Do it now:</b> ${esc(e.act)}<small>the same act the station would take</small></span>${btn(esc(e.act) + ' ' + kbE, 'supDo', e.k, 'pri sm', ' data-primary')}</div>` : '') +
    `<div class="ck"><span class="t"><b>Page:</b> ${d.act.replace(/^Page /, '')}<small>the copilot’s draft; the page carries the escalation</small></span>${btn(d.act, 'supPage', e.k, e.doo && !NAVDOO.includes(e.doo) ? 'sec sm' : 'pri sm', e.doo && !NAVDOO.includes(e.doo) ? '' : ' data-primary')}</div>` +
    `<div class="ck"><span class="t"><b>Take it over</b><small>opens it at ${e.st.toLowerCase()} so you act yourself</small></span>${btn('Open at ' + e.st.toLowerCase(), 'supTake', e.k, 'sec sm')}</div>` +
    `<div class="ck" style="flex-wrap:wrap"><span class="t"><b>Accept the delay</b><small>goes on the quality register with your reason</small></span><select id="sa-why" class="in sm" style="width:auto"><option value="">Why</option><option>Waiting on the clinician, not the lab</option><option>Instrument fault, engineer on the way</option><option>Patient not available</option><option>Batch run scheduled; target not applicable</option></select>${btn('Accept', 'supAccept', e.k, 'sec sm')}</div></div></section>` + refusalHTML();
}
function supCentreHTML() {
  if (S.view === 'sapprove') return supApproveHTML();
  if (S.view === 'week') return supWeekHTML();
  if (S.view === 'roster') return supRosterHTML();
  if (S.sup.inHand) return supEscCentre(supFind(S.sup.inHand));
  return supNowHTML();
}
const NAV_S = [['counter', 'Now'], ['sapprove', 'Approvals'], ['week', 'Quality week'], ['roster', 'Roster']];
function supHeaderHTML() {
  const items = NAV_S.map(([k, l]) => `<button class="nv" data-do="view" data-arg="${k}"${S.view === k ? ' aria-current="page"' : ''}>${l}${k === 'sapprove' && S.approvals.some(a => a.status === 'pending') ? `<span class="n">${S.approvals.filter(a => a.status === 'pending').length}</span>` : ''}</button>`).join('');
  const crit = S.bench.items.filter(b => b.crit && !b.crit.closed), es = supEsc();
  return `<div class="brand"><span class="dia"></span><span class="mo bn">LAB</span></div>${stationSwitch()}` +
    `<nav class="nav" aria-label="Supervisor">${items}</nav><button class="nvbtn" data-do="navToggle" aria-expanded="${!!S.navOpen}" aria-label="Menu">${I.menu}<span class="hide-sm">Menu</span></button>` +
    (S.navOpen ? `<div class="navdrop">${stationMenu()}${items}</div>` : '') + '<div class="grow"></div>' +
    (crit.length ? `<button class="pill rd hide-sm" style="height:26px" data-do="supGo" data-arg="bench">${crit.length} critical<span class="hide-md">call${crit.length > 1 ? 's' : ''} open</span></button>` : '') +
    (es.length ? `<button class="pill gd" style="height:26px" data-do="supOpen" data-arg="${es[0].k}">${es.length} escalated</button>` : '') +
    `<button class="pill ink listbtn" style="height:26px" data-do="listToggle">${S.sup.inHand ? 'Copilot' : 'Escalations ' + es.length}</button>` +
    `<span class="mo hide-lg" style="font-size:11.5px;color:var(--dim)"><span id="clk">${hm(now())}</span> IST</span><div class="vr hide-sm"></div>` +
    `<div class="who"><div class="av">MD</div><div class="hide-md"><div style="font-size:12px;font-weight:600;line-height:14px">Meenakshi Das</div><div class="tag" style="font-size:9px">lab supervisor</div></div></div>`;
}
function supLaneHTML() {
  const e = S.sup.inHand ? supFind(S.sup.inHand) : null;
  if (e) {
    const b = e.st === 'Bench' ? bI(e.id) : e.st === 'Verify' ? vI(e.id) : null, p = b ? pt(b.pid) : e.st === 'Reception' && e.id ? pt(e.id) : e.st === 'Collection' && e.id ? pt((colItem(e.id) || {}).pid) : null;
    return `<div class="lane-pad"><span class="tag">escalation in hand</span><div style="font-size:15px;font-weight:600;margin-top:8px">${esc(e.plain)}</div><div class="row" style="margin-top:10px;gap:6px"><span class="src">${e.st.toUpperCase()}</span><span class="pill rd">over ${clockText(-e.left)}</span>${-e.left > 900 ? '<span class="pill rd">head of department paged</span>' : ''}</div>` +
      (p ? `<div class="sect"><span class="tag">patient</span><div style="display:flex;gap:11px;margin-top:8px"><div class="pav">${p.restricted ? '••' : ini(p.n)}</div><div style="min-width:0"><div style="font-weight:600">${esc(p.n)}</div><div class="mo dim" style="font-size:11px">${p.age} ${p.sex} · ${p.uhid}</div></div></div></div>` : '') +
      `<div class="sect"><span class="tag">owner</span><p class="lane-p" style="font-size:12.5px">${esc(e.owner)}</p></div>` +
      `<div class="sect"><span class="tag">what the station shows</span><p class="lane-p" style="font-size:12px">${esc(plainTxt(e.detail))}</p></div>` +
      `<div style="display:grid;gap:6px;margin-top:22px">${btn('Back to the floor <span class="kb">Esc</span>', 'supClear', '', 'sec', ' style="width:100%"')}</div></div>`;
  }
  const onDuty = ROSTER.map(([g, ppl]) => [g, ppl.filter(x => x[2].startsWith('on')).length, ppl.length]);
  return `<div class="lane-pad"><span class="tag">nothing in hand</span><p class="lane-p">Everything that ran out of time at any station is on the right, oldest first. Open one and act on it; a view alone does not count.</p>` +
    `<div class="sect"><span class="tag">on duty</span>${onDuty.map(d => `<div class="kvr"><span>${d[0]}</span><b>${d[1]}/${d[2]}</b></div>`).join('')}</div>` +
    `<div class="sect"><span class="tag">benches</span>${['BIOCHEM-2', 'SERO-1', 'CP-1'].map(n => `<div class="kvr"><span>${n}</span><b style="font-size:12px">${S.sup.benchOpen[n] ? 'open' : 'closed'}</b></div>`).join('')}</div>` +
    `<div class="sect"><span class="tag">today</span>${[['Escalations handled', S.sup.handled], ['Went to the head of department', supEsc().filter(x => -x.left > 900).length], ['Discounts approved', S.approvals.filter(a => a.status === 'approved').length]].map(d => `<div class="kvr"><span>${d[0]}</span><b>${d[1]}</b></div>`).join('')}</div>` +
    `<div class="sect"><span class="tag">keys</span>${[['⏎', 'do the drafted act'], ['Esc', 'back to the floor'], ['/', 'ask the copilot']].map(k => `<div class="row" style="margin-top:7px;gap:8px"><span class="kb">${k[0]}</span><span class="dim" style="font-size:11.5px">${k[1]}</span></div>`).join('')}</div></div>`;
}
function supRightHTML() {
  const es = supEsc(), soon = supSoon();
  const row = e => `<div class="prow${S.sup.inHand === e.k ? ' sel' : ''}" data-do="supOpen" data-arg="${e.k}" role="button" tabindex="0"><span class="grow" style="min-width:0"><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="src ${e.st === 'Bench' && /critical/.test(e.plain) ? 'em' : ''}">${e.st.toUpperCase()}</span><span class="nm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.plain)}</span></span><span class="ln" style="display:block;margin-top:3px">${esc(e.owner)}</span>${-e.left > 900 ? '<span class="row" style="margin-top:5px"><span class="pill sm rd">head of department paged</span></span>' : ''}</span><span class="wt mo" style="color:var(--red)" data-due="${now() + e.left}">over ${clockText(-e.left)}</span></div>`;
  const soonHTML = `<section class="clocks"><button class="fold" data-do="fold" data-arg="sclocks" aria-expanded="${!!S.fold.sclocks}">${I.clock}<b>About to escalate</b><span class="s">${soon.length} within 30 min${soon[0] ? ' · ' + esc(soon[0].plain.replace(/ · .*/, '')) : ''}</span><span class="chev">${I.chev}</span></button>` +
    (S.fold.sclocks ? soon.map(c => `<div class="crow"><span class="d" style="background:${c.left < 300 ? 'var(--gold)' : 'var(--line)'}"></span><div class="grow"><div class="w">${esc(c.plain)}</div><div class="y">${c.st} · ${esc(c.owner)}</div></div><div class="c"><span class="t" data-due="${now() + c.left}">in ${clockText(c.left)}</span><button class="pill sm" data-do="supOpen" data-arg="${c.k}">Open</button></div></div>`).join('') : '') + '</section>';
  const handled = S.sup.ackLog.length ? `<section class="box"><div class="card-h"><h2>Handled by you</h2><span class="dim" style="font-size:11px">${S.sup.ackLog.length} this session</span></div>${S.sup.ackLog.slice(0, 4).map(a => `<div class="lrow"><span class="at">${hm(a.at)}</span><span class="grow"><b>${esc(a.what)}</b> · ${esc(a.how)}</span></div>`).join('')}</section>` : '';
  const e = S.sup.inHand ? supFind(S.sup.inHand) : null;
  if (S.sup.inHand && !S.sup.listExp) return `<button class="plmin" data-do="supListExp" aria-expanded="false"><b>Escalated</b><span class="s">${es.length} on the list</span><span class="chev">${I.chev}</span></button>` + (e ? supCopilotHTML(e) : '') + soonHTML;
  return (S.sup.inHand ? `<button class="plmin" data-do="supListExp" aria-expanded="true"><b>Escalated</b><span class="s">${es.length} on the list</span><span class="chev" style="transform:rotate(180deg)">${I.chev}</span></button>` : '') +
    `<section class="box" style="overflow:hidden"><div class="card-h"><h2>Escalated to you</h2><span class="pill ${es.length ? 'rd' : 'on'} sm">${es.length}</span><span class="grow"></span><span class="dim" style="font-size:11px">most overdue first</span></div>${es.map(row).join('') || '<div class="empty">Nothing has run out of time.</div>'}</section>` + soonHTML + handled;
}
function supCopilotHTML(e) {
  const d = supDraft(e);
  return `<section class="cop${Date.now() - S.sup.zoom < 450 ? ' zoom' : ''}"><div class="cop-h"><span class="pulse"></span><b>Copilot</b><span>for this escalation</span></div><div class="cop-sec"><span class="tag">What I see</span><div class="ci warn"><i>!</i><div>${d.text}</div></div><div class="ci ok"><i>✓</i><div>Owner: ${esc(e.owner)}. It ran out ${span(-e.left)} ago; the head of department is paged at 15 minutes unless you act.</div></div></div>` +
    `<div class="cop-sec"><span class="tag">Drafted act</span><div class="say">${esc(d.act)}</div><div>${btn('Send this page', 'supPage', e.k, 'sec sm')}</div></div>` +
    `<div class="cop-ask">${S.sup.copAns ? `<div class="cop-ans">${S.sup.copAns}</div>` : `<div class="qchips">${['Who covers the signing queue?', 'What does NABL count?'].map(q => `<button data-do="supAsk" data-arg="${esc(q)}">${q}</button>`).join('')}</div>`}<div class="askbox"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9dbdae" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4"/></svg><label for="asks" class="sr">Ask the copilot</label><input id="asks" type="text" autocomplete="off" placeholder="Roster, rules, the NABL file…"><span class="kb dk">⏎</span></div></div></section>`;
}
function supAnswer(q, popup) {
  const s = q.trim().toLowerCase(); if (!s) return; let a;
  if (s.includes('sign') || s.includes('cover')) a = '<b>Signing cover</b>: Dr. R. Iyer holds the queue; Dr. P. Kerketta covers when she is at a frozen section. Nights: the on-call pathologist, and single-operator signatures are counted.';
  else if (s.includes('nabl') || s.includes('indicator') || s.includes('quality')) a = '<b>NABL 112 quality indicators</b>: before analysis (rejection rate, mislabelled tubes, draws without ID scan), during (QC failures, EQAS), after (turnaround, critical call time to read-back, corrected reports). Quality week holds all of them except EQAS, which is not in the system yet.';
  else if (s.includes('discount')) a = '<b>Discounts</b>: the counter never discounts. You approve up to 10% with a reason; more goes to the medical superintendent in writing.';
  else if (s.includes('escalat') || s.includes('hod')) a = '<b>Escalation</b>: the station owner first, you when the clock runs out, the head of department 15 minutes later unless you act. A view alone is not an act.';
  else a = 'I answer by lookup: roster, escalation rules, NABL indicators, discount rules. I draft pages and moves; I never approve or close anything.';
  if (popup) { S.ans = a; $('#answer').innerHTML = `<div class="answer" role="status"><span style="width:6px;height:6px;border-radius:50%;background:var(--mint);margin-top:6px;flex-shrink:0"></span><span class="grow">${a}</span><button class="kb dk" data-do="closeAns" aria-label="Close">Esc</button></div>`; return; }
  S.sup.copAns = a; S.ver++; render(true);
}

seed(); colSeed(); bSeed(); vSeed(); relSeed(); supSeed(); S.station = 'reception'; render(true);
setInterval(live, 1000);
setInterval(benchTick, 1000);
setInterval(relTick, 1000);
setInterval(() => { const ae = document.activeElement; if (!ae || !['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName)) { S.ver++; render(); } }, 15000);
})();
</script>
