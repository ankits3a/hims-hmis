  .d1 .pill.rd { border-color: var(--red-line); background: var(--red-soft); color: var(--red); }
  .d1 .prow { display: flex; flex-direction: column; gap: 5px; width: 100%; padding: 12px 14px; min-height: 64px; border-top: 1px solid var(--line2); }
