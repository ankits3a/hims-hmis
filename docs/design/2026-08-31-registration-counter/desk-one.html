<title>Desk One</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;600&display=swap">
<style>
  :root{
    --paper:#f4f7f4; --card:#ffffff; --ink:#132420; --line:#dfe7e1; --line2:#ecf1ed;
    --dim:#5c6f66; --faint:#8ea69a; --wash:#eef3ef;
    --green:#0e6b4e; --green-soft:rgba(14,107,78,.08); --green-line:rgba(14,107,78,.35);
    --gold:#dd8f1c; --gold-soft:rgba(221,143,28,.10); --gold-line:rgba(221,143,28,.45);
    --red:#b23a30;
    --agent:#132420; --agent-fg:#d9efe4; --agent-dim:#7fa392; --mint:#35c48f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:13.5px/19px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0;text-align:left}
  input{font:inherit;color:inherit}
  input:focus{outline:none}
  button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .mo{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .dev{font-family:"IBM Plex Sans Devanagari","Nirmala UI",Mangal,sans-serif;line-height:1.6}
  .tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .kb{display:inline-flex;align-items:center;justify-content:center;height:16px;min-width:20px;padding:0 5px;
    border-radius:3px;border:1px solid var(--line);background:var(--card);font-family:"IBM Plex Mono",monospace;
    font-size:9px;font-weight:600;color:var(--dim);flex-shrink:0}
  .kb.dk{border-color:#2c443a;background:#1c332b;color:var(--agent-dim)}
  .pri{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;
    border-radius:6px;background:var(--green);color:#f2faf6;font-size:13px;font-weight:600;border:1px solid var(--green)}
  .pri:disabled{opacity:.35;cursor:not-allowed}
  .sec{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;
    border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500}
  .sec:hover{border-color:var(--faint)}
  .sec.grn{border-color:var(--green);color:var(--green);font-weight:600}
  .box{background:var(--card);border:1px solid var(--line);border-radius:8px}
  .in{height:40px;width:100%;border-radius:6px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px}
  .in:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .pill{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:4px;
    font-size:10.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--dim);white-space:nowrap}
  .pill.on{border-color:var(--green-line);background:var(--green-soft);color:var(--green)}
  .pill.gd{border-color:var(--gold-line);background:var(--gold-soft);color:var(--gold)}
  .stamp{display:inline-flex;padding:2px 10px;border-radius:4px;font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;font-weight:700;letter-spacing:.14em}
  .stamp.un{border:2px solid var(--gold);color:var(--gold)}
  .stamp.pd{border:2px solid var(--green);color:var(--green)}
  .agchip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 11px;border-radius:6px;
    background:var(--agent);color:var(--agent-fg);font-size:11.5px;line-height:16px}
  .agchip b{color:#fff;font-weight:600}
  .agdo{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:5px;flex-shrink:0;
    background:var(--mint);color:#0b2018;font-size:11px;font-weight:700}
  .agdo:hover{background:#4fd6a3}
  .ovl{position:fixed;inset:0;background:rgba(19,36,32,.5);display:flex;align-items:flex-start;
    justify-content:center;padding-top:8vh;z-index:60}
  .pi{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:6px;font-size:13px;cursor:pointer}
  .pi.sel{background:var(--wash)}
  .drow{display:flex;align-items:center;gap:11px;padding:9px 12px;border-top:1px solid var(--line2)}
  .drow:hover{background:var(--wash)}
  .lock{width:11px;height:11px;flex-shrink:0}
  .sw{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);flex-shrink:0}
  @media (prefers-reduced-motion:no-preference){
    .agchip{animation:up .16s ease-out}
    @keyframes up{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  }
  #frame{min-width:1220px}
  #wrap{overflow-x:auto}
</style>

<div id="wrap"><div id="frame" style="height:100vh;display:flex;flex-direction:column">

  <!-- ── header ── -->
  <div style="display:flex;align-items:center;gap:14px;height:46px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0">
    <div style="display:flex;align-items:center;gap:9px">
      <div style="width:10px;height:10px;border-radius:2px;background:var(--green);transform:rotate(45deg)"></div>
      <span class="mo" style="font-size:12.5px;font-weight:700;letter-spacing:.08em">DESK ONE</span>
    </div>
    <span style="color:var(--line)">/</span>
    <span style="font-size:12.5px;color:var(--dim)">Registration · Counter 01 · <strong style="color:var(--ink);font-weight:600">Ramesh Chaudhary</strong></span>
    <span class="pill on" style="height:22px"><span style="width:5px;height:5px;border-radius:99px;background:var(--green)"></span>cash session open · <span class="mo">₹3,720</span></span>
    <button class="pill" style="height:22px" onclick="ov='flow';paint()" title="Counter flow — supervisor setting">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span id="flowLbl"></span>
    </button>
    <div style="flex-grow:1"></div>
    <span class="mo" style="font-size:11.5px;color:var(--faint)">SUN 30 AUG · <span id="clk">09:40</span></span>
    <button class="pill gd" style="height:24px" onclick="ov=ov==='queues'?null:'queues';paint()"><span class="mo" id="waitN">28</span> waiting <span class="kb">Q</span></button>
    <button class="pill" style="height:24px" onclick="ov=ov==='schema'?null:'schema';paint()">design schema</button>
    <button class="pill" style="height:24px;border-color:var(--ink)" onclick="openPal()"><strong>⌘</strong> command <span class="kb">Ctrl K</span></button>
  </div>

  <!-- ── body: dossier + stage ── -->
  <div style="flex-grow:1;min-height:0;display:flex">
    <aside id="dossier" style="width:296px;flex-shrink:0;border-right:1px solid var(--line);background:var(--card);overflow-y:auto"></aside>
    <main id="stage" style="flex-grow:1;min-width:0;overflow-y:auto;padding:24px 30px 30px"></main>
  </div>

  <!-- ── agent dock ── -->
  <div style="flex-shrink:0;background:var(--agent);color:var(--agent-fg)">
    <div id="drawer" style="display:none;border-bottom:1px solid #24413631;max-height:250px"></div>
    <div style="display:flex;align-items:center;gap:13px;height:54px;padding:0 18px">
      <span style="position:relative;width:9px;height:9px;flex-shrink:0">
        <span style="position:absolute;inset:0;border-radius:99px;background:var(--mint)"></span>
        <span style="position:absolute;inset:-3px;border-radius:99px;border:1px solid var(--mint);opacity:.35"></span>
      </span>
      <span class="tag" style="color:var(--agent-dim);flex-shrink:0">desk agent</span>
      <span id="ticker" class="mo" style="font-size:11.5px;color:var(--agent-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-grow:1"></span>
      <form onsubmit="ask(event)" style="flex-shrink:0;display:flex;align-items:center;gap:8px;width:360px;height:36px;border:1px solid #2c4438;border-radius:6px;padding:0 11px;background:#1c332b">
        <input id="askIn" placeholder="ask — “kis line mein kam wait hai?”" style="border:none;background:transparent;color:var(--agent-fg);flex-grow:1;font-size:12px"/>
        <span class="kb dk">F2</span>
      </form>
      <button onclick="drawer=!drawer;paint()" class="mo" style="flex-shrink:0;font-size:10.5px;color:var(--agent-dim);letter-spacing:.1em" id="drawBtn">▲ LOG</button>
    </div>
  </div>
</div></div>

<div id="ovls"></div>

<script>
/* ══════════ data — fresh set ══════════ */
const DEPT = {
  "General Medicine":{fee:400,avg:5,where:"Ground · G-wing",docs:[{n:"Dr. Nishant Rao",q:5,rm:"G-04"},{n:"Dr. T. Minz",q:3,rm:"G-05"}]},
  "Cardiology":{fee:750,avg:7,where:"1st floor",docs:[{n:"Dr. Ila Chandra",q:6,rm:"F1-12"}]},
  "Orthopaedics":{fee:650,avg:6,where:"2nd floor",docs:[{n:"Dr. P. Oraon",q:8,rm:"F2-03"}]},
  "Paediatrics":{fee:450,avg:4,where:"Ground · G-wing",docs:[{n:"Dr. Sneha Toppo",q:2,rm:"G-08"}]},
  "Obstetrics & Gynaecology":{fee:650,avg:8,where:"2nd floor",docs:[{n:"Dr. M. D'Souza",q:4,rm:"F2-11"}]},
};
const SYMP = [
  {k:["chest","seena","heart","दिल"],d:["Cardiology","General Medicine"],t:"chest discomfort"},
  {k:["fever","bukhar","बुखार"],d:["General Medicine","Paediatrics"],t:"fever"},
  {k:["knee","back","joint","kamar"],d:["Orthopaedics"],t:"joint / back pain"},
  {k:["cough","khansi","sans"],d:["General Medicine"],t:"cough / breathlessness"},
  {k:["pregnan","garbh","period"],d:["Obstetrics & Gynaecology"],t:"antenatal / gynae"},
  {k:["child","baccha","teeka","vaccin"],d:["Paediatrics"],t:"child illness / vaccination"},
  {k:["sugar","bp","pressure","diabet"],d:["General Medicine","Cardiology"],t:"BP / sugar follow-up"},
];
const PPL = {
  anjali:{id:"anjali",nm:"Anjali Verma",uh:"UH-24-05512",age:38,sex:"F",mob:"98012 33470",
    mem:{plan:"ANNUAL+",no:"AP-0834",left:9,pct:20},last:"11-Jul-2026",addr:"Morabadi, Ranchi",abha:true},
  farida:{id:"farida",nm:"Farida Khatoon",uh:"UH-23-01188",age:52,sex:"F",mob:"82102 55917",
    rev:{doc:"Dr. Nishant Rao",dept:"General Medicine",till:"09-Sep",seen:"26-Aug"},last:"26-Aug-2026",addr:"Hindpiri, Ranchi",abha:true},
  mohan:{id:"mohan",nm:"Mohan Prasad",uh:"UH-22-00761",age:47,sex:"M",mob:"94705 18226",
    corp:"Coal India OPD panel",last:"19-Feb-2026",addr:"",abha:false},
};
const PARTNERS = ["Nav Jeevan Pharmacy","Dr. Sinha Polyclinic","Sewa Health Camp — Ratu Road"];
const FLOW = {
  F1:{s:"REG→APPT→BILL · token first",l:"Register → Appointment → Bill — token prints at queueing, stamped UNPAID; billing flips it"},
  F2:{s:"REG→APPT→BILL · token on payment",l:"Register → Appointment → Bill — queued at once, token held until the bill settles"},
  F3:{s:"REG→BILL→APPT",l:"Register → Bill → Appointment — money first; the token always leaves PAID"},
};

/* ══════════ state ══════════ */
let S, ov=null, drawer=false, palQ="", palSel=0, agAns=null, tokSeq=117;
let mins=9*60+40;
const log=[];
function reset(keepFlow){
  S={flow:keepFlow||"F1",st:"find",p:null,neu:false,
     d:{nm:"",mob:"",age:"",sex:"",abha:false},
     ben:{mem:false,cpn:null,corp:null,ref:null,pkg:false},
     appt:null,fut:null,paid:false,tender:null,tokOut:false,tokPaid:false,tok:null,
     q:"",sq:"",tab:"now",open:{},t0:null};
}
reset();
const T=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
const RS=n=>"₹"+n.toLocaleString("en-IN");
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tk(n){mins+=n;document.getElementById("clk").textContent=T(mins);}
function note(x,kind){log.unshift({at:T(mins),x,kind:kind||"did"});}
[["cash session opened — float counted ₹3,720, variance nil","ok"],
 ["overnight sweep: 11 files missing address → sent to patient-QR list","did"],
 ["queue watch on: Dr. Oraon trending 9 min over his slot average","warn"]].forEach(([x,k],i)=>log.push({at:"09:3"+(8-i),x,kind:k}));

const order=()=>S.flow==="F3"?["reg","bill","appt"]:["reg","appt","bill"];
function advance(){
  const o=order(); const cur=S.st==="find"||S.st==="reg"?"reg":S.st;
  const i=o.indexOf(cur);
  S.st = i>=o.length-1 ? "done" : o[i+1];
  paint();
}
const waiting=()=>Object.values(DEPT).reduce((a,d)=>a+d.docs.reduce((x,y)=>x+y.q,0),0);

/* ══════════ actions ══════════ */
function grab(id){
  const p=PPL[id]; S.p={...p}; S.neu=false; S.t0=mins;
  if(p.corp) S.ben.corp=p.corp;
  tk(1);
  note(`file open — ${p.nm}, last seen ${p.last}, ${p.abha?"ABHA on record":"no ABHA yet"}`);
  if(p.mem) note(`membership ${p.mem.no} verified live — ${p.mem.left} visits left`,"ok");
  if(p.rev) note(`review window: ${p.rev.doc} on ${p.rev.seen}, free till ${p.rev.till} — bill will force ₹0`,"ok");
  S.st = order()[1]==="bill" ? "bill" : "appt";
  paint();
}
function fresh(fill){
  S.p=null;S.neu=true;S.st="reg";S.t0=mins;
  S.d=fill?{nm:"Deepak Munda",mob:"62519 04473",age:"26",sex:"M",abha:false}:{nm:"",mob:"",age:"",sex:"",abha:false};
  paint();
}
function put(k,v){S.d[k]=v;}
function sex(v){S.d.sex=v;paint();}
function abha(){S.d.abha=true;tk(1);note("ABHA minted from Aadhaar ····7302 — one OTP while the form was typed","ok");paint();}
function enrol(){
  if(!(S.d.nm&&S.d.mob&&S.d.age&&S.d.sex))return;
  S.p={id:"new",nm:S.d.nm,uh:"UH-26-08871",age:S.d.age,sex:S.d.sex,mob:S.d.mob,abha:S.d.abha,last:"first visit",addr:""};
  tk(1);
  note(`registered — UH-26-08871 · card printing · UHID SMS (Hindi) queued`,"ok");
  advance();
}
function flip(k){S.open[k]=!S.open[k];paint();}
function bMem(){S.ben.mem=true;S.open.mem=false;tk(1);note("ANNUAL+ AP-0834 applied — 20% off consult, 8 visits will remain","ok");paint();}
function bCpn(){S.ben.cpn="FESTIVE100";S.open.cpn=false;tk(1);note("coupon FESTIVE100 checked — ₹100, unused, in date","ok");paint();}
function bCorp(v){S.ben.corp=v;S.open.corp=false;tk(1);note(`corporate letter verified — ${v}; e-authorisation sent`,"ok");paint();}
function bRef(v){S.ben.ref=v;S.open.ref=false;tk(1);note(`referral tied to ${v} — partner ledger entry drafted`,"ok");paint();}
function bPkg(){S.ben.pkg=true;S.open.pkg=false;tk(1);note("Mother & Child package verified — consult covered, 4/16 used","ok");paint();}

function symp(v){S.sq=v;paint();const el=document.getElementById("sy");if(el){el.focus();el.setSelectionRange(v.length,v.length);}}
function tab(t){S.tab=t;paint();}
function seat(dept,doc){
  const D=DEPT[dept];
  const row=doc?D.docs.find(x=>x.n===doc):D.docs.reduce((a,b)=>a.q<=b.q?a:b);
  const ahead=row.q, wait=ahead*D.avg;
  S.appt={dept,doc:doc||null,rm:row.rm,ahead,wait,eta:T(mins+wait)};
  S.tok="T-"+(++tokSeq);
  tk(1);
  if(S.flow==="F1"){S.tokOut=true;S.tokPaid=false;note(`token ${S.tok} out, stamped UNPAID (lane: token-first) — position ${ahead+1} on the board`);}
  else if(S.flow==="F2"){S.tokOut=false;note(`queued at position ${ahead+1}; token held for payment (supervisor lane)`);}
  else{S.tokOut=true;S.tokPaid=true;note(`token ${S.tok} out PAID — bill-first flow`,"ok");}
  note(doc?`${doc} pinged — ${S.p.nm} joins, ~${wait} min`:`${dept} pool — first free doctor takes them`);
  paint();
}
function futBook(d,s){
  S.fut={d,s,doc:"Dr. M. D'Souza"};
  tk(1);note(`future slot held — ${d} ${s}, Dr. M. D'Souza; SMS + T-1 reminder queued`,"ok");
  S.tab="now";paint();
}
function priceOf(){
  const hasAppt=!!S.appt;
  const fee=hasAppt?DEPT[S.appt.dept].fee:400;
  const head=hasAppt?`${S.appt.dept} consult${S.appt.doc?" — "+S.appt.doc:" — pool"}`:"OPD consult — flat; adjusts on assignment";
  const L=[[head,fee]];let t=fee;const p=S.p||{};
  if(p.rev){L.push([`review visit — free till ${p.rev.till} (${p.rev.doc})`,-fee]);return{L,t:0,m:"rev"};}
  if(S.ben.pkg){L.push(["Mother & Child package — consult covered",-fee]);return{L,t:0,m:"pkg"};}
  if(S.ben.mem){const d=Math.round(fee*.2);L.push(["ANNUAL+ membership · 20%",-d]);t-=d;}
  if(S.ben.ref){const d=Math.round(fee*.1);L.push([`referral courtesy · ${S.ben.ref} · 10%`,-d]);t-=d;}
  if(S.ben.cpn){const d=Math.min(100,t);L.push(["coupon FESTIVE100",-d]);t-=d;}
  if(S.ben.corp){L.push([`cashless — billed to ${S.ben.corp}`,-t]);return{L,t:0,m:"corp",amt:t};}
  return{L,t,m:"pay"};
}
function pay(via){
  const c=priceOf();
  S.paid=true;S.tender=via;S.calc=c;
  tk(1);
  if(!S.tokOut&&S.appt){S.tokOut=true;S.tokPaid=true;note(`token ${S.tok} released PAID at payment (held lane)`,"ok");}
  if(S.tokOut&&!S.tokPaid){S.tokPaid=true;note(`board flip: ${S.tok} UNPAID → PAID`,"ok");}
  const how=c.m==="rev"?"₹0 review":c.m==="pkg"?"₹0 package":c.m==="corp"?`corporate credit ${RS(c.amt)}`:`${RS(c.t)} by ${via}`;
  note(`receipt R-2381 — ${how}${via==="cash"&&c.t>0?"; drawer "+RS(3720+c.t):""}`,"ok");
  advance();
}
function clearDesk(){
  if(S.p||S.neu)note("desk cleared — nothing carries to the next person");
  const f=S.flow;reset(f);paint();
}
function setFlow(f){S.flow=f;ov=null;note(`supervisor set flow: ${FLOW[f].l}`,"warn");paint();}
function saveRec(){
  const m=document.getElementById("emob").value,a=document.getElementById("eadr").value;
  if(m)S.p.mob=m;if(a)S.p.addr=a;
  ov=null;tk(1);note("record amended by Ramesh — audit-logged, prior values retained","ok");paint();
}

/* ══════════ agent ══════════ */
function ask(e){
  e.preventDefault();
  const b=document.getElementById("askIn");const q=b.value.trim();if(!q)return;b.value="";
  const lo=q.toLowerCase();let a;
  if(lo.includes("wait")||lo.includes("line")||lo.includes("queue")){
    const best=Object.entries(DEPT).map(([d,v])=>({d,w:Math.min(...v.docs.map(x=>x.q))*v.avg})).sort((x,y)=>x.w-y.w)[0];
    a=`Shortest line: ${best.d}, ~${best.w} min. Dr. Minz is the quiet General Medicine room (~15 min).`;
  } else if(lo.includes("free")||lo.includes("review")||lo.includes("zero")){
    a=`A revisit inside the doctor's review window bills ₹0 on its own — Farida Khatoon is inside hers till 09-Sep. Token releases the instant the zero-bill settles.`;
  } else if(lo.includes("abha")){
    a=`One Aadhaar OTP mints an ABHA while you type the rest of the form. Mohan Prasad has none — I can queue it.`;
  } else if(lo.includes("price")||lo.includes("discount")||lo.includes("member")){
    a=`Price stacks membership 20% → referral 10% → coupon flat. Corporate and packages go cashless. This desk applies benefits; enrolment sits with the front-office manager.`;
  } else {
    a=`Live build answers from the queue board and billing rules. Try “shortest wait”, “why is Farida free”, “make ABHA”.`;
  }
  note(`you asked: ${q}`,"you");agAns=a;drawer=true;paint();
}

/* ══════════ paint ══════════ */
const $=id=>document.getElementById(id);
function paint(){
  $("flowLbl").textContent=FLOW[S.flow].s;
  $("waitN").textContent=waiting();
  $("ticker").textContent=log[0]?`${log[0].at}  ${log[0].x}`:"";
  $("drawBtn").textContent=drawer?"▼ HIDE":"▲ LOG";
  paintDossier();paintStage();paintDrawer();paintOvl();
  if(S.st==="find"&&!ov){const el=$("fx");if(el&&document.activeElement!==el)el.focus();}
}

/* ── dossier ── */
function paintDossier(){
  const d=$("dossier");
  if(!S.p&&!S.neu){
    d.innerHTML=`
    <div style="padding:20px 18px">
      <div class="tag">nobody in hand</div>
      <div style="margin-top:8px;font-size:12.5px;color:var(--dim);line-height:18px">Search or register — the person you pick lives in this column until <span class="kb">Esc</span>.</div>
      <div class="tag" style="margin-top:26px">your day</div>
      ${[["registered","41"],["collected","₹16,910"],["avg at desk","2m 18s"],["waiting hall",String(waiting())]]

    <div class="tag" style="margin-top:22px">3 · elements</div>

      <div><b style="color:var(--ink)">The dossier</b> — the left column IS the patient session. Identity, flow steps, benefit chips, token, and a live bill that reprices from the first second. It empties only on Esc; that is why nothing is ever lost between pages.</div>
      <div><b style="color:var(--ink)">The dock</b> — the agent lives along the bottom: a ticker of what it just did, an ask-box (F2), and a pull-up log. Suggestions also step into the page as pine chips exactly where the decision is being made.</div>
      <div><b style="color:var(--ink)">Live bill</b> — pricing is not a stage, it is a column. Billing the stage only chooses the tender; the arithmetic happened as chips attached.</div>
      <div><b style="color:var(--ink)">Speaks-on-dark rule</b> — anything the AI says or does sits on pine ink. No legend needed to know what the machine touched.</div>
      <div><b style="color:var(--ink)">Stamps</b> — <span class="stamp un" style="font-size:8.5px">UNPAID</span> <span class="stamp pd" style="font-size:8.5px">PAID</span> outlined, never filled: thermal heads wear, paper curls, and a hollow stamp survives both.</div>
      <div><b style="color:var(--ink)">Queue bars</b> — one bar per doctor, marigold past six waiting; wait shown as minutes <i>and</i> a clock time, because patients ask “kitne baje?”.</div>
      <div><b style="color:var(--ink)">Match reasons</b> — search results say what matched (same mobile), never a confidence percentage; a clerk can act on a reason, not on 87%.</div>
      <div><b style="color:var(--ink)">The lock pill</b> — the supervisor's flow choice worn openly in the header, so the clerk always knows which lane a token takes today.</div>
    </div>

    <div class="tag" style="margin-top:22px">4 · the flow machine</div>
    <div class="box" style="margin-top:9px;padding:13px 15px;background:var(--wash);overflow-x:auto">
      <pre class="mo" style="margin:0;font-size:11px;line-height:19px">F1  Register → Appointment → Bill    token out at queueing, UNPAID → billing flips it
F2  Register → Appointment → Bill    queued at once; token held until payment
F3  Register → Bill → Appointment    flat fee first; token always leaves PAID
overrides: review-window → bill forced ₹0, auto-settles, token releases
           corporate / package → cashless; token releases on settle</pre>
    </div>

    <div class="tag" style="margin-top:22px">5 · voice</div>
    <div style="font-size:11.5px;line-height:17px;color:var(--dim);margin-top:8px;max-width:620px">
      Buttons say what happens (“register → appointment”). The screen hands Ramesh the Hindi sentence to say out loud, then its meaning.
      The agent argues in consequences (“she paid UPI four visits running — key 2”), never in model-speak, and everything it does lands in the log with a timestamp.
    </div>
  </div></div>`;
}

/* ══════════ keys ══════════ */
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();ov==="pal"?(ov=null,paint()):openPal();return;}
  if(ov==="pal"){
    if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palActs.length-1,palSel+1);paint();return;}
    if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);paint();return;}
    if(e.key==="Enter"){e.preventDefault();runPal(palSel);return;}
    if(e.key==="Escape"){palQ="";ov=null;paint();return;}
    return;
  }
  if(e.key==="Escape"){if(ov){ov=null;paint();}else clearDesk();return;}
  if(e.key==="F2"){e.preventDefault();$("askIn").focus();return;}
  const typing=/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||"");
  if(typing){
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();hotEnter();}
    else if(e.key==="Enter"&&S.st==="find"&&S.q.trim()){
      const q=S.q.trim().toLowerCase();
      const hit=Object.values(PPL).find(p=>p.nm.toLowerCase().includes(q)||p.mob.replace(/\s/g,"").includes(q.replace(/\s/g,""))||p.uh.toLowerCase().includes(q));
      if(hit){e.preventDefault();grab(hit.id);}
    }
    return;
  }
  if(e.key.toLowerCase()==="q"){e.preventDefault();ov=ov==="queues"?null:"queues";paint();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"){e.preventDefault();fresh(true);return;}
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();hotEnter();return;}
  if(S.st==="bill"&&!S.paid){
    const c=priceOf();
    if(c.t>0){if(e.key==="1")pay("cash");if(e.key==="2")pay("upi");if(e.key==="3")pay("card");}
    else if(e.key==="Enter"){pay(c.m);}
  }
});
function hotEnter(){
  if(S.st==="reg")enrol();
  else if(S.st==="appt"&&S.appt){S.flow!=="F3"?(S.st="bill",paint()):(S.st="done",paint());}
  else if(S.st==="bill"&&!S.paid){const c=priceOf();if(c.t===0)pay(c.m);}
}

paint();
</script>
