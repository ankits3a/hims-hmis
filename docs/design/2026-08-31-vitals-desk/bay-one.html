<title>Bay One</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;600&display=swap">
<style>
  :root{
    --paper:#f4f7f4; --card:#ffffff; --ink:#132420; --line:#dfe7e1; --line2:#ecf1ed;
    --dim:#5c6f66; --faint:#8ea69a; --wash:#eef3ef;
    --green:#0e6b4e; --green-soft:rgba(14,107,78,.08); --green-line:rgba(14,107,78,.35);
    --gold:#dd8f1c; --gold-soft:rgba(221,143,28,.10); --gold-line:rgba(221,143,28,.45);
    --red:#b23a30; --red-soft:rgba(178,58,48,.07); --red-line:rgba(178,58,48,.45);
    --agent:#132420; --agent-fg:#d9efe4; --agent-dim:#7fa392; --mint:#35c48f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:13.5px/19px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0;text-align:left}
  input{font:inherit;color:inherit}
  input:focus{outline:none}
  button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .mo{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .dev{font-family:"IBM Plex Sans Devanagari","Nirmala UI",Mangal,sans-serif;line-height:1.55}
  .tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .kb{display:inline-flex;align-items:center;justify-content:center;height:16px;min-width:20px;padding:0 5px;
    border-radius:3px;border:1px solid var(--line);background:var(--card);font-family:"IBM Plex Mono",monospace;
    font-size:9px;font-weight:600;color:var(--dim);flex-shrink:0}
  .kb.dk{border-color:#2c443a;background:#1c332b;color:var(--agent-dim)}
  .pri{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;
    border-radius:6px;background:var(--green);color:#f2faf6;font-size:13px;font-weight:600;border:1px solid var(--green)}
  .pri:disabled{opacity:.35;cursor:not-allowed}
  .pri.rd{background:var(--red);border-color:var(--red)}
  .sec{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;
    border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500}
  .sec:hover{border-color:var(--faint)}
  .sec.grn{border-color:var(--green);color:var(--green);font-weight:600}
  .box{background:var(--card);border:1px solid var(--line);border-radius:8px}
  .in{height:40px;width:100%;border-radius:6px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px}
  .in:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .pill{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:4px;
    font-size:10.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--dim);white-space:nowrap}
  .pill.on{border-color:var(--green-line);background:var(--green-soft);color:var(--green)}
  .pill.gd{border-color:var(--gold-line);background:var(--gold-soft);color:var(--gold)}
  .pill.rd{border-color:var(--red-line);background:var(--red-soft);color:var(--red)}
  .agchip{display:inline-flex;align-items:flex-start;gap:8px;max-width:100%;padding:8px 11px;border-radius:6px;
    background:var(--agent);color:var(--agent-fg);font-size:11.5px;line-height:16px}
  .agchip b{color:#fff;font-weight:600}
  .agdo{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:5px;flex-shrink:0;
    background:var(--mint);color:#0b2018;font-size:11px;font-weight:700}
  .agdo:hover{background:#4fd6a3}
  .agdo.gh{background:transparent;border:1px solid #2c4438;color:var(--agent-dim)}
  .ovl{position:fixed;inset:0;background:rgba(19,36,32,.5);display:flex;align-items:flex-start;
    justify-content:center;padding-top:7vh;z-index:60}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;min-height:118px;
    display:flex;flex-direction:column;gap:5px;position:relative}
  .tile.wn{border:1.5px solid var(--gold-line);background:linear-gradient(0deg,var(--gold-soft),var(--card))}
  .tile.dg{border:2px solid var(--red);background:linear-gradient(0deg,var(--red-soft),var(--card))}
  .tile.ok .bigv{color:var(--ink)}
  .bigv{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:700;line-height:30px;letter-spacing:-.01em}
  .bigv.gr{color:var(--faint)}
  .srcp{display:inline-flex;align-items:center;gap:4px;height:17px;padding:0 6px;border-radius:3px;
    font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:700;letter-spacing:.1em}
  .srcp.au{background:var(--agent);color:var(--mint)}
  .srcp.mn{border:1px solid var(--gold-line);color:var(--gold)}
  .benchrow{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-bottom:1px solid var(--line2);
    cursor:pointer;border-left:3px solid transparent}
  .benchrow:hover{background:var(--wash)}
  .benchrow.nx{border-left-color:var(--green);background:var(--green-soft)}
  .benchrow.rs{border-left-color:var(--gold)}
  .benchrow.dn{opacity:.45}
  .gate{border-radius:8px;padding:12px 15px;display:flex;gap:12px;align-items:flex-start;margin-top:12px}
  .gate.gd{border:1.5px solid var(--gold-line);background:var(--gold-soft)}
  .gate.rd{border:2px solid var(--red);background:var(--red-soft)}
  .say{background:var(--agent);border-radius:8px;padding:11px 13px;color:var(--agent-fg)}
  .lock{width:11px;height:11px;flex-shrink:0}
  @media (prefers-reduced-motion:no-preference){
    .agchip{animation:up .16s ease-out}
    @keyframes up{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    .pulse{animation:pu 1.1s ease-in-out infinite}
    @keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
  }
  #frame{min-width:1280px}
  #wrap{overflow-x:auto}
</style>

<div id="wrap"><div id="frame" style="height:100vh;display:flex;flex-direction:column">

  <!-- ── header ── -->
  <div style="display:flex;align-items:center;gap:12px;height:46px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0">
    <div style="display:flex;align-items:center;gap:9px">
      <div style="width:10px;height:10px;border-radius:99px;border:3px solid var(--green)"></div>

    <span id="devstrip" style="display:flex;gap:5px"></span>

    <button class="pill" style="height:24px;border-color:var(--ink)" onclick="ov=ov==='pal'?null:'pal';paint()"><strong>⌘</strong> command <span class="kb">Ctrl K</span></button>
  </div>

  <!-- ── body: session + stage + bench ── -->
  <div style="flex-grow:1;min-height:0;display:flex">
    <aside id="session" style="width:294px;flex-shrink:0;border-right:1px solid var(--line);background:var(--card);overflow-y:auto"></aside>
    <main id="stage" style="flex-grow:1;min-width:0;overflow-y:auto;padding:22px 28px 30px"></main>
    <aside id="bench" style="width:238px;flex-shrink:0;border-left:1px solid var(--line);background:var(--card);overflow-y:auto"></aside>
  </div>

  <!-- ── agent dock ── -->
  <div style="flex-shrink:0;background:var(--agent);color:var(--agent-fg)">
    <div id="drawer" style="display:none;border-bottom:1px solid #24413631;max-height:250px"></div>
    <div style="display:flex;align-items:center;gap:13px;height:54px;padding:0 18px">
      <span style="position:relative;width:9px;height:9px;flex-shrink:0">
        <span style="position:absolute;inset:0;border-radius:99px;background:var(--mint)"></span>
        <span style="position:absolute;inset:-3px;border-radius:99px;border:1px solid var(--mint);opacity:.35"></span>
      </span>
      <span class="tag" style="color:var(--agent-dim);flex-shrink:0">bay agent</span>
      <span id="ticker" class="mo" style="font-size:11.5px;color:var(--agent-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-grow:1"></span>
      <form onsubmit="ask(event)" style="flex-shrink:0;display:flex;align-items:center;gap:8px;width:360px;height:36px;border:1px solid #2c4438;border-radius:6px;padding:0 11px;background:#1c332b">
        <input id="askIn" placeholder="ask — “bump kyon hua?” · “muac kya hai?”" style="border:none;background:transparent;color:var(--agent-fg);flex-grow:1;font-size:12px"/>
        <span class="kb dk">F2</span>
      </form>
      <button onclick="drawer=!drawer;paint()" class="mo" style="flex-shrink:0;font-size:10.5px;color:var(--agent-dim);letter-spacing:.1em" id="drawBtn">▲ LOG</button>
    </div>
  </div>
</div></div>

<div id="ovls"></div>

<script>
/* ══════════ the bench — five stories, each answering a design question ══════════ */
const PT=[
 {id:"sunita",tok:"T-118",nm:"Sunita Devi",age:54,sex:"F",uh:"UH-23-04417",cls:2,st:"waiting",
  why:"diabetes review · Dr. Nishant Rao",
  last:{when:"11-Jun-2026",ht:152,wt:67.0,bp:"132/84",pulse:82,spo2:98,temp:36.6,rr:16},
  dev:{bp:[[158,96,88],[142,88,84]],spo2:[97],temp:[36.8],wt:[68.4],rr:[16]},gh:{wt:"68.4",pulse:"88"},
  chips:[["bpmed","BP dawa aaj subah li?"],["fast","khali pet? — sugar draw owed"],["stairs","abhi seedhi chadh kar aaye?"]],
  lockHt:true,lead:"bp",
  stagept:"sugar draw owed → the fasting chip matters. BP ran 132/84 in June — watch the delta.",
  hint:"trend · rest-recheck · chips",
  say:{rest:"सुनीता जी, पाँच मिनट बैठिए, चाय-पानी नहीं — फिर दोबारा लेंगे। अक्सर दूसरी बार ठीक आता है।",
       settled:"अब ठीक है — दोनों रीडिंग डॉक्टर साहब देखेंगे।"}},
 {id:"ganesh",tok:"T-121",nm:"Ganesh Oraon",age:61,sex:"M",uh:"UH-26-08912",cls:3,st:"waiting",
  why:"walk-in · “sir bhaari, chakkar” · Gen Med pool",
  last:null,
  dev:{bp:[[208,126,104],[214,132,102]],spo2:[95],temp:[36.9],wt:[71.5],rr:[20]},
  chips:[["bpmed","BP ki dawa kabhi chali?"],["stairs","dhoop se seedha aaye?"]],
  lead:"bp",
  stagept:"first visit, no file. Age 61, “heavy head” — the agent wants the cuff on FIRST.",
  hint:"⚠ the escalation — design question №1",
  say:{danger:"बाबा, बीपी ज़्यादा है — घबराइए नहीं। डॉक्टर आपको अभी देखेंगे, लाइन नहीं लगेगी। अकेले मत चलिए, हम साथ चलते हैं।"}},
 {id:"aarav",tok:"T-119",nm:"Aarav Kumar",age:4,sex:"M",uh:"UH-26-08877",cls:2,st:"waiting",
  why:"fever 2 days · with mother Meena · Dr. Sneha Toppo",
  last:{when:"02-Feb-2026",wt:12.1},
  dev:{spo2:[98],pr:[132],temp:[38.9],wt:[13.2],rr:[28]},gh:{muac:"13.4",ht:"102"},
  chips:[["eat","kal se khana-peena kaisa?"],["fits","bukhar mein jhatke aaye?"]],
  lead:"temp",
  stagept:"band flips to CHILD 1–5: small cuff, MUAC due, different limits. Weight was 12.1 in Feb.",
  hint:"paediatric — the screen changes, not just the limits",
  say:{fever:"बुख़ार है — डॉक्टर साहिबा को बता दिया है, जल्दी बुलाएँगी। पानी पिलाती रहिए।"}},
 {id:"savitri",tok:"T-120",nm:"Savitri Devi",age:72,sex:"F",uh:"UH-22-01034",cls:2,st:"waiting",
  why:"giddiness · Dr. T. Minz",
  last:{when:"14-Mar-2026",ht:151,wt:49.2,bp:"148/86",pulse:78,spo2:96,temp:36.5,rr:18},
  dev:{bp:[[152,84,78]],spo2:[45,94],temp:[36.4],wt:[48.1],rr:[18]},gh:{ht:"147",wt:"4.8",pulse:"78"},
  chips:[["fall","haal mein giri to nahin?"],["bpmed","BP dawa aaj li?"]],
  lockHt:true,
  stagept:"carried-forward height is LOCKED. Scale is dead — her weight gets typed. Watch the gates work.",
  hint:"sanity gates · locked carry-forward · dignity",
  say:{weight:"वज़न पर्ची पर लिख दिया है।  — the number is never said across the room."}},
 {id:"ramdev",tok:"T-117",nm:"Ramdev Mahto",age:68,sex:"M",uh:"UH-21-00219",cls:2,st:"resting",restAt:9*60+57,
  why:"BP follow-up · Dr. Nishant Rao",
  last:{when:"20-Aug-2026",ht:164,wt:61.5,bp:"156/94",pulse:80,spo2:96,temp:36.6,rr:16},
  dev:{bp:[[146,88,80]],spo2:[96],temp:[36.7],wt:[61.0],rr:[16]},
  chips:[["bpmed","BP dawa aaj li?"]],
  lead:"bp",
  stagept:"on the rest chairs since 09:52 — first reading 172/104. The recall belongs to the bench, not to memory.",
  hint:"rest-and-recheck · the timer lives in sight",
  recheckCtx:"172/104 at 09:52",
  say:{settled:"अब ठीक है बाबा — आराम से बैठिए, नंबर आने वाला है।"}},
 {id:"salma",tok:"T-122",nm:"Salma Khatoon",age:34,sex:"F",uh:"UH-25-06651",cls:2,st:"away",
  why:"weakness · Dr. T. Minz",
  last:{when:"03-May-2026",ht:158,wt:52.0,bp:"110/70",pulse:76,spo2:98,temp:36.5,rr:14},
  dev:{bp:[[112,72,74]],spo2:[98],temp:[36.4],wt:[51.6],rr:[14]},
  chips:[["eat","aaj kuchh khaya?"]],
  stagept:"stepped out — the agent holds her turn, nobody re-queues her by hand.",
  hint:"the walked-off patient keeps her place",
  say:{}},
];
/* pre-seed ramdev's held first reading */
PT[4].pending={bp:{takes:[[172,104,86]],s:172,d:104,src:"auto"},pulse:{v:86,src:"rode the cuff"}};

const DEVS={bp:{ok:true,nm:"BP+pulse"},spo2:{ok:true,nm:"SpO₂"},temp:{ok:true,nm:"IR temp"},scale:{ok:false,nm:"scale",since:"09:12"},scan:{ok:true,nm:"scanner"}};
const PHASES={
  bp:[["cuff wrapping — arm at heart height…",750],["inflating · 150 mmHg",700],["inflating · 185 mmHg",600],["deflating — hold still…",950]],
  spo2:[["probe on · searching pulse…",800],["waveform steady…",700]],
  temp:[["reading — forehead…",650]],
  scale:[["stabilising…",750]],
  rr:[["watch the chest — counting 15 s…",900],["…3 breaths",800],["…5 breaths · ×4",700]],
};
const UNLOCK_REASONS=["yearly re-measure due","patient disputes the old value","posture / device changed","surgical or limb change"];

/* ══════════ state ══════════ */
let P=null,V={},esc=0,sugg=null,gate=null,busy=null,manualK=null,sayThis=null,saveErr=null;
let ov=null,drawer=false,keys=0,readings=0,doneN=40,mins=9*60+52,rrFocusT=0;
let SERIAL=false,amendMode=false,bumpLeft=null,bumpTimer=null,bumpFinal=false,justSaved=null;
const log=[];
const T=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
const RS=n=>"₹"+n.toLocaleString("en-IN");
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tk(n){mins+=n;document.getElementById("clk").textContent=T(mins);}
function note(x,kind){log.unshift({at:T(mins),x,kind:kind||"did"});}
[["bay open — TYPING LANE (owner ruling: serial devices arrive within days, toggle ships OFF till they land). ⏎ commits a field and jumps to the next; every key is counted","warn"],
 ["pre-staged T-118 Sunita Devi — file, June vitals, sugar-draw flag ready before she stands up","did"],
 ["valve watch: Dr. Rao's board is down to 1 callable patient — this bench is his wait time","warn"]].forEach(([x,k],i)=>log.push({at:"09:5"+i,x,kind:k}));

/* ══════════ bands & ranges ══════════ */
const isChild=()=>P&&P.age<6;
function rng(){
  if(isChild())return{sbp:[80,110,70,140],dbp:[50,75,40,90],pulse:[80,140,60,170],spo2:[94,100,90,101],temp:[36.1,37.5,35,39.5],rr:[20,30,12,45]};
  return{sbp:[90,140,80,180],dbp:[60,90,40,120],pulse:[60,100,45,130],spo2:[94,100,90,101],temp:[36.1,37.3,35,39.5],rr:[12,20,8,30]};
}
function lvlOf(k,v){
  const R=rng()[k];if(!R||v==null)return"ok";
  if(v<=R[2]||v>=R[3])return"danger";
  if(v<R[0]||v>R[1])return"warn";
  return"ok";
}
function bpLvl(s,d){
  const R=rng();
  if(s>=R.sbp[3]||s<=R.sbp[2]||d>=R.dbp[3])return"danger";
  if(s>R.sbp[1]||d>R.dbp[1]||s<R.sbp[0])return"warn";
  return"ok";
}
function tileDefs(){
  const ch=isChild();const t=[];
  t.push({k:"ht",l:ch?"LENGTH":"HEIGHT",u:"cm",dev:null});
  t.push({k:"wt",l:"WEIGHT",u:"kg",dev:"scale",quiet:true});
  if(ch)t.push({k:"muac",l:"MUAC",u:"cm",dev:null});
  t.push({k:"bp",l:"BLOOD PRESSURE",u:"mmHg",dev:"bp",nr:ch});
  t.push({k:"pulse",l:"PULSE",u:"/min",dev:"bp",rides:true});
  t.push({k:"spo2",l:"SpO₂",u:"%",dev:"spo2"});
  t.push({k:"temp",l:"TEMP",u:"°C",dev:"temp"});
  t.push({k:"rr",l:"RESP RATE",u:"/min",dev:null,count:true});
  return t;
}
function reqList(){
  if(esc>=2)return["bp","pulse","spo2"];
  return isChild()?["wt","temp","pulse","spo2","muac"]:["wt","bp","pulse","spo2","temp"];
}
const have=k=>k==="bp"?!!(V.bp&&V.bp.s):!!(V[k]&&V[k].v!=null);

/* ══════════ actions ══════════ */
function grab(id,isRecall){
  const p=PT.find(x=>x.id===id);
  if(P&&P.id!==id){note("finish or park the patient in hand first — nothing bleeds between people","warn");paint();return;}
  P=p;V=p.V=p.V||p.pending||{};if(p.pending)delete p.pending;
  esc=0;sugg=null;gate=null;manualK=null;saveErr=null;sayThis=null;justSaved=null;
  p.st="inhand";tk(1);
  if(isRecall)note(`recalled from the rest chairs — first reading ${p.recheckCtx} is held on the chart, not overwritten`,"did");
  else note(`slip scanned — ${p.tok} ${p.nm}. File, ${p.last?("last vitals "+p.last.when):"no history (first visit)"}, band and cuff size staged before she reached the stool`,"ok");
  if(p.id==="ganesh")note("no file, age 61, “heavy head” — cuff first, form later","warn");
  if(p.id==="aarav")note("age 4 → CHILD 1–5 band: small cuff on the tray, MUAC due, BP not routine","did");
  paint();
  if(!SERIAL){
    const el=(p.lead&&$("min-"+p.lead))||document.querySelector('input[id^="min-"]');
    if(el)el.focus();
  }
}
function scanNext(){
  const p=PT.find(x=>x.st==="waiting");
  if(!p){note("bench clear — nobody waiting","did");paint();return;}
  grab(p.id);
}
/* owner ruling: barcode, token number or UHID — three doors into the same lane */
function findKey(e){
  if(e.key==="Enter"){e.preventDefault();findStart(e.target.value);}
}
function findStart(raw){
  const q=String(raw).trim().toLowerCase();
  if(!q)return;
  const tq=q.replace(/^t[-\s]?/,"");
  const p=PT.find(x=>x.tok.slice(2).toLowerCase()===tq)
        ||PT.find(x=>q.length>=4&&x.uh.toLowerCase().includes(q));
  if(!p){note(`nothing on today's bench matches “${raw.trim()}” — check the slip, or send them to the front desk`,"warn");paint();return;}
  note(`identified by ${p.tok.slice(2).toLowerCase()===tq?"token number":"UHID"} — same lane as the barcode, just slower keys`,"did");
  benchTap(p.id);
}
function benchTap(id){
  const p=PT.find(x=>x.id===id);
  if(p.st==="waiting")grab(id);
  else if(p.st==="resting")recall(id);
  else if(p.st==="away"){p.st="waiting";note(`${p.nm.split(" ")[0]} is back — her turn was held, not lost`,"ok");paint();}
  else if(p.st==="done")reopen(id);
  else paint();
}
function reopen(id){
  const p=PT.find(x=>x.id===id);
  if(P){note("finish the patient in hand first","warn");paint();return;}
  P=p;V=JSON.parse(JSON.stringify(p.V||{}));p.st="inhand";amendMode=true;
  esc=0;sugg=null;gate=null;sayThis=null;saveErr=null;manualK=null;justSaved=null;resetBump();
  note(`chart RE-OPENED to amend — ${p.tok} ${p.nm} (owner ruling: a wrong save is fixable at this desk). Old values keep living in the trail; the doctor's board refreshes on save`,"warn");
  paint();
}
function recall(id){
  const p=PT.find(x=>x.id===id);
  if(P){note("finish the patient in hand first — the recall stays lit on the bench","warn");paint();return;}

}
function clearDesk(){
  if(P){const p=P;if(p.st==="inhand")p.st=amendMode?"done":"waiting";note(amendMode?"amendment abandoned — the saved chart stands untouched":"desk cleared — nothing carries to the next person");}

}

/* device capture */
function capture(k){
  if(!P||busy)return;
  const t=tileDefs().find(x=>x.k===k);if(!t)return;
  if(k==="bp"&&!P.dev.bp){note("DECIDED: BP is not routine under 5 — capture only when the doctor asks. Logged that you considered it.","did");paint();return;}
  if(t.dev&&!DEVS[t.dev].ok){manual(k);return;}
  const ph=PHASES[t.dev||k]||[["reading…",600]];
  runPh(k,ph,0);
}
function runPh(k,ph,i){
  if(i<ph.length){busy={k,txt:ph[i][0]};paint();setTimeout(()=>runPh(k,ph,i+1),ph[i][1]);}
  else{busy=null;commitDev(k);}
}
function captureNext(){
  if(!P||busy)return;
  const t=tileDefs().find(x=>x.dev&&DEVS[x.dev].ok&&!have(x.k)&&!(x.k==="bp"&&!P.dev.bp)&&!x.rides);
  if(t)capture(t.k);
}
function commitDev(k){
  if(k==="bp"){
    V.bp=V.bp||{takes:[]};
    const t=P.dev.bp[Math.min(V.bp.takes.length,P.dev.bp.length-1)];
    V.bp.takes.push(t);V.bp.s=t[0];V.bp.d=t[1];V.bp.src="auto";
    V.pulse={v:t[2],src:"rode the cuff"};
    readings+=2;tk(1);afterBp();
  }else if(k==="spo2"){
    V.spo2=V.spo2||{takes:[]};
    const v=P.dev.spo2[Math.min(V.spo2.takes.length,P.dev.spo2.length-1)];
    V.spo2.takes.push(v);
    if(v<75){gate={k:"spo2",kind:"probe",v};note(`SpO₂ read ${v}% — held OUT of the chart. A talking patient at ${v}% is a probe problem until proven otherwise`,"warn");}
    else{
      V.spo2.v=v;V.spo2.src="auto";readings++;
      if(!V.pulse&&P.dev.pr){V.pulse={v:P.dev.pr[0],src:"rode the probe"};readings++;}
      if(V.spo2.takes.length>1){V.spo2.note=`${V.spo2.takes[0]} (probe) → ${v}`;note(`SpO₂ ${v}% after re-clip — the ${V.spo2.takes[0]} lives in the log, never on the chart`,"ok");}
      else note(`SpO₂ ${v}%${V.pulse&&V.pulse.src==="rode the probe"?` · pulse ${V.pulse.v} rode the probe`:""} — in band`,"ok");
    }
    tk(1);
  }else if(k==="temp"){
    V.temp={v:P.dev.temp[0],src:"auto"};readings++;tk(1);
    afterTemp(V.temp.v);
  }else if(k==="wt"){
    V.wt={v:P.dev.wt[0],src:"auto"};readings++;tk(1);
    if(P.say&&P.say.weight)sayThis=P.say.weight;
  }else if(k==="rr"){
    V.rr={v:P.dev.rr?P.dev.rr[0]:18,src:"counted 15 s"};tk(1);
    note(`RR ${V.rr.v} — counted, not guessed. The 15 seconds are the point`,"ok");
  }
  paint();
}
function afterBp(){
  const n=V.bp.takes.length,t=V.bp.takes[n-1],s=t[0],d=t[1],lvl=bpLvl(s,d);
  if(lvl==="danger"){
    if(n===1){
      esc=1;sugg={kind:"now"};sayThis=(P.say&&P.say.danger)||"घबराइए नहीं — अभी दोबारा देख लेते हैं।";
      note(`BP ${s}/${d} — DANGER band. Recheck demanded NOW, other arm. Rest-and-recheck is not offered at this number`,"warn");
    }else{
      esc=2;sugg=null;sayThis=P.say&&P.say.danger||sayThis;
      if(P.cls>0){P.prevCls=P.cls;P.cls=0;P.bumped=true;
        note(`agent DID: queue class ${P.prevCls} → 0 on double-confirmed ${s}/${d} — CANCEL window open 10 s (owner ruling). Dr. Rao's screen flashed; ECG room told; wheelchair asked to Bay 01`,"warn");
        startBumpWindow();}
      else note(`double-confirmed ${s}/${d} — already class 0`,"warn");
    }
  }else if(lvl==="warn"){
    if(n===1&&P.last&&!P.recheckCtx){
      sugg={kind:"rest"};sayThis=P.say&&P.say.rest||sayThis;
      note(`BP ${s}/${d} against ${P.last.bp} (${P.last.when}) — five-minute rest recheck suggested, chips first (stairs? chai?)`,"warn");
    }else if(n>1||P.recheckCtx){
      const first=P.recheckCtx||`${V.bp.takes[0][0]}/${V.bp.takes[0][1]}`;
      note(`after rest: ${first} → ${s}/${d} — the PAIR rides to the doctor, never averaged`,"ok");
      sayThis=P.say&&P.say.settled||sayThis;sugg=null;esc=0;
    }else note(`BP ${s}/${d} — high-normal, logged`,"ok");
  }else{
    if(n>1||P.recheckCtx){
      const first=P.recheckCtx||`${V.bp.takes[0][0]}/${V.bp.takes[0][1]}`;
      note(`settled: ${first} → ${s}/${d} after rest — the PAIR goes on the chart`,"ok");
      sayThis=P.say&&P.say.settled||sayThis;esc=0;sugg=null;
    }else note(`BP ${s}/${d} — in band`,"ok");
  }
}
function serialTog(){
  SERIAL=!SERIAL;
  note(SERIAL?"SERIAL LANE ON — devices capture, keys drop toward zero (preview of the week the hardware lands)":"serial lane OFF — typing lane: ⏎ commits and jumps, 1–8 address a field, every key counted","warn");
  paint();
}
function recheckNow(){
  sugg=null;
  if(SERIAL){capture("bp");return;}
  paint();const el=$("min-bp");if(el)el.focus();
}
function startRest(){
  if(!P||!sugg||sugg.kind!=="rest")return;
  const p=P;p.st="resting";p.restAt=mins+5;
  p.recheckCtx=`${V.bp.s}/${V.bp.d} at ${T(mins)}`;p.V=V;
  note(`${p.nm.split(" ")[0]} to the rest chairs — no chai, no phone-pacing. Recall at ${T(p.restAt)}; I hold the first reading and I will not let us forget her`,"did");

function keepNote(){

function startBumpWindow(){
  bumpLeft=10;bumpFinal=false;
  if(bumpTimer)clearInterval(bumpTimer);
  bumpTimer=setInterval(()=>{
    bumpLeft--;
    if(bumpLeft<=0){clearInterval(bumpTimer);bumpTimer=null;bumpLeft=null;bumpFinal=true;
      note("cancel window closed — class 0 stands. Reversing now is a supervisor action, not a keystroke","warn");
      paint();return;}
    /* tick updates only the countdown text — a full repaint would wipe whatever is mid-typed */
    const b1=$("bumpCancel");if(b1)b1.textContent=`CANCEL · ${bumpLeft}s`;
    const b2=$("bumpPill");if(b2)b2.innerHTML=`was ${P&&P.prevCls!=null?P.prevCls:""} · agent · <b>CANCEL ${bumpLeft}s</b>`;
  },1000);
}
function resetBump(){
  if(bumpTimer){clearInterval(bumpTimer);bumpTimer=null;}
  bumpLeft=null;bumpFinal=false;
}
function cancelBump(){
  if(!P||!P.bumped)return;
  resetBump();
  P.cls=P.prevCls;P.bumped=false;
  note(`CANCELLED inside the window — back to class ${P.cls}, the original queuing stands. Both readings still ride to the doctor; the agent will not re-fire on them`,"warn");
  paint();
}
function manualBump(){
  P.prevCls=P.cls;P.cls=0;P.bumped=true;

}

/* manual entry + gates */
function manual(k){manualK=k;if(k==="rr")rrFocusT=Date.now();paint();
  const el=document.getElementById("min-"+k);if(el)el.focus();}
function mkey(e,k){
  if(e.key==="Enter"){e.preventDefault();commitManual(k,e.target.value);}
  if(e.key==="Escape"){manualK=null;e.target.blur();paint();}
}
function focusNext(k){
  const ord=tileDefs().map(t=>t.k),i=ord.indexOf(k);
  for(let j=1;j<=ord.length;j++){
    const nk=ord[(i+j)%ord.length];
    if(have(nk))continue;
    const el=$("min-"+nk);
    if(el){el.focus();return;}
  }
}
function afterTemp(v){
  if(P.age<13&&v>=38){note(`temp ${v} °C on a ${P.age}-yr-old — fever flagged to ${P.why.split("·").pop().trim()}'s screen ahead of the call`,"warn");sayThis=P.say&&P.say.fever||sayThis;}
  else if(lvlOf("temp",v)!=="ok")note(`temp ${v} °C — outside band`,"warn");
}
function commitManual(k,raw){
  raw=String(raw).trim();
  if(raw===""){focusNext(k);return;}
  if(k==="bp"){
    const m=raw.match(/^(\d{2,3})\s*[\/\\.,\- ]\s*(\d{2,3})$/);
    if(!m){note("BP needs both numbers — type it as 158/96","warn");paint();const el=$("min-bp");if(el)el.focus();return;}
    V.bp=V.bp||{takes:[]};
    V.bp.takes.push([+m[1],+m[2],null]);V.bp.s=+m[1];V.bp.d=+m[2];V.bp.src="manual";
    manualK=null;tk(1);afterBp();paint();
    if(!gate&&esc!==1&&!sugg)focusNext("bp");
    return;
  }
  const v=parseFloat(raw);
  if(isNaN(v)){manualK=null;paint();return;}
  if(k==="spo2"){
    V.spo2=V.spo2||{takes:[]};
    V.spo2.takes.push(v);
    if(v<75){
      gate={k:"spo2",kind:"probe",v};
      note(`SpO₂ typed ${v}% — held OUT of the chart. A talking patient at ${v}% is a probe (or a typo) until proven otherwise`,"warn");
      manualK=null;paint();return;
    }
    V.spo2.v=v;V.spo2.src="manual";manualK=null;tk(1);
    if(V.spo2.takes.length>1){V.spo2.note=`${V.spo2.takes[0]} (probe) → ${v}`;note(`SpO₂ ${v}% on the retake — the ${V.spo2.takes[0]} lives in the log, never on the chart`,"ok");}
    paint();focusNext(k);return;
  }
  if(k==="wt"&&!isChild()&&v<25){
    const fix=Math.round(v*10*10)/10;
    gate={k:"wt",kind:"digit",v,fix:(fix>=30&&fix<=150)?fix:null};
    note(`weight typed ${v} kg on a ${P.age}-yr-old — held at the gate. A slipped digit becomes a chart fact in one keystroke`,"warn");
    manualK=null;paint();return;
  }
  if(k==="ht"&&P.last&&P.last.ht&&Math.abs(v-P.last.ht)>=3){
    gate={k:"ht",kind:"shrink",v};
    note(`height ${v} against ${P.last.ht} (${P.last.when}) — ${Math.abs(v-P.last.ht)} cm apart. Re-measure once before it becomes true`,"warn");
    manualK=null;paint();return;
  }
  if(k==="rr"&&(Date.now()-rrFocusT)<2500){
    note(`RR ${v} landed in under 2 s — was it counted? Guessed RRs are how charts lie. The 15-s counter is one tap`,"warn");
  }
  V[k]={v,src:"manual"};manualK=null;tk(1);
  if(k==="temp")afterTemp(v);
  if(k==="muac"){
    const z=v<11.5?["SAM — severe. This is its own emergency lane","warn"]:v<12.5?["MAM band — nutrition counter flagged","warn"]:["in the green zone","ok"];
    note(`MUAC ${v} cm — ${z[0]}`,z[1]);
  }
  if(k==="wt"&&P.say&&P.say.weight)sayThis=P.say.weight;
  if(k==="ht"&&P.htUnlocked)note(`height re-taken ${v} cm — old ${P.last.ht} stays beside it, reason “${P.htUnlocked}”`,"ok");
  paint();focusNext(k);
}
function gateAct(a){
  if(!gate)return;
  if(gate.kind==="probe"){
    if(a==="retake"){
      gate=null;
      if(SERIAL){capture("spo2");return;}
      paint();const el=$("min-spo2");if(el)el.focus();return;
    }
  }else if(gate.kind==="digit"){
    if(a==="fix"&&gate.fix){V.wt={v:gate.fix,src:"manual"};note(`weight corrected to ${gate.fix} kg — the ${gate.v} never touched the chart`,"ok");}
    if(a==="real"){V.wt={v:gate.v,src:"manual",note:"confirmed real"};note(`weight ${gate.v} kg CONFIRMED real — flagged hard to the doctor, this is its own emergency`,"warn");}
  }else if(gate.kind==="shrink"){
    if(a==="hold"){V.ht={v:gate.v,src:"manual",note:`was ${P.last.ht}`};note(`height ${gate.v} confirmed after re-measure — at ${P.age} a bending spine can do this; the doctor sees both numbers`,"ok");}
    if(a==="back"){/* drop it */}
  }
  gate=null;tk(1);paint();
}
function openUnlock(){ov="unlock";paint();}
function pickUnlock(r){
  P.htUnlocked=r;ov=null;

}
function chipSet(ck,val){

function fmtDelta(k){
  const p=P;if(!p.last)return"";

    const ds=V.bp.s-ls,dd=V.bp.d-ld;
    const col=Math.abs(ds)>15||Math.abs(dd)>10?"var(--gold)":"var(--dim)";
    return`<span class="mo" style="font-size:10.5px;color:${col}">${p.last.when.slice(3,6)} ${p.last.bp} → ${ds>=0?"+":""}${ds}/${dd>=0?"+":""}${dd}</span>`;
  }
  const map={wt:"wt",ht:"ht",pulse:"pulse",spo2:"spo2",temp:"temp",rr:"rr"};
  const lk=map[k];if(!lk||p.last[lk]==null||!V[k]||V[k].v==null)return"";
  const dv=Math.round((V[k].v-p.last[lk])*10)/10;
  return`<span class="mo" style="font-size:10.5px;color:var(--dim)">${p.last.when.slice(3,6)} ${p.last[lk]} → ${dv>=0?"+":""}${dv}</span>`;
}
function rangeLbl(k){

  if(k==="muac")return"green ≥ 12.5";
  const r=R[k];return r?`${r[0]}–${r[1]}`:"";
}
function ghost(k){
  if(!P)return"";
  if(P.gh&&P.gh[k]!=null)return String(P.gh[k]);
  const d=P.dev||{};
  if(k==="bp"&&d.bp){const i=Math.min(V.bp?V.bp.takes.length:0,d.bp.length-1);return d.bp[i][0]+"/"+d.bp[i][1];}
  if(k==="pulse")return d.pr?String(d.pr[0]):(d.bp?String(d.bp[0][2]):"");
  if(k==="spo2"&&d.spo2){const i=Math.min(V.spo2&&V.spo2.takes?V.spo2.takes.length:0,d.spo2.length-1);return String(d.spo2[i]);}
  if(k==="temp"&&d.temp)return String(d.temp[0]);
  if(k==="wt"&&d.wt)return String(d.wt[0]);
  if(k==="rr"&&d.rr)return String(d.rr[0]);

}
function canEdit(k){

    ${saveErr?`<div class="gate gd" style="margin-top:12px;align-items:center">
      <span style="font-size:12.5px"><b>The doctor can't be handed a half-chart.</b> Still owed: ${saveErr.map(k=>k.toUpperCase()).join(", ")} — the band decides what's required, not habit.</span>
      <button class="pill" style="margin-left:auto" onclick="saveErr=null;paint()">ok</button></div>`:""}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:16px">
      ${tileDefs().map(tileHtml).join("")}
    </div>
    ${gateCard}
    ${suggCard}
    ${!gate&&!sugg&&esc===0&&isChild()?agLine(`<b>Child of ${p.age} — the screen changed, not just the limits.</b> Small cuff is on the tray, MUAC tape is due (the tape finds starvation that weight hides), and BP sits out unless asked.`):""}
    ${!gate&&!sugg&&esc===0&&p.id==="ramdev"&&V.bp&&V.bp.takes&&V.bp.takes.length>0&&bpLvl(V.bp.s,V.bp.d)!=="danger"?"":""}
    <div style="display:flex;gap:14px;margin-top:18px;align-items:center">
      <span class="tag">required by band</span>
      ${reqList().map(k=>`<span class="pill ${have(k)?"on":""}" style="height:21px">${have(k)?"✓ ":""}${k.toUpperCase()}</span>`).join("")}
      <span style="font-size:10.5px;color:var(--faint)">${esc>=2?"emergency trims the list — BP, pulse, SpO₂, GO":"everything else is welcome, nothing else blocks"}</span>
    </div>
  </div>`;
}

/* ── bench rail ── */
function paintBench(){
  const b=$("bench");
  const rows=PT.map((p,i)=>{
    const first=PT.findIndex(x=>x.st==="waiting")===i;
    const st=p.st;
    const stPill=st==="waiting"?(first?`<span class="pill on" style="height:19px">next</span>`:`<span class="pill" style="height:19px">waiting</span>`):
      st==="resting"?`<span class="pill gd" style="height:19px">resting · recall ${T(p.restAt)}${mins>=p.restAt?" · DUE":""}</span>`:
      st==="away"?`<span class="pill gd" style="height:19px">stepped out — turn held</span>`:
      st==="inhand"?`<span class="pill on" style="height:19px">on the stool</span>`:
      `<span class="pill on" style="height:19px;border-width:1.5px"><b style="font-size:13px;font-weight:900">✓</b>&nbsp;with doctor · tap to amend</span>`;
    return `
    <div class="benchrow ${first?"nx":st==="resting"?"rs":st==="done"?"dn":""}" onclick="benchTap('${p.id}')" title="${E(p.hint||"")}">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="mo" style="font-size:13px;font-weight:700">${p.tok}</span>
        <span style="font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(p.nm)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span class="mo" style="font-size:10px;color:var(--faint)">${p.age}${p.sex} · cls ${p.cls}</span>${stPill}
      </div>
      ${first?`<div style="font-size:10.5px;color:var(--dim);line-height:14px;margin-top:2px">${E(p.stagept)}</div>`:""}
    </div>`;}).join("");
  b.innerHTML=`
  <div style="padding:14px 12px 8px;display:flex;align-items:baseline;gap:8px">
    <span class="tag">the bench</span>
    <span style="font-size:10.5px;color:var(--faint)">always in sight — timers die in drawers</span>
  </div>
  ${rows}
  <div style="padding:12px;font-size:10.5px;color:var(--dim);line-height:15px">
    <b>The valve:</b> Dr. Rao has 1 callable patient left. Every minute here is a minute a doctor waits downstream.
  </div>`;
}

/* ── drawer / log ── */
function paintDrawer(){
  const d=$("drawer");
  d.style.display=drawer?"block":"none";
  if(!drawer)return;
  d.innerHTML=`
  <div style="padding:12px 18px;max-height:250px;overflow-y:auto">
    ${agAns?`<div style="display:flex;gap:9px;margin-bottom:11px;padding:10px 12px;border:1px solid #2c4438;border-radius:6px;background:#1c332b">
      <span class="pulse" style="width:6px;height:6px;border-radius:99px;background:var(--mint);flex-shrink:0;margin-top:5px"></span>
      <span style="font-size:12px;line-height:17px;color:#fff">${agAns}</span></div>`:""}
    ${log.map(l=>`
    <div style="display:flex;gap:10px;padding:4px 0;font-size:11.5px;line-height:16px">
      <span class="mo" style="color:var(--agent-dim);flex-shrink:0">${l.at}</span>
      <span style="width:7px;height:7px;border-radius:99px;flex-shrink:0;margin-top:4px;background:${l.kind==="ok"?"var(--mint)":l.kind==="warn"?"var(--gold)":l.kind==="you"?"#fff":"var(--agent-dim)"}"></span>
      <span style="color:${l.kind==="you"?"#fff":"var(--agent-fg)"}">${E(l.x)}</span>
    </div>`).join("")}
    <div style="font-size:10px;color:var(--agent-dim);padding:8px 0 2px">every unlock, override and auto-bump lands here, timestamped — undo where reversible</div>
  </div>`;
}

/* ── overlays ── */
function paintOvl(){
  const o=$("ovls");
  if(!ov){o.innerHTML="";return;}
  if(ov==="unlock"){
    o.innerHTML=`<div class="ovl" onclick="if(event.target===this){ov=null;paint()}">
      <div class="box" style="width:420px;padding:20px 22px">
        <div class="tag">unlock carried height — ${P?E(P.nm):""}</div>
        <div style="font-size:12.5px;color:var(--dim);margin-top:6px;line-height:17px">The old value stays on screen beside the new one. The reason rides the audit log.</div>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:14px">
          ${UNLOCK_REASONS.map(r=>`<button class="sec" style="justify-content:flex-start" onclick="pickUnlock('${r}')">${r}</button>`).join("")}

        <button class="pill" style="margin-top:14px" onclick="ov=null;paint()">cancel · Esc</button>

      <div class="box" style="width:440px;padding:10px">

        ${cmds.map(([l,fn])=>`<button style="display:block;width:100%;padding:10px 12px;border-radius:6px;font-size:13px" onmouseover="this.style.background='var(--wash)'" onmouseout="this.style.background=''" onclick="${fn}">${l}</button>`).join("")}
      </div></div>`;
    return;
  }
  if(ov==="procure"){
    const rows=[
      ["BP monitor + cuff set","aneroid + stethoscope · ₹2,400","serial hospital unit (A&D UM-211 class) · ₹28,500","the seat's centrepiece — BP is 2 of the 6 numbers"],
      ["SpO₂","finger clip · ₹1,400","table-top with serial out · ₹16,000","serial also carries pulse — two vitals, zero keys"],
      ["Weighing scale","digital, read &amp; type · ₹3,200","serial platform scale · ₹13,500","today's dead scale is this row arguing for itself"],
      ["Thermometer","digital stick · ₹350","IR non-contact BLE · ₹4,200","IR wins on speed &amp; hygiene even without BLE"],
      ["Stadiometer (height rod)","₹3,800","— always manual —","no serial option worth having"],
      ["Paediatric cuff set (S/XS)","₹1,900","included above","without it, child BP is fiction"],
      ["MUAC tapes (pack)","₹160","—","the ₹160 that finds starvation"],
      ["2D barcode scanner","₹2,900","₹2,900","non-negotiable — it IS the identify-first opening"],
    ];
    o.innerHTML=`<div class="ovl" onclick="if(event.target===this){ov=null;paint()}">
      <div class="box" style="width:780px;max-height:82vh;overflow-y:auto;padding:22px 24px">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span style="font-size:16px;font-weight:700">One bay, two prices</span>
          <span class="pill gd" style="height:21px">OWNER DECISION — money &amp; procurement</span>
        </div>
        <div style="font-size:12px;color:var(--dim);margin-top:5px;line-height:17px">The serial lane is what makes “<b>0 keys</b>” true. The manual lane types ~30 keys × 300 patients a day — and every one of those keys can slip a digit.
        <b style="color:var(--green)">RULED 31-Aug: serial devices are being procured and land within days — the header toggle ships OFF until they do; the typing lane carries the bay till then.</b></div>
        <div style="overflow-x:auto;margin-top:14px">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <tr>${["device","manual-entry lane","serial / connected lane","note"].map(h=>`<th style="text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)" class="tag">${h}</th>`).join("")}</tr>
          ${rows.map(r=>`<tr>${r.map((c,i)=>`<td style="padding:9px 10px;border-bottom:1px solid var(--line2);${i===0?"font-weight:600":""};${i===3?"color:var(--dim);font-size:11px":""}">${c}</td>`).join("")}</tr>`).join("")}
          <tr>
            <td style="padding:10px;font-weight:700">per bay</td>
            <td class="mo" style="padding:10px;font-weight:700">≈ ₹16,110</td>
            <td class="mo" style="padding:10px;font-weight:700">≈ ₹70,960</td>
            <td style="padding:10px;color:var(--dim);font-size:11px">Δ ₹54,850 buys zero transcription at the hospital's narrowest valve</td>
          </tr>
        </table></div>
        <button class="pill" style="margin-top:14px" onclick="ov=null;paint()">close · Esc</button>
      </div></div>`;

  }
  if(ov==="schema"){
    o.innerHTML=`<div class="ovl" onclick="if(event.target===this){ov=null;paint()}">
      <div class="box" style="width:760px;max-height:84vh;overflow-y:auto;padding:24px 26px">
        <div style="font-size:16px;font-weight:700">Bay One — design schema</div>
        <div style="font-size:12px;color:var(--dim);margin-top:4px">Desk One identity carried whole: palette, Plex trio, footer agent bar, in-sight agent cards, Ctrl+K, session column, Esc discipline.</div>

        <div class="tag" style="margin-top:18px">divergences from desk one — each forced by this seat's physics</div>
        <div style="font-size:12.5px;line-height:19px;margin-top:8px">
          <b>1 · The bench rail is always on screen</b> (the counter hides queues behind Q). A rest-and-recheck timer that lives in a drawer is a forgotten patient — the recall must sit in peripheral vision.<br>
          <b>2 · Tiles, not a form.</b> The counter's atom is a text field; this seat's atom is a <i>reading</i> — it has a source (device/typed), a band, a history, and sometimes a second take. A form can't say “both readings kept, never averaged”. The form survives only as the per-tile fallback.<br>
          <b>3 · The agent acts alone exactly once.</b> The counter's agent only drafted and suggested. Here, on a <i>double-confirmed</i> danger reading, it bumps queue class itself — with a <b>10-second CANCEL window</b> at the desk (owner ruling, 31-Aug) — because at 210/130 the cost of a missed escalation is a stroke and the cost of a wrong one is one press of cancel.
        </div>

        <div class="tag" style="margin-top:18px">the autonomy ladder at this seat</div>
        <div style="font-size:12.5px;line-height:19px;margin-top:8px">
          <b style="color:var(--green)">DID (undo live):</b> pre-stage the file on scan · hold a rest-timer &amp; recall · ping biomedical on device death · class bump on double-confirmed danger · hold an away patient's turn.<br>
          <b style="color:var(--gold)">SUGGESTS (one key):</b> 5-min rest recheck on elevated-vs-history · immediate other-arm recheck on one danger reading · MUAC on every under-5 · the say-this line.<br>
          <b>ASKS (never alone):</b> unlocking a carried value · overriding a sanity gate · keeping an unrechecked high reading · anything that <i>downgrades</i> urgency.

        <div class="tag" style="margin-top:18px">decided — one line each, relitigate only what's wrong</div>
        <div style="font-size:12.5px;line-height:19px;margin-top:8px">
          DECIDED: danger-band readings get the other arm <i>now</i>; rest-and-recheck is only for elevated maybes.<br>
          DECIDED: two readings are always both kept — shown as a pair, never averaged, never overwritten.<br>
          DECIDED: BP is not routine under 5; MUAC is required under 5.<br>
          DECIDED: weight is never spoken across the room — it goes on the slip; the patient display never shows numbers.<br>
          DECIDED: a suspicious instant RR gets a nudge, not a block — the honesty tool is the 15-s counter, not a lockout.<br>
          DECIDED: an emergency save requires only BP + pulse + SpO₂ — a crashing patient is not a form.<br>
          DECIDED: the 45% SpO₂ goes to the log, not the chart, unless it survives a re-clip.<br>
          RULED (owner, 31-Aug): the auto-bump stands, with a 10-second cancel at the desk; after the window, reversal is supervisory.<br>
          RULED (owner, 31-Aug): serial capture is a header TOGGLE, shipped OFF until the devices land — the typing lane is first-class: ⏎ commits and jumps, 1–8 address fields, all gates identical in both lanes.<br>
          RULED (owner, 31-Aug): a saved chart is amendable at this desk — tap the ✓-with-doctor row to re-open; ✎ re-enters a value; every change is audited beside the old one; Esc abandons untouched.<br>
          RULED (owner, 31-Aug): three doors into the session — scan the barcode, or type the token number, or type the UHID; all start the identical lane.<br>
          RULED (owner, 31-Aug): a save is confirmed by a <b>bold ✓</b> — the banner on the identify screen names who went to which doctor, and the bench row wears the same tick.
        </div>

        <div class="tag" style="margin-top:18px">keyboard</div>
        <div style="font-size:12px;color:var(--dim);margin-top:6px;line-height:19px">
          S scan next · Space next device capture · R rest &amp; recheck · Ctrl ⏎ save → next · F2 ask the agent · Ctrl K command · Esc clear / close
        </div>
        <button class="pill" style="margin-top:16px" onclick="ov=null;paint()">close · Esc</button>
      </div></div>`;
    return;

  o.innerHTML="";

/* ══════════ keyboard ══════════ */
document.addEventListener("keydown",e=>{
  const tag=e.target.tagName;
  if(e.key==="F2"){e.preventDefault();document.getElementById("askIn").focus();return;}
  if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();save();return;}
  if(e.ctrlKey&&(e.key==="k"||e.key==="K")){e.preventDefault();ov=ov==="pal"?null:"pal";paint();return;}
  if(tag==="INPUT"){
    if(e.key.length===1&&e.target.id&&e.target.id.startsWith("min-")){keys++;$("keysPill").innerHTML=`<span class="mo">${keys}</span> keys · <span class="mo">${readings}</span> device reads`;}
    if(e.key==="Escape")e.target.blur();
    return;
  }
  if(e.key==="Escape"){if(ov){ov=null;paint();}else clearDesk();return;}
  if(!P&&(e.key==="s"||e.key==="S")){scanNext();return;}
  if(P&&/^[1-9]$/.test(e.key)){
    const els=document.querySelectorAll('input[id^="min-"]');
    const el=els[+e.key-1];
    if(el){e.preventDefault();el.focus();return;}
  }
  if(P&&e.key===" "){
    e.preventDefault();
    if(SERIAL)captureNext();
    else{const el=document.querySelector('input[id^="min-"]');if(el)el.focus();}
    return;
  }
  if(P&&(e.key==="r"||e.key==="R")&&sugg&&sugg.kind==="rest"){startRest();return;}
});

paint();
</script>
