        ...(s && s.pndt ? [{ k: 'ok', h: 'Obstetric scan: Form F opens in Room 111. The sonologist <b>Dr. Farah Siddiqui</b> is registered on US-2.' }] : []),
      ] }, { tag: 'Best slot', items: [{ k: 'ok', h: s ? `${esc(devFor(s))} at <b>${hm((FREE[devFor(s)] || [now()])[0])}</b> — shortest wait with prep time counted.` : 'Nothing to book.' }] }],
      say: { en: s ? `Your ${esc(s.n)} is in ${esc(DEV[devFor(s)] ? DEV[devFor(s)].room : 'the imaging wing')}. ${s.contrast ? 'Please do not eat for 4 hours before. ' : ''}The report comes on WhatsApp.` : 'Nothing left to book today.',
        hi: s ? `आपका ${esc(s.n)} ${esc(DEV[devFor(s)] ? DEV[devFor(s)].room : 'imaging wing')} में होगा। ${s.contrast ? 'जांच से 4 घंटे पहले कुछ न खाएं। ' : ''}रिपोर्ट WhatsApp पर आएगी।` : 'आज कुछ बुक नहीं करना है।' },
      ask: 'Ask about ' + p.n.split(' ')[0],
    });
  }
  const rows = counterRows().map(pid => {
    const ss = studiesOf(pid).filter(s => ['to_book', 'scheduled', 'checked_in'].includes(s.state)), s = ss[0];
    const w = now() - (s.slot && s.state === 'scheduled' ? s.slot : s.ordered);
    const more = ss.slice(1).reduceRight((h, x) => `<span data-acc="${x.acc}">${h}</span>`, ss.length > 1 ? ' +' + (ss.length - 1) : '');
    return { arg: pid, no: s.slot ? hm(s.slot) : 'now', nm: esc(PT[pid].n), ln: `${src(s.src)} ${pri(s.pri)} ${mod(modOf(s))} <span data-acc="${s.acc}" data-state="${s.state}">${esc(s.n.split(',')[0])}</span>${more}${s.state === 'to_book' ? ' · <b style="color:var(--gold-ink)">to book</b>' : ''}${s.hold ? ' · <span style="color:var(--red)">held</span>' : ''}`, wt: s.state === 'scheduled' && s.slot > now() ? 'in ' + span(s.slot - now()) : span(w), wc: s.pri === 'stat' ? 'rd' : w > 1800 ? 'gd' : '' };
  });
  return plist('At the counter', rows, 'desk.open') + clocks('desk', [
    { d: 'rd', w: 'TPA pre-auth · Rajesh Mahto MRI', y: 'MediAssist · chased at 30 min', t: since(ago(22)) },
    { d: '', w: 'Deepa Kachhap · order not booked', y: 'early-pregnancy scan, spotting — book today', t: since(ago(8)) },
    { d: '', w: 'Discount request · waiting for the supervisor', y: 'answers in 10 min or it goes to the HOD', t: '4m' },
    { d: 'ok', w: 'Cash drawer · open', y: 'Neha Singh · float ₹2,000', t: '3h 08m' },
  ]);
}

ACT['desk.open'] = pid => { D.sel = pid; studiesOf(pid).filter(s => s.state === 'scheduled' && s.slot && s.slot < at(20, 0)).forEach(s => checkIn(s.acc)); const l = deskStudies(pid); D.acc = l[0] ? l[0].acc : null; D.step = 0; S.view.desk = S.view.desk === 'outside' ? 'outside' : 'counter'; };
ACT['desk.acc'] = acc => { D.acc = acc; };
ACT['desk.step'] = i => { D.step = +i; const c = $('#centre'); if (c) c.scrollTop = 0; };
INP['desk.q'] = v => { D.q = v; };
ACT['desk.search'] = () => {
  const q = String(D.q || '').toLowerCase().trim(); if (!q) { toast('Type a name, UHID, phone or accession.', true); return false; }
  const p = Object.values(PT).find(x => x.n.toLowerCase().includes(q) || x.uhid.toLowerCase() === q || x.phone.replace(/\s/g, '').includes(q.replace(/\s/g, '')) || studiesOf(x.id).some(s => s.acc.toLowerCase() === q));
  if (!p) { toast('No patient matches “' + esc(D.q) + '”. A new patient registers at the front desk first.', true); return false; }
  ACT['desk.open'](p.id);
};
INP['desk.add'] = v => { D.add = v; };
ACT['desk.addStudy'] = () => { toast(D.add ? `Added “${esc(D.add)}” as a draft line. The ordering doctor must confirm it — the counter cannot order on its own authority.` : 'Type the study to add.', !D.add); return false; };
INP['desk.dupr'] = (v, el) => { D.dupReason[el.dataset.acc] = v; render(); };
ACT['desk.scanRx'] = pid => { D.checks['rx:' + pid] = true; STUDY.filter(s => s.pt === pid && s.outsideRx).forEach(s => { D.checks[s.acc + ':rx'] = 'ok'; }); toast('Slip scanned and attached to the order.'); };
ACT['desk.ck'] = a => { const [acc, k, v] = a.split(':'); D.checks[acc + ':' + k] = D.checks[acc + ':' + k] === v ? 'wt' : v; };
ACT['desk.payer'] = k => { D.payer[D.sel] = k; };
ACT['desk.film'] = acc => { D.film[acc] = !D.film[acc]; };
ACT['desk.cd'] = acc => { D.cd[acc] = !D.cd[acc]; };
ACT['desk.disc'] = pid => { if (D.discReq[pid]) return; const s = deskStudies(pid)[0]; D.discReq[pid] = askApproval({ kind: 'discount', acc: s ? s.acc : null, ask: `Discount for ${PT[pid].n} (${s ? s.n : 'imaging'}), ${rupee(bill(PT[pid]).total)}: patient cannot pay in full. At most 10%.` }).id; toast('Sent to the HOD’s approvals with the patient’s reason. The counter never discounts.'); };
ACT['desk.preauth'] = pid => { D.preauth[pid] = 'ok'; toast('Pre-authorisation PA/26/88120 recorded.'); };
ACT['desk.pay'] = a => { const [pid, how] = a.split(':'); D.paid[pid] = { amt: bill(PT[pid]).total, how, at: now(), inv: 'INV26092802' + (40 + Object.keys(D.paid).length) }; toast(`${rupee(D.paid[pid].amt)} received by ${how}. Invoice ${D.paid[pid].inv}.`); };
ACT['desk.slot'] = a => {
  const [acc, dv, t] = a.split(':'); const d = DEV[dv];
  if (t !== 'now' && D.taken && D.taken[dv + t]) { toast('slot_taken — someone booked ' + hm(+t) + ' on ' + dv + ' a moment ago. Pick the next one.', true); return; }
  D.slot[acc] = t === 'now' ? { dev: dv, t: now(), now: true } : { dev: dv, t: +t };
  if (d && (d.aerb === 'pending' || d.aerb === 'lapsed')) toast(`Booked on ${dv}, but the room will refuse the scan until the licence is filed.`, true);
};
ACT['desk.later'] = acc => { const s = study(acc); logEv(acc, 'order.kept_open', 'room cannot take bookings'); toast(`WhatsApp to ${esc(PT[s.pt].n)}: the ${esc(s.n.split(',')[0])} waits for its room; we call with a date. The order stays open.`); return false; };
ACT['desk.bell'] = acc => { DSP.called = { acc, at: now() }; toast(`Calling token ${esc(tokenOf(study(acc)))} on the hall display and by voice.`); };
ACT['desk.wa'] = pid => { D.sent[pid] = now(); toast('Prep instructions sent on WhatsApp.'); };
ACT['desk.finish'] = () => {
  const p = PT[D.sel];
  const errs = []; let inNow = false;
  deskStudies(p.id).forEach(s => { const sl = D.slot[s.acc]; if (!sl) return; const r = bookStudy(s.acc, sl.dev, sl.t); if (r) { errs.push(r); return; } s.unpaid = payerOf(p) === 'self' && !D.paid[p.id]; if (sl.now) { checkIn(s.acc); inNow = true; } D.taken = D.taken || {}; D.taken[sl.dev + sl.t] = true; });
  if (errs.length) { toast(errs.map(e => e.code + ' — ' + esc(e.msg)).join(' '), true); return; }
  toast(`${esc(p.n)} booked. Slip printed${D.sent[p.id] ? ', WhatsApp sent' : ''}. ${inNow ? `Checked in — the prep bay and the room see ${p.sex === 'M' ? 'him' : 'her'} now.` : ''}`);
  D.sel = null; D.acc = null; D.step = 0;
};

})();
const KIND = { done: ['Done', 'var(--line2)', 'var(--dim)'], booked: ['Booked', 'var(--green-soft)', 'var(--green)'], stat: ['STAT', 'var(--red-soft)', 'var(--red)'], held: ['Held or in prep', 'var(--gold-soft)', 'var(--gold-ink)'], er: ['ER hold', 'repeating-linear-gradient(45deg,var(--red-soft),var(--red-soft) 6px,transparent 6px,transparent 12px)', 'var(--red)'], qa: ['Blocked', 'var(--wash)', 'var(--dim)'], sed: ['Sedation', 'var(--blue-soft)', 'var(--blue)'], now: ['On the table', 'var(--ink)', '#fff'] };
const ROOM_K = ['identity_two_factor', 'laterality_confirm'];
const DUR = s => { const m = modOf(s); return m === 'MR' ? 45 : m === 'CT' ? (s.contrast ? 30 : 20) : m === 'US' ? (s.pndt ? (/ANOMALY/.test(s.st) ? 40 : 30) : 20) : m === 'MG' ? 20 : m === 'DX' ? 15 : 10; };
const stamp = s => s.slot || s.started || (s.done ? s.done - DUR(s) * 60 : null);
const kindOf = s => {
  if (['cancelled', 'no_show', 'to_book'].includes(s.state)) return null;
  if (s.state === 'in_acquisition') return 'now';
  if (['acquired', 'drafted', 'reported', 'published'].includes(s.state)) return 'done';

ACT['room.devdownGo'] = code => { const why = ($('#room-bk') || {}).value || 'Fault'; const moved = setDevice(code, 'down', why); R.tickets.unshift({ id: 'BME-09' + (20 + R.tickets.length), d: code, t: why, s: 'Arvind Prasad paged · vendor call logged', at: hm(now()) }); S.modal = null; toast(`${esc(code)} down · ticket raised · ${moved.length} booked patient${moved.length === 1 ? '' : 's'} to move`, true); };
/* a rebooking from the downtime board moves the slot; the desk sees it in the diary */
ACT['room.rer'] = a => { const [acc, t] = a.split('|'); R.rer[acc] = t; const st = study(acc); if (st) { if (/^XR-2/.test(t)) { const r = bookStudy(acc, 'XR-2', at(15, 0)); if (r) { toast(esc(r.code) + ' — ' + esc(r.msg), true); return; } } else { st.slot = at(9, 15) + 86400; st.state = 'scheduled'; logEv(acc, 'study.rescheduled', t); } } toast('Done · ' + esc(t)); };
ACT['room.paper'] = () => { R.paper = !R.paper; toast(R.paper ? 'Paper mode declared · rooms use manual accessions' : 'HMIS back · back-enter the sheets'); };

/* ══════ register ══════ */
station({
  id: 'room', name: 'Modality rooms', person: { n: STAFF.amit.n, i: STAFF.amit.i, role: STAFF.amit.role },
  navs: [
    { id: 'console', label: 'Room console', n: '', b: 'part', why: 'Start/acquired/images routes and a study screen exist; protocol book, contrast record, abort, repeat and dose capture UI are new.' },
    { id: 'portable', label: 'Portable round', get n() { const n = STUDY.filter(x => x.dev === 'PX-1' && ['scheduled', 'checked_in', 'ready', 'in_acquisition'].includes(x.state)).length; return n ? String(n) : ''; }, b: 'none', why: 'bedside_location and resolveBedside exist but nothing writes them; the ward order from the Doctor’s door lands here.' },
    { id: 'ir', label: 'IR suite', b: 'none', why: 'No interventional procedure record, checklist, sedation chart or skin dose.' },
    { id: 'dose', label: 'Dose log', b: 'part', why: 'radiation_dose_register and DRL nudge exist; DRL book has no screen; no patient lookup.' },
    { id: 'rejects', label: 'Rejects & repeats', get n() { const n = BILLQ.filter(b => b.state === 'open' && BK[b.kind]).length; return n ? String(n) : ''; }, b: 'part', why: 'repeat columns and bill decisions exist; no screen resolves a bill decision.' },
    { id: 'downtime', label: 'Downtime', get n() { const n = Object.values(DEV).filter(d => d.up === 'down' || d.up === 'qa_blocked').length; return n ? String(n) : ''; }, get red() { return true; }, b: 'none', why: 'Device statuses exist on the row; no screen or route changes them; no tickets or paper kit.' },
  ],
  layout: v => v === 'console' || v === 'portable' || v === 'ir' ? 'three' : v === 'dose' || v === 'rejects' ? 'two' : 'one',
  lane: v => lane(v),

  right: v => v === 'portable' ? portRight() : v === 'ir' ? irRight() : v === 'dose' ? doseRight() : v === 'rejects' ? rejRight() : consoleRight(),
  drop: () => { const v = S.view.room; if (v === 'portable') R.port = null; else if (v === 'ir') R.ir = null; else R.sel = null; },
});
})();

<script>

(function () {

const U = { sel: null, f: {}, ff: {}, next: { 'US-1': 211, 'US-2': 418, 'US-3': 37 }, month: { generated: false, sent: false }, reg: {} };

/* the Act's indications for ultrasonography during pregnancy (Form F, section B — abridged list) */

const FF_FIELDS = [

/* ─── lane ─── */
function lane(v) {

    <div class="sect"><span class="tag">Clinical question</span><p class="lane-p" style="color:var(--ink)">${esc(s.q)}</p></div>

}

/* ─── the room ─── */
function roomCentre() {
  let h = chead('Ultrasound room', 'The sonologist scans, measures and signs in the same sitting.', '') +
    built('part', 'Form F exists end to end (<span class="mo">/pcpndt/form-f/:studyId</span>: open, record, verify; gap-free serials; lockout tier) and the <span class="mo">form_f</span> gate can never be waived or overridden. The report screen has a <span class="mo">usg_obstetric</span> section template. <b>Structured measurements, auto GA/EFW and one-sitting sign are new.</b>');
  const s = U.sel && study(U.sel);
  if (!s) {
    return h + `<div class="grid3">${USG_ROOMS.map(r => { const d = DEV[r]; const q = usgList().filter(x => x.dev === r && !done(x)); return `<div class="box tile"><div class="row"><span class="tag grow">${esc(r)}</span>${pill('PCPNDT ✓', 'on sm')}</div><div style="font-size:12.5px;font-weight:600;margin-top:6px">${esc(d.n)}</div><div class="nt">${esc(d.room)} · ${q.length} waiting</div><div class="nt mo">Next Form F: ${esc(r)}/2026/${String(U.next[r]).padStart(4, '0')}</div></div>`; }).join('')}</div>` +
      `<div class="brief"><b>Rule of the room.</b> A pregnant woman is never scanned before her Form F is opened and her declaration is signed. The serial is taken when the form opens and can never be returned — a cancelled scan keeps its serial, marked cancelled. No one in this room says, writes, gestures or prints the sex of the foetus.</div>`;
  }

  const cur = done(s) ? steps.length : g.step;
  h += `<div class="box" style="padding:12px 14px"><div class="row"><span class="grow"><span style="font-size:16px;font-weight:600">${esc(p.n)}</span> <span class="dim">· ${p.age}${p.sex} · ${esc(s.n)}</span></span>${src(s.src)}${ob ? pill('PCPNDT', 'gd sm') : ''}${stPill(s)}</div></div>`;
  h += stepper(steps, cur, 'usg.step');

  else if (k === 'scan') h += ob ? scanOb(s, p, g) : scanAbd(s, p, g);

  h += roomDock(s, g, ob, ff, k);

}
function formF(s, p, ff) {
  let h = `<div class="step-h"><span class="num">1</span><h2>Form F</h2><span class="dim">Pre-Natal Diagnostic Techniques Act, 1994 · Rule 9(4)</span></div>`;

  const skip = `<div class="row" style="justify-content:flex-end"><button class="lnk" data-act="usg.skip" data-arg="waived" style="color:var(--red)">Emergency — skip Form F?</button><button class="lnk" data-act="usg.skip" data-arg="overridden" style="color:var(--red)">Radiologist override?</button></div>`;
  if (!ff) return h + skip + refuse('gate_open · form_f', HOLD_N.form_f) + `<div class="okline">Opening the form takes serial <b class="mo">${esc(s.dev)}/2026/${String(U.next[s.dev]).padStart(4, '0')}</b> for ${esc(s.dev)} for 2026. The serial cannot be given back: if the scan is cancelled, the form stays in the register marked cancelled.</div>`;
  const miss = FF_FIELDS.filter(([k]) => !ff.v[k]);
  h += card(`Form F · <span class="mo">${esc(ff.serial)}</span>`, FF_FIELDS.map(([k, t]) => ck(ff.v[k] ? 'ok' : 'wt', t, ff.v[k] ? esc(ffVal(s, p, k)) : ffHint(k), ff.v[k] ? '' : k === 'ind' ? '' : `<button class="sec sm grn" data-act="usg.ff" data-arg="${k}">${k === 'pdecl' ? 'Patient signs on tablet' : k === 'sdecl' ? 'Sign declaration' : k === 'referral' ? 'Scan slip' : 'Fill from record'}</button>`)).join(''), pill(miss.length ? miss.length + ' missing' : 'complete', miss.length ? 'gd sm' : 'on sm'));
  if (!ff.v.ind) h += card('Indication — pick from the Act’s list (section B)', `<div class="card-b" style="display:grid;gap:6px">${IND.map(([c, t]) => `<button class="chk" style="justify-content:flex-start;text-align:left" aria-pressed="${ff.ind === c}" data-act="usg.ind" data-arg="${c}"><span class="mo" style="width:34px">${c}</span><span>${esc(t)}</span></button>`).join('')}</div>`);
  h += skip + `<div class="warnline">The sonologist’s declaration is signed by <b>Dr. Farah Siddiqui (DR-0615)</b>, who is on the registration for <b>${esc(s.dev)}</b>. Dr. Rohan Das is not on it: if he opens this form it refuses <span class="mo">person_not_registered_on_machine</span>, even though he is registered on another centre’s certificate.</div>`;
  return h;
}
function idCard(s, p) {
  if (!idOpen(s)) return card('Identity', ck('ok', 'Two identifiers matched', `${esc(p.uhid)} on the wristband · “${esc(p.n)}, ${p.age}” said by the patient`));
  return card('Identity', ck('wt', 'Wristband and name, before anything else', 'The patient says her own name and age; compared with the wristband UHID', `<button class="sec sm grn" data-act="usg.id">Matches ${esc(p.uhid)}</button> <button class="sec sm rd" data-act="usg.idbad">Does not match</button>`));
}
function ffVal(s, p, k) {
  return { name: `${p.n}, ${p.age} y, Sonari, Jamshedpur`, spouse: s.pt === 'anita' ? 'Husband: Manoj Kumar' : 'Husband: Sanjay Kachhap', children: s.pt === 'anita' ? '1 living child (daughter, 4 y)' : 'None', lmp: p.lmp ? `LMP ${p.lmp} · 20 weeks 0 days` : '9 weeks by LMP', referral: `${DOC[s.doc].id} · slip scanned`, ind: (IND.find(x => x[0] === (U.ff[s.acc] || {}).ind) || ['', ''])[1], pdecl: 'Signed 11:12 on the tablet, in Hindi', sdecl: 'Signed under TOTP by DR-0615' }[k];
}
const ffHint = k => ({ children: 'The Act requires the sex of each living child — recorded, never discussed', pdecl: '“मैं अपने गर्भस्थ शिशु का लिंग नहीं जानना चाहती।”', sdecl: 'Signed after the scan is finished, before the report prints', referral: 'Self-referred is allowed; the slip is kept for 2 years' }[k] || '');
function scanOb(s, p, g) {
  const m = g.m, early = s.st === 'USG-OBS-EARLY';
  let h = `<div class="step-h"><span class="num">2</span><h2>Scan and measure</h2><span class="dim">typed as you measure; the calculations follow</span></div>`;
  h += viewer({ bar: `<span>${esc(s.dev)} · OB</span><span class="grow"></span><span>${early ? 'TVS 7.5 MHz' : 'C1-5 3.5 MHz'}</span>`, cells: [{ kind: 'usg', o: { seed: early ? 44 : 31, finding: 'fetus' }, tl: esc(p.n) + '<br>' + esc(s.acc), tr: esc(s.dev) + '<br>' + hm(now()), br: early ? 'CRL' : 'BPD / HC' }], thumbs: [0, 1, 2].map(i => ({ kind: 'usg', o: { seed: 50 + i, finding: 'fetus' }, label: ['BPD', 'AC', 'FL'][i] })) });
  const fld = early ? [['crl', 'CRL', 'mm'], ['fhr', 'Cardiac activity (FHR)', 'bpm'], ['sac', 'Gestational sac', 'mm']] : [['bpd', 'BPD', 'mm'], ['hc', 'HC', 'mm'], ['ac', 'AC', 'mm'], ['fl', 'FL', 'mm'], ['fhr', 'FHR', 'bpm'], ['afi', 'Liquor (AFI)', 'cm']];
  h += card('Biometry', `<div class="card-b"><div class="formgrid">${fld.map(([k, t, u]) => `<label>${t} <span class="mo">(${u})</span><input class="in sm mo" id="usg-${k}" data-in="usg.m" data-k="${k}" value="${esc(m[k] || '')}" inputmode="decimal"></label>`).join('')}</div>${calcOb(m, early)}</div>`);
  h += card('Findings', `<div class="card-b" style="display:grid;gap:8px">${(early ? [['num', 'Number', ['Single', 'Twins']], ['loc', 'Location', ['Intrauterine', 'Ectopic suspected']], ['sh', 'Subchorionic haematoma', ['None', 'Small', 'Large']]] : [['num', 'Number', ['Single', 'Twins']], ['pres', 'Presentation', ['Cephalic', 'Breech', 'Transverse']], ['plac', 'Placenta', ['Posterior, upper segment', 'Anterior, upper segment', 'Low-lying']], ['cord', 'Cord', ['3 vessels', '2 vessels']], ['anat', 'Anomaly survey', ['No structural anomaly seen', 'Anomaly — describe']]]).map(([k, t, opts]) => `<div class="row"><span style="width:170px;font-size:12.5px">${t}</span>${opts.map(o => `<button class="chk ${/Ectopic|Large|Low|2 vessels|Anomaly —/.test(o) ? 'no' : ''}" aria-pressed="${g.organs[k] === o}" data-act="usg.o" data-arg="${k}|${esc(o)}">${esc(o)}</button>`).join('')}</div>`).join('')}</div>`);

function calcOb(m, early) {

  const ac = +m.ac / 10, fl = +m.fl / 10, hc = +m.hc / 10; if (!(ac && fl && hc)) return '<p class="sub" style="margin-top:8px">GA and estimated foetal weight appear when HC, AC and FL are in.</p>';

  const ga = 10.35 + 0.2976 * (+m.fl) + 0.0068 * (+m.fl) * (+m.fl) * 0.1;
  return `<p class="sub" style="margin-top:8px">EFW (Hadlock) <b class="mo">${Math.round(efw)} g</b> · GA by biometry <b class="mo">${Math.floor(ga)} w ${Math.round((ga % 1) * 7)} d</b> · by LMP 20 w 0 d · ${Math.abs(ga - 20) > 2 ? '<span style="color:var(--gold-ink)">discrepancy over 2 weeks — note it</span>' : 'concordant'}</p>`;
}
function eddFrom(days) { const t = new Date(2026, 8, 28); t.setDate(t.getDate() + (280 - Math.round(days))); return t.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
function scanAbd(s, p, g) {
  const O = [['liver', 'Liver', ['Normal size and echotexture', 'Fatty (grade I)', 'Enlarged']], ['gb', 'Gall bladder', ['Normal, no calculus', 'Calculus', 'Wall thickened']], ['cbd', 'CBD', ['Not dilated (4 mm)', 'Dilated']], ['pan', 'Pancreas', ['Normal', 'Obscured by gas', 'Bulky']], ['spl', 'Spleen', ['Normal (10.2 cm)', 'Enlarged']], ['kid', 'Kidneys', ['Both normal', 'Calculus', 'Hydronephrosis']], ['ub', 'Urinary bladder', ['Normal', 'Wall thickened']], ['ut', 'Uterus / adnexa', ['Normal', 'Fibroid', 'Adnexal cyst']]];
  return `<div class="step-h"><span class="num">1</span><h2>Scan the organs</h2><span class="dim">tap what you see; normal is one tap per organ</span></div>` + idCard(s, p) +
    viewer({ bar: `<span>${esc(s.dev)} · ABD</span><span class="grow"></span><span>C1-5 3.5 MHz</span>`, cells: [{ kind: 'usg', o: { seed: 61, finding: g.organs.gb === 'Calculus' ? 'stone' : '' }, tl: esc(p.n) + '<br>' + esc(s.acc), tr: esc(s.dev) + '<br>' + hm(now()), br: 'GB long' }] }) +
    card('Organs', `<div class="card-b" style="display:grid;gap:8px">${O.map(([k, t, opts]) => `<div class="row"><span style="width:130px;font-size:12.5px">${t}</span>${opts.map((o, i) => `<button class="chk ${i ? 'no' : ''}" aria-pressed="${g.organs[k] === o}" data-act="usg.o" data-arg="${k}|${esc(o)}">${esc(o)}</button>`).join('')}</div>`).join('')}<div class="row"><button class="sec sm" data-act="usg.allnormal">Everything else normal</button>${g.organs.gb === 'Calculus' ? `<label class="fl" style="flex:1 1 200px">Calculus size (mm)<input class="in sm mo" id="usg-gbs" data-in="usg.m" data-k="gbs" value="${esc(g.m.gbs || '')}"></label>` : ''}</div></div>`);
}
function draftText(s, p, g) {
  const o = g.organs, m = g.m;
  if (s.st === 'USG-OBS-EARLY') return { f: `Single ${o.loc === 'Ectopic suspected' ? '— no intrauterine sac seen; adnexal mass' : 'live intrauterine'} gestation. CRL ${m.crl || '—'} mm, corresponding to ${m.crl ? calcOb(m, true).replace(/<[^>]+>/g, '').split('·')[0].replace('GA by CRL:', '').trim() : '—'}. Cardiac activity present, FHR ${m.fhr || '—'} bpm. Gestational sac ${m.sac || '—'} mm. Subchorionic haematoma: ${(o.sh || 'none').toLowerCase()}. Both ovaries normal.`, i: o.sh && o.sh !== 'None' ? `Single live intrauterine pregnancy of about 9 weeks with a ${o.sh.toLowerCase()} subchorionic haematoma — explains the spotting. Repeat scan in 2 weeks.` : 'Single live intrauterine pregnancy of about 9 weeks. No cause for spotting seen on this scan.' };

const TARGET = s => s.pri === 'stat' ? 30 : s.src === 'ER' ? 60 : s.src === 'IPD' ? 360 : s.src === 'OUT' ? 2880 : 1440;
const startOf = s => s.done || s.ordered;
const left = s => (startOf(s) + TARGET(s) * 60) - now();
const readable = s => ['acquired', 'drafted', 'in_acquisition', 'reported', 'published'].includes(s.state);
const isDone = s => ['reported', 'published'].includes(s.state);
const subsp = s => ({ 'CT-HEAD-PLAIN': 'Neuro', 'MRI-LS-SPINE': 'Neuro · spine', 'MRI-BRAIN-PLAIN': 'Neuro', 'CT-TRAUMA': 'Emergency · body', 'XR-CHEST': 'Chest', 'OUTSIDE-READ': 'Chest · oncology', 'CT-CHEST-PLAIN': 'Chest', 'USG-ABDO': 'Body · USG', 'USG-THYROID': 'Head & neck · USG', 'MMG-BILATERAL': 'Women’s imaging' }[s.st] || 'General');
const priRank = s => (s.pri === 'stat' ? 0 : s.pri === 'urgent' ? 1 : 2);
const openCrit = () => CRIT.filter(c => c.state === 'open');
function queue(withDone) {
  const q = STUDY.filter(s => readable(s) && (withDone || !isDone(s)));
  const by = {
    pri: (a, b) => (isDone(a) - isDone(b)) || (a.state === 'in_acquisition') - (b.state === 'in_acquisition') || priRank(a) - priRank(b) || left(a) - left(b),
    due: (a, b) => (isDone(a) - isDone(b)) || left(a) - left(b),
    mod: (a, b) => (isDone(a) - isDone(b)) || modOf(a).localeCompare(modOf(b)) || left(a) - left(b),

}
const signedAt = s => s.signedAt || now();

const clockCell = s => {

/* ══════ deterministic checks: no model on this path ══════ */
const CRIT_TERMS = ['haemorrhage', 'hemorrhage', 'bleed', 'laceration', 'pneumothorax', 'free air', 'pneumoperitoneum', 'dissection', 'hyperdense left mca', 'hyperdense right mca', 'hyperdense mca', 'infarct', 'tension', 'midline shift', 'right atrium', 'carina', 'torsion', 'ectopic', 'cord compression'];
const NEG = /\b(no|without|not|nor|negative for)\b[^.]{0,40}$/i;
function critHits(text) {
  const t = text.toLowerCase(), out = [];
  CRIT_TERMS.forEach(term => { let i = t.indexOf(term); while (i >= 0) { if (!NEG.test(t.slice(Math.max(0, i - 45), i))) { out.push(term); break; } i = t.indexOf(term, i + 1); } });
  return [...new Set(out)];
}
function runChecks(s) {
  const x = txtOf(s), p = PT[s.pt], all = [x.find, x.imp, x.rec].join(' '), low = all.toLowerCase(), out = [];
  if (!x.imp.trim()) out.push({ k: 'no', code: 'impression_required', h: 'The impression is empty. A report cannot be signed without one.' });
  // laterality: a territory named on both sides, against the clinical side
  if (s.acc === 'I2609280041' && /right insular/.test(low) && /left (middle cerebral|mca)/.test(low))
    out.push({ k: 'no', code: 'laterality_conflict', h: 'Findings put the <b>hyperdense MCA on the left</b> but the <b>insular ribbon on the right</b>. The clinical question says right-sided weakness, which points to the left hemisphere.', fix: 'read.fixSide', fixL: 'Change to “left insular ribbon”' });
  if (/\bleft\b/.test((s.q || '').toLowerCase()) && /\bright\b/.test(low) && !/\bleft\b/.test(low) && (s.st || '').startsWith('XR'))
    out.push({ k: 'warn', code: 'laterality_check', h: 'The request names the left side; the report names only the right.' });
  // sex-specific organs
  const female = ['uterus', 'ovary', 'ovaries', 'endometri'], male = ['prostate', 'testis', 'testes', 'seminal'];
  const wrong = (p.sex === 'M' ? female : male).filter(w => low.includes(w));
  if (wrong.length) out.push({ k: 'no', code: 'sex_organ_mismatch', h: `The report mentions <b>${esc(wrong.join(', '))}</b> for a ${p.sex === 'M' ? 'male' : 'female'} patient.` });
  // category calculators must be settled
  const t = TPL[tplOf(s)];
  if (t.calc === 'birads' && !R.cat['b' + s.acc]) out.push({ k: 'no', code: 'category_required', h: 'Mammography needs a BI-RADS category before signing.' });
  if (t.calc === 'aspects' && low.includes('aspects')) {
    const sc = 10 - (R.asp[s.acc] || []).length, m = low.match(/aspects\s*(\d+)/);
    if (m && +m[1] !== sc) out.push({ k: 'warn', code: 'score_mismatch', h: `The text says ASPECTS ${m[1]}; the calculator reads ${sc}.` });
  }
  // measurement against the prior
  if (s.pt === 'mohan' && /nodule/.test(low)) out.push({ k: 'ok', h: 'Nodule measured against 12 Mar 2026 (6 mm).' });
  // critical terms
  const hits = critHits([x.find, x.imp].join(' '));
  if (hits.length && !R.cat[s.acc]) out.push({ k: 'warn', code: 'critical_term', h: `Critical terms found: <b>${esc(hits.join(', '))}</b>. Flag a critical result or say why not.`, fix: 'read.flagRed', fixL: 'Flag red and start the call' });
  if (!out.some(o => o.k !== 'ok')) out.push({ k: 'ok', h: 'Side, sex, category, score and critical terms all check out.' });
  return out;
}

/* ══════ 4 · FOLLOW-UPS — today's rows from the spine's FU, older ones from the register ══════ */

ACT['read.next'] = d => { const q = queue(false).filter(s => s.state !== 'in_acquisition'), all = q.length ? q : queue(true); if (!all.length) return; const i = all.findIndex(s => s.acc === R.sel); const n = all[((i < 0 ? -1 : i) + (+d || 1) + all.length) % all.length]; ACT['read.open'](n.acc); };

ACT['read.asp'] = r => { const a = R.asp[R.sel] || (R.asp[R.sel] = []); const i = a.indexOf(r); if (i >= 0) a.splice(i, 1); else a.push(r); };

/* the critical picker raises the call in the spine at once; yellow travels by the report itself */

      ${R.pinErr && R.pinErr !== 'cosign_required' ? refuse(R.pinErr, R.pinErr === 'second_factor_invalid' ? 'That code is not valid. Three wrong codes lock signing for 15 minutes.' : 'Enter all six digits.') : ''}

  const r = signReport(s.acc, R.as); if (r) { R.pinErr = r.code; signModal(s); return; }
  S.modal = null; R.ver[s.acc] = 1;
  const x = txtOf(s);
  if (/(follow|repeat|FNA|biopsy|PET|months|weeks)/i.test(x.rec || '') && !FU.some(f => f.acc === s.acc)) { const f = addFollowup(s.acc, x.rec, /week/i.test(x.rec) ? 'in ' + (x.rec.match(/\d+\s*weeks?/i) || ['6 weeks'])[0] : /month/i.test(x.rec) ? 'in ' + (x.rec.match(/\d+(–\d+)?\s*months?/i) || ['6 months'])[0] : 'within 7 days'); toast(`Follow-up ${f.id} opened from the recommendation.`); }

ACT['read.print'] = () => {

ACT['read.goCrit'] = id => { if (!id) return false; R.crit = id; R.rb = ''; R.rbErr = null; S.view.read = 'critical'; };
INP['read.txt'] = (v, el) => { const s = study(R.sel); if (s) txtOf(s)[el.dataset.f] = v; };

ACT['read.critOpen'] = id => { R.crit = id; R.rb = ''; R.rbErr = null; S.listOpen = false; };

    else if (v === 'followups') R.fuSel = null;
  },
});
})();

      return `<tr class="${flag ? 'warn' : ''}"><td><b>${esc(p.n)}</b><div class="dim" style="font-size:11px">${esc(p.badge)}</div></td>${t.r.map(v => `<td class="r mo" style="${v != null && v >= QLIM ? 'color:var(--gold-ink);font-weight:600' : ''}">${v == null ? '<span class="dim">awaited</span>' : v.toFixed(2)}</td>`).join('')}<td style="min-width:130px"><div class="bar" title="${y.toFixed(2)} of 20 mSv"><i class="${y > 6 ? 'gd' : ''}" style="width:${Math.min(100, y / max * 100)}%"></i></div><div class="mo dim" style="font-size:10.5px;margin-top:3px">${y.toFixed(2)} / 20 mSv</div></td></tr>`; });
    return chead('TLD badges', 'Personal dose Hp(10), mSv, read by the TLD service each quarter. Annual limit 20 mSv averaged over 5 years, never more than 30 in one year.', `<button class="sec sm" data-act="rso.csv">Import the lab’s CSV</button>`) +
      built('part', 'Badges tab over <span class="mo">aerb_tld_badges</span> / <span class="mo">aerb_tld_reads</span>; reads are typed one by one; CSV import is new here. DECIDED · 28 Sep: a BARC-accredited personnel-monitoring service, badges changed quarterly; investigation level 1 mSv a month of wear (3 mSv a quarter).') +
      `<div class="grid4">${tile('Badges issued', TLD.length)}${tile('Q3 badges not back', BADGE_OUT.length, 'lab cut-off 10 Oct', 'gd')}${tile('Over investigation level', TLD.filter(t => t.r.some(v => v != null && v >= QLIM)).length, '≥ 3 mSv in a quarter', 'gd')}${tile('Over annual limit', 0, '20 mSv', 'ok')}</div>` +
      card('Reads by quarter (mSv)', table(['Worker', ...QS.map(q => '>' + q), 'Rolling 12 months'], rows), `<span class="dim" style="font-size:11.5px">Investigation level 1 mSv a month (3 mSv a quarter) · DECIDED 28 Sep</span>`) +
      (R.inv ? card('Investigation · Ravi Tudu · Q2 2026 · 3.40 mSv', `<div class="card-b" style="display:grid;gap:8px;font-size:12.5px">
        ${ck('ok', 'Workload checked', '42 cath-lab cases in the quarter (Q1: 27) — cardiology added a second list day')}
        ${ck('ok', 'Badge position checked', 'Worn under the lead apron at chest, as required')}
        ${ck('wt', 'Shielding', 'Ceiling-suspended screen not used in 60% of cases (cardiology’s own log)')}
        ${ck('wt', 'Written explanation from the worker', 'Asked 28 Sep · due in 7 days')}
        <div class="draft">Finding (draft): dose rise explained by workload and an unused ceiling screen, not a device fault. Actions: screen use on the cath-lab checklist; rotate Ravi off alternate cath-lab days this quarter.</div></div>`, pill('Open', 'gd sm')) : '') +
      dock('Ravi Tudu crossed the investigation level', 'An investigation needs a written finding before the next quarter’s read.', `<button class="pri" data-act="rso.inv">${R.inv ? 'Close with finding' : 'Open the investigation'}</button>`);
  }
  function tldRight() {
    return plist('Needs you', [
      ...TLD.filter(t => t.r.some(v => v != null && v >= QLIM)).map(t => ({ arg: t.id, no: '', nm: esc(person(t.id).n), ln: '<span class="src gd">INVESTIGATE</span> 3.40 mSv in Q2', wt: '' })),
      ...BADGE_OUT.map(b => ({ arg: b.id, no: '', nm: esc(person(b.id).n), ln: esc(b.what), wt: '12 d', wc: 'gd' })),
    ], 'rso.nop') + clocks('rso-tld', [{ d: 'rd', w: 'Q3 badges back to the lab', y: '2 not returned', t: '12 d' }, { d: '', w: 'Q3 reads expected', y: 'TLD service', t: '~22 d' }, { d: '', w: 'Q4 badges issued', y: 'from 01 Oct', t: '3 d' }]);
  }

  /* ═════════ 4 · QA tests ═════════ */
  function qaLane() {
    if (!R.qa) return laneEmpty('No machine in hand', 'Open a machine to see its QA book and enter a result.', kv('Failed', Object.keys(QA).filter(d => devQa(d) === 'fail').length) + kv('Overdue', Object.keys(QA).filter(d => devQa(d) === 'over').length) + kv('Due ≤ 30 d', Object.keys(QA).filter(d => devQa(d) === 'due').length));
    const d = DEV[R.qa];
    return `<div class="lane-pad"><div class="row"><span class="tag grow">In hand</span><button class="lnk" data-act="drop">Esc · clear</button></div><div class="pname" style="margin-top:6px">${esc(R.qa)}</div><div class="pmeta">${esc(d.n)} · ${esc(d.room)}</div>
      <div class="alert ${d.up === 'qa_blocked' ? '' : devQa(R.qa) === 'ok' ? 'ok' : 'gd'}">${d.up === 'qa_blocked' ? '✕ <span>qa_blocked — the machine refuses new studies until a passing retest.</span>' : '• <span>QA ' + ({ ok: 'in date', due: 'due within 30 days', over: 'overdue', fail: 'failed' }[devQa(R.qa)]) + '</span>'}</div>
      <div class="sect"><span class="tag">Book</span>${(QA[R.qa] || []).map(t => kv(esc(t.t), qaState(t) === 'ok' ? '✓' : qaState(t))).join('')}</div>
      <div class="sect"><span class="tag">Who tests</span><p class="lane-p">AERB-recognised QA agency: acceptance, every 2 years, after any major repair (DECIDED 28 Sep). Monthly and quarterly checks: the RSO with the QA kit.</p></div></div>`;
  }
  function qaCentre() {
    const head = chead('QA tests', 'Acceptance, then periodic tests per machine. A failed test takes the machine out of service until a retest passes.') +
      built('part', 'QA tab over <span class="mo">aerb_qa_records</span> and device status <span class="mo">qa_blocked</span>. New here: tolerances per test, pass/fail computed from the measured value, due clocks.');
    if (!R.qa) {
      const rows = Object.keys(QA).map(d => { const ts = QA[d], next = ts.map(t => t.due).sort((a, b) => dt(a) - dt(b))[0]; return `<tr class="click ${devQa(d) === 'fail' || devQa(d) === 'over' ? 'hot' : devQa(d) === 'due' ? 'warn' : ''}" data-act="rso.qa" data-arg="${d}"><td>${mod(DEV[d].mod)} <b>${esc(d)}</b></td><td>${esc(DEV[d].n)}</td><td class="r mo">${ts.length}</td><td class="mo">${esc(next)}</td><td>${DEV[d].up === 'qa_blocked' ? pill('qa_blocked', 'rd sm') : QA_PILL[devQa(d)]}</td></tr>`; });
      return head + card('Machines', table(['Machine', 'Model', '>Tests', 'Next due', 'State'], rows));
    }
    const ts = QA[R.qa], cur = R.qaTest != null ? ts[R.qaTest] : null;
    const rows = ts.map((t, i) => `<tr class="click ${i === R.qaTest ? 'sel' : qaState(t) === 'fail' || qaState(t) === 'over' ? 'hot' : qaState(t) === 'due' ? 'warn' : ''}" data-act="rso.qat" data-arg="${i}"><td><b>${esc(t.t)}</b>${t.note ? `<div class="dim" style="font-size:11px">${esc(t.note)}</div>` : ''}</td><td class="mo">${t.tol[1] >= 99 ? '≥ ' + t.tol[0] : t.tol[0] === 0 ? '≤ ' + t.tol[1] : t.tol[0] + ' to ' + t.tol[1]} ${esc(t.unit)}</td><td class="r mo">${t.val}</td><td class="mo">${esc(t.last)}</td><td class="mo">${esc(t.due)}</td><td>${QA_PILL[qaState(t)]}</td></tr>`);
    const form = cur ? card('Enter a result · ' + esc(cur.t), `<div class="card-b" style="display:grid;gap:10px"><div class="formgrid">
        <label for="rso-qv">Measured (${esc(cur.unit)})<input class="in sm mo" id="rso-qv" data-in="rso.qv" value="${esc(R.qv == null ? '' : R.qv)}" placeholder="${cur.val}"></label>
        <label for="rso-qk">Instrument<select class="in sm" id="rso-qk"><option>Multimeter RaySafe X2 · cal. to 12 Mar 2027</option><option>CT dose phantom + pencil chamber</option><option>PMMA slabs + mammo phantom</option></select></label>
        <label for="rso-qd">Tested on<input class="in sm" id="rso-qd" value="28 Sep 2026"></label></div>
        ${R.qv != null && R.qv !== '' && !isNaN(+R.qv) ? ((+R.qv < cur.tol[0] || +R.qv > cur.tol[1]) ? refuse('qa_failed', `${esc(R.qv)} ${esc(cur.unit)} is outside tolerance. Saving sets ${esc(R.qa)} to <b>qa_blocked</b>: the room refuses new studies and the front desk moves booked patients.`) : `<div class="okline">Within tolerance. Saving moves the next due date on by the test’s interval (${esc(cur.every)}).</div>`) : ''}
      </div>`) : '';
    return head + back('rso.qaAll', 'All machines') + chead(esc(R.qa) + ' · ' + esc(DEV[R.qa].n), esc(DEV[R.qa].room)) + card('QA book', table(['Test', 'Tolerance', '>Last value', 'Last done', 'Next due', 'State'], rows)) + form +
      (cur ? dock('Save the result for ' + esc(cur.t), 'Saved under your name with the instrument and its calibration date.', `<button class="pri" data-act="rso.qsave">Save result</button>`) : dock('Pick a test to enter a result', 'Overdue and failing tests come first in the list.', ''));
  }
  function qaRight() {
    const rows = Object.keys(QA).flatMap(d => QA[d].map((t, i) => ({ d, i, t }))).filter(x => qaState(x.t) !== 'ok').sort((a, b) => dt(a.t.due) - dt(b.t.due))
      .map(x => ({ arg: x.d + '|' + x.i, no: x.d, nm: esc(x.t.t), ln: QA_PILL[qaState(x.t)] + ' ' + esc(x.t.due), wt: days(x.t.due) < 0 ? -days(x.t.due) + ' d late' : days(x.t.due) + ' d', wc: days(x.t.due) < 0 ? 'rd' : 'gd', sel: R.qa === x.d && R.qaTest === x.i }));
    if (R.qa) return plmin(rows.length + ' tests need you') + copilot({ sub: 'QA book · drafts, you record', secs: [{ tag: 'Checked', items: [
      { k: devQa(R.qa) === 'ok' ? 'ok' : 'warn', h: `QA state <b>${devQa(R.qa)}</b>` },
      { k: 'ok', h: 'Instrument calibration in date (RaySafe X2 to 12 Mar 2027)' },
      ...(R.qa === 'IR-1' ? [{ k: 'warn', h: 'Shielding re-survey <b>1.6 µSv/h</b> in the control room is above 1. AERB issued the licence short (to 06 Dec) for exactly this.' }] : []),
      ...(R.qa === 'XR-2' ? [{ k: 'no', h: 'Yearly QA <b>118 days overdue</b>. XR-2 is carrying XR-1’s work while XR-1’s licence is lapsed — failing this would close both X-ray rooms.' }] : []),
    ] }], ask: 'Ask about this machine’s QA' });
    return plist('Tests due or failing', rows, 'rso.qat2') + clocks('rso-qa', rows.slice(0, 4).map(r => ({ d: r.wc === 'rd' ? 'rd' : '', w: r.no + ' · ' + r.nm, y: '', t: r.wt })));
  }

  /* ═════════ 5 · patient dose ═════════ */
  function hist(d) {
    const vals = sample(d), W = 360, H = 130, pl = 30, pb = 22, maxX = Math.max(d.dlp * 1.35, Math.max(...vals)), bins = 16, bw = maxX / bins, cnt = Array(bins).fill(0);
    vals.forEach(v => cnt[Math.min(bins - 1, Math.floor(v / bw))]++);
    const my = Math.max(...cnt), x = v => pl + v / maxX * (W - pl - 8), y = c => H - pb - c / my * (H - pb - 10);
    const bars = cnt.map((c, i) => c ? `<rect x="${x(i * bw) + 1}" y="${y(c)}" width="${Math.max(1, x(bw) - x(0) - 2)}" height="${H - pb - y(c)}" rx="2" fill="${(i + 1) * bw > d.dlp ? 'var(--gold)' : 'var(--green)'}"><title>${Math.round(i * bw)}–${Math.round((i + 1) * bw)} mGy·cm: ${c} studies</title></rect>` : '').join('');
    const med = vals.slice().sort((a, b) => a - b)[32], over = vals.filter(v => v > d.dlp).length;
    const ticks = [0, .25, .5, .75, 1].map(f => Math.round(maxX * f / 100) * 100).map(v => `<line x1="${x(v)}" x2="${x(v)}" y1="${H - pb}" y2="${H - pb + 4}" stroke="var(--line)"/><text x="${x(v)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--dim)" font-family="IBM Plex Mono, monospace">${v}</text>`).join('');
    return `<div class="box" style="padding:12px 14px"><div class="row"><b style="font-size:12.5px" class="grow">${esc(d.n)}</b><span class="mo dim" style="font-size:11px">DRL ${d.dlp} mGy·cm · CTDIvol ${d.ctdi} mGy</span></div>
      ${svg(W, H, `<line x1="${pl}" x2="${W - 8}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>${bars}<line x1="${x(d.dlp)}" x2="${x(d.dlp)}" y1="6" y2="${H - pb}" stroke="var(--red)" stroke-dasharray="3 3"/><text x="${x(d.dlp) - 4}" y="14" text-anchor="end" font-size="10" fill="var(--red)" font-family="IBM Plex Mono, monospace">DRL</text><line x1="${x(med)}" x2="${x(med)}" y1="10" y2="${H - pb}" stroke="var(--ink)" stroke-width="1.5"/><text x="${x(med) + 4}" y="22" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono, monospace">median ${med}</text>${ticks}<text x="${pl}" y="10" font-size="9.5" fill="var(--dim)" font-family="IBM Plex Mono, monospace">studies</text>`, 'DLP distribution for ' + d.n)}
      <div class="row" style="font-size:11.5px;color:var(--dim)"><span>64 studies · 30 days · DLP mGy·cm</span><span class="grow"></span><span>${over ? `<b style="color:var(--gold-ink)">${over}</b> above DRL` : 'none above DRL'}</span></div></div>`;
  }
  function doseCentre() {
    const q = (R.doseQ || '').trim().toLowerCase(), key = Object.keys(DOSEHIST).find(k => q && k.toLowerCase().startsWith(q));
    const hx = key ? DOSEHIST[key] : null, tot = hx ? hx.reduce((s, h) => s + (h.dlp ? h.dlp * h.k : h.eff || 0), 0) : 0;
    return chead('Patient dose', 'Every ionising study writes its dose to the register at acquisition. The DRL is a nudge for the technologist, then an audit here — never a block.') +
      built('part', '<span class="mo">radiation_dose_register</span> with DRL comparison (<span class="mo">drlFor</span>) and the Dose tab exist. New here: distributions against the DRL, breach reasons, cumulative lookup. Dose SR from the scanner is 18b-ii, not built — CT doses are typed from the console.') +
      `<div class="grid3">${DRL.map(hist).join('')}</div>` +
      card('Today’s register · written at acquisition', (() => { const rows = STUDY.filter(x => x.dose && Object.keys(x.dose).length).sort((a, b) => (b.done || 0) - (a.done || 0)); const lim = { 'CT-HEAD-PLAIN': 1000, 'CT-CHEST-PLAIN': 550, 'CT-ABDO-CONTRAST': 900, 'CT-TRAUMA': 2000 };
        return rows.length ? table(['Time', 'Patient', 'Study', 'Room', '>CTDIvol', '>DLP / DAP', 'Against DRL'], rows.map(x => { const l = lim[x.st], over = l && x.dose.dlp > l; return `<tr class="${over ? 'warn' : ''}" data-acc="${esc(x.acc)}"><td class="mo">${x.done ? hm(x.done) : '—'}</td><td>${esc(PT[x.pt].n)}<div class="dim mo" style="font-size:10.5px">${esc(x.acc)}</div></td><td>${esc(x.n)}</td><td class="mo">${esc(x.dev || '—')}</td><td class="r mo">${x.dose.ctdi != null ? x.dose.ctdi + ' mGy' : '—'}</td><td class="r mo">${x.dose.dlp != null ? x.dose.dlp + ' mGy·cm' : x.dose.dap != null ? x.dose.dap + ' Gy·cm²' : '—'}</td><td>${l ? (over ? pill('Above · reason owed', 'gd sm') : pill('Within', 'on sm')) : '<span class="dim">no DRL set</span>'}</td></tr>`; })) : '<div class="empty">No ionising study acquired yet today.</div>'; })()) +
      `<div class="warnline">DRL values here are the hospital’s book (<span class="mo">dose_reference_levels</span> v1), set from AERB’s national diagnostic reference levels. Changing the book is a governed definition publish, not an edit.</div>` +
      card('Above the DRL · last 14 days', table(['Accession', 'Study', 'Patient', '>DLP', 'Reason given', ''], BREACH.map(b => `<tr class="${b.ok ? '' : 'hot'}"><td class="mo">${esc(b.acc)}</td><td>${esc(b.n)}</td><td>${esc(b.pt)}</td><td class="r mo">${b.dlp}</td><td>${esc(b.why)}<div class="dim" style="font-size:11px">${esc(b.by)}</div></td><td>${b.ok ? pill('Reviewed', 'on sm') : `<button class="sec sm" data-act="rso.askwhy">Ask the tech</button>`}</td></tr>`))) +
      card('Cumulative dose for a patient', `<div class="card-b" style="display:grid;gap:10px"><label class="fl" for="rso-dq">Name or UHID<input class="in sm" id="rso-dq" data-in="rso.dq" value="${esc(R.doseQ)}" placeholder="Bablu, Gopal…"></label>
        ${hx ? table(['When', 'Study', '>DLP / DAP', '>Effective dose (est.)'], hx.map(h => `<tr><td class="mo">${esc(h.when)}</td><td>${esc(h.what)}<div class="dim mo" style="font-size:10.5px">${esc(h.acc)}</div></td><td class="r mo">${h.dlp ? h.dlp + ' mGy·cm' : (h.dap ? h.dap + ' Gy·cm²' : '—')}</td><td class="r mo">${(h.dlp ? h.dlp * h.k : h.eff).toFixed(1)} mSv</td></tr>`)) +
          `<div class="row"><span class="grow" style="font-size:12.5px">Total in the register: <b class="mo">${tot.toFixed(1)} mSv</b> <span class="dim">— an estimate (DLP × region factor). It informs the next order; it never refuses one.</span></span></div>` : '<div class="dim" style="font-size:12px">Type a name. Try “Bablu” (trauma today) or “Gopal” (ICU, daily films).</div>'}</div>`);
  }

  /* ═════════ 6 · incidents ═════════ */
  function incCentre() {
    const i = R.inc && INC.find(x => x.id === R.inc);
    const head = chead('Radiation incidents', 'Unintended exposure of a patient or a worker: what happened, who was told, what changed.', `<button class="sec sm grn" data-act="rso.incNew">Record an incident</button>`) +
      built('none', 'No incident register in the code. The contrast-reaction register (18a-iii T2) is the nearest shape: a record that writes a consequence in the same transaction.');
    if (R.incNew) {
      const d = R.incDraft;
      return head + card('New incident', `<div class="card-b" style="display:grid;gap:10px">
        <div class="row">${Object.keys(INC_KIND).map(k => `<button class="chk" aria-pressed="${d.kind === k}" data-act="rso.incKind" data-arg="${k}">${esc(INC_KIND[k])}</button>`).join('')}</div>
        <div class="formgrid"><label for="rso-iw">Patient or worker<input class="in sm" id="rso-iw" data-in="rso.id" data-k="who" value="${esc(d.who)}" placeholder="name · UHID or badge"></label><label for="rso-ir">Room<select class="in sm" id="rso-ir">${Object.keys(DEV).filter(k => DEV[k].aerb !== 'na').map(k => `<option>${k}</option>`).join('')}</select></label></div>
        <label class="fl" for="rso-iwh">What happened<textarea class="in" id="rso-iwh" rows="3" data-in="rso.id" data-k="what" placeholder="Facts only: time, study, exposure, who noticed.">${esc(d.what)}</textarea></label>
        ${d.kind === 'pregnant' ? '<div class="warnline">A pregnant patient exposed: the QA agency’s physicist estimates foetal dose; the obstetrician counsels the patient within 24 h; the RSO notifies AERB.</div>' : ''}
        ${R.err ? refuse(R.err[0], R.err[1]) : ''}</div>`) + dock('Record and start the clocks', 'Notify AERB · counsel the patient · root cause in 7 days', `<button class="sec" data-act="rso.incCancel">Cancel</button><button class="pri" data-act="rso.incSave">Record incident</button>`);
    }
    if (i) {
      return head + back('rso.drop', 'All incidents') + chead(esc(i.id) + ' · ' + esc(i.title), esc(i.when) + ' · ' + esc(i.room) + ' · ' + esc(i.pt)) +
        `<div class="grid3">${tile('Exposure', `<span style="font-size:14px;font-family:var(--sans)">${esc(i.dose)}</span>`)}${tile('AERB', `<span style="font-size:13px;font-family:var(--sans)">${esc(i.aerb)}</span>`)}${tile('State', i.state === 'closed' ? pill('Closed', 'on') : i.state === 'reported' ? pill('Reported · actions open', 'gd') : pill('Open', 'rd'))}</div>` +
        card('Root cause', `<div class="card-b" style="font-size:12.5px">${esc(i.rc)}</div>`) +
        card('Actions', i.acts.map((a, k) => ck(i.state === 'closed' || k === 0 ? 'ok' : 'wt', esc(a))).join(''), `<span class="dim" style="font-size:11.5px">owner: ${esc(i.owner)}</span>`) +
        (i.state !== 'closed' ? dock('Close ' + esc(i.id), 'Closing needs every action done and the HOD’s co-sign.', `<button class="pri" data-act="rso.incClose" data-arg="${i.id}">Close incident</button>`) : '');
    }
    return head + card('Register · 2026', table(['Id', 'What', 'Room', 'When', 'State'], INC.map(x => `<tr class="click ${x.state === 'open' ? 'hot' : ''}" data-act="rso.inc" data-arg="${x.id}"><td class="mo">${esc(x.id)}</td><td><b>${esc(x.title)}</b><div class="dim" style="font-size:11px">${esc(INC_KIND[x.kind])} · ${esc(x.pt)}</div></td><td>${esc(x.room)}</td><td class="mo">${esc(x.when)}</td><td>${x.state === 'closed' ? pill('Closed', 'on sm') : x.state === 'reported' ? pill('Actions open', 'gd sm') : pill('Open', 'rd sm')}</td></tr>`)));
  }
  function incRight() {
    return plist('Incidents · open first', INC.slice().sort((a, b) => ({ open: 0, reported: 1, closed: 2 }[a.state] - { open: 0, reported: 1, closed: 2 }[b.state])).map(x => ({ arg: x.id, no: x.id.slice(-3), nm: esc(x.title), ln: esc(x.room) + ' · ' + esc(x.when.slice(0, 6)), wt: x.state === 'open' ? 'open' : '', wc: x.state === 'open' ? 'rd' : '', sel: x.id === R.inc, dim: x.state === 'closed' })), 'rso.inc') +
      clocks('rso-inc', [{ d: 'rd', w: 'INC-26-008 root cause', y: 'due 7 days after the event', t: '5 d' }, { d: '', w: 'INC-26-007 follow-up scan', y: 'Rumi Mardi at 12 weeks', t: '19 d' }]);
  }

  /* ═════════ register ═════════ */
  station({
    id: 'rso', name: 'Radiation safety', person: { n: STAFF.bikash.n, i: STAFF.bikash.i, role: 'Radiological Safety Officer · level II' },
    navs: [
      { id: 'licences', label: 'Licences', n: gaps().length, red: true, b: 'have', why: 'Licences tab + gaps endpoint; renewal clocks new' },
      { id: 'people', label: 'People', b: 'part', why: 'aerb_persons; pregnancy reassignment not built' },
      { id: 'tld', label: 'TLD badges', n: 2, b: 'part', why: 'badge reads typed by hand; no CSV import' },
      { id: 'qa', label: 'QA tests', b: 'part', why: 'aerb_qa_records; tolerances and due clocks new' },
      { id: 'patientdose', label: 'Patient dose', b: 'part', why: 'dose register + DRL nudge; audit view new' },
      { id: 'incidents', label: 'Incidents', n: 1, red: true, b: 'none', why: 'no incident register' },

      card('Decided · 28 Sep · the standard of India’s leading hospitals', `<div class="card-b" style="display:grid;gap:8px;font-size:12.5px">

        ${ck('ok', 'GST on imaging', 'Exempt: diagnostic imaging by a clinical establishment is a healthcare service (SAC 9993, Notification 12/2017-CT(Rate), entry 74). Films and CDs supplied with the study are part of the same exempt supply. The CA confirms the 6-digit SAC at the first filing.')}
        ${ck('ok', 'Contrast', 'Included in the CECT and contrast-MRI price; not billed as a separate line. Premedication drugs are included.')}
        ${ck('ok', 'Teleradiology', 'A contracted Indian provider, radiologists registered in India, data kept in India, a data-processing agreement under the DPDP Act; priced per study, over-read by a consultant the next morning.')}
        ${ck('ok', 'Discount and credit', 'No counter discount; the HOD up to 10% with a reason. Credit is the owner’s alone, hospital-wide (ruled 28 Sep).')}
        ${ck('wt', 'Real prices for every RAD- service', 'The rates above are the standard; the tariff rows are entered once in Setup → Prices and activated as a version.')}</div>`);
  }

  /* ═════════ 8 · access log & audit trail ═════════ */
  const EV_N = { 'order.placed': 'Order placed', 'study.scheduled': 'Booked', 'study.checked_in': 'Checked in', 'study.ready': 'Ready for the room', 'acquisition.started': 'Scan started', 'study.acquired': 'Images in', 'report.signed': 'Report signed', 'report.published': 'Report released', 'critical.flagged': 'Critical flagged', 'critical.acknowledged': 'Critical read back', 'report.acted_upon': 'Doctor acted upon', 'followup.recommended': 'Follow-up recommended', 'approval.asked': 'Approval asked', 'approval.approved': 'Approved', 'approval.declined': 'Declined', 'aerb.licence_filed': 'AERB licence filed', 'hold.released': 'Hold released', 'images.viewed': 'Images opened', 'bill.resolved': 'Bill decision', 'gate.satisfied': 'Gate satisfied', 'gate.waived': 'Gate waived', 'gate.overridden': 'Gate overridden' };
  const evName = e => EV_N[e] || (e.startsWith('device.') ? 'Machine ' + e.slice(7).replace('_', ' ') : e.startsWith('bill.') ? 'Bill decision raised' : e);
  function auditCentre() {
    const al = ALOG.map((a, i) => Object.assign({ i }, a)).sort((a, b) => b.t - a.t);
    const bg = al.filter(a => a.bg), pq = (H.dpdp || '').trim().toLowerCase();
    const pid = pq && Object.keys(PT).find(k => PT[k].n.toLowerCase().includes(pq) || PT[k].uhid.toLowerCase() === pq);
    const mine = pid ? al.filter(a => { const sx = study(a.acc); return sx && sx.pt === pid; }) : [];
    const ptOf = a => { const sx = study(a.acc); return sx ? ptn(sx) : '—'; };
    return chead('Access log', 'Every opening of a patient’s images or report, and every act on a study, newest first. Who, in what role, and why.', `<button class="sec sm" data-act="hod.export">Export for the NABH audit</button>`) +
      built('part', '<span class="mo">POST …/images/open</span> writes an <span class="mo">imaging_image_views</span> row and the kernel’s PHI-access audit records reads. No screen reads either; the patient’s “who saw my scans” request and break-glass review are new here.') +
      `<div class="grid4">${tile('Openings today', al.length, 'images and reports')}${tile('Break-glass', bg.length, bg.length ? 'needs your review' : 'none today', bg.length ? 'rd' : 'ok')}${tile('Acts recorded', LOG.length, 'orders, gates, scans, signatures')}${tile('Patient requests open', H.dpdpSent ? 0 : 1, 'DPDP · answer in 7 days', H.dpdpSent ? 'ok' : 'gd')}</div>` +
      (bg.length ? card('Break-glass openings · review each', bg.map(a => `<div class="nrow" data-alog="${a.i}" style="flex-wrap:wrap"><div class="grow" style="min-width:220px"><div class="w">${esc(a.who)} <span class="dim">· ${esc(a.role)}</span></div><div class="y">${hm(a.t)} · opened ${esc(ptOf(a))}’s ${esc(a.what)} (${esc(a.acc)}) · ${esc(a.reason)}</div></div>${H.bgDone && H.bgDone[a.i] ? pill(esc(H.bgDone[a.i]), H.bgDone[a.i].startsWith('Justified') ? 'on sm' : 'rd sm') : `<button class="sec sm" data-act="hod.bgOk" data-arg="${a.i}">Justified</button><button class="sec sm rd" data-act="hod.bgNo" data-arg="${a.i}">Not justified · to HR</button>`}</div>`).join('')) : '') +
      card('Who opened what', table(['Time', 'Who', 'Role', 'Patient', 'Opened', 'Why'], al.map(a => `<tr data-alog="${a.i}" class="${a.bg ? 'hot' : ''}"><td class="mo">${hm(a.t)}</td><td>${esc(a.who)}</td><td class="dim">${esc(a.role)}</td><td>${esc(ptOf(a))}<div class="dim mo" style="font-size:10.5px">${esc(a.acc || '')}</div></td><td>${esc(a.what)}</td><td>${a.bg ? '<b style="color:var(--red)">break-glass</b> · ' : ''}${esc(a.reason)}</td></tr>`))) +
      card('A patient asks: who saw my scans?', `<div class="card-b" style="display:grid;gap:10px"><p class="dim" style="margin:0;font-size:12px">DPDP Act 2023: a patient may ask who processed their data. Hospital policy (DECIDED 28 Sep): answer within 7 days, from this log, sent to the patient’s registered mobile behind an OTP.</p>
        <label class="fl" for="hod-dpdp">Patient name or UHID<input class="in sm" id="hod-dpdp" data-in="hod.dpdp" value="${esc(H.dpdp || '')}" placeholder="Farida Khatoon asked on 27 Sep"></label>
        ${pid ? (mine.length ? table(['Time', 'Who', 'Role', 'Opened', 'Why'], mine.map(a => `<tr data-alog="${a.i}"><td class="mo">${hm(a.t)}</td><td>${esc(a.who)}</td><td>${esc(a.role)}</td><td>${esc(a.what)}</td><td>${a.bg ? '<b style="color:var(--red)">break-glass</b> · ' : ''}${esc(a.reason)}</td></tr>`)) : '<div class="empty">No opening of this patient’s images or reports today.</div>') : ''}</div>`) +
      card('Audit trail · every act', table(['Time', 'Act', 'Study', 'By', 'Detail'], LOG.slice().sort((a, b) => b.t - a.t).slice(0, 40).map(l => `<tr ${l.acc ? `data-acc="${esc(l.acc)}"` : ''}><td class="mo">${hm(l.t)}</td><td>${esc(evName(l.ev))}</td><td class="mo" style="font-size:11px">${esc(l.acc || '—')}</td><td>${esc(l.by)}</td><td class="dim">${esc(l.note)}</td></tr>`)), `<span class="dim" style="font-size:11.5px">latest 40 · append-only</span>`) +
      (pid && mine.length && !H.dpdpSent ? dock(`Send ${esc(PT[pid].n)} the list`, `${mine.length} opening${mine.length > 1 ? 's' : ''} · to ${esc(PT[pid].phone)} behind an OTP`, `<button class="pri" data-act="hod.dpdpSend">Send the list</button>`) : '');
  }
  function auditRight() {
    const bg = ALOG.map((a, i) => Object.assign({ i }, a)).filter(a => a.bg && !(H.bgDone && H.bgDone[a.i]));
    return plist('Needs a look', [
      ...bg.map(a => ({ arg: String(a.i), no: hm(a.t), nm: esc(a.who), ln: '<span class="src em">BREAK-GLASS</span> ' + esc(a.role), wt: '', wc: 'rd' })),
      ...(H.dpdpSent ? [] : [{ arg: 'dpdp', no: '27 Sep', nm: 'Farida Khatoon', ln: '<span class="src gd">DPDP</span> who saw my scans?', wt: '6 d left', wc: 'gd' }]),
    ], 'hod.audFocus', 'Nothing to review.') + clocks('hod-aud', [{ d: 'gd', w: 'Answer Farida Khatoon’s request', y: 'DPDP · hospital policy 7 days', t: '6 d' }, { d: '', w: 'Monthly access review', y: 'random 20 openings checked against a care relationship', t: '3 d' }]);
  }

  /* ═════════ register ═════════ */
  station({
    id: 'hod', name: 'Supervisor & HOD', person: { n: RAD.sahay.n, i: RAD.sahay.i, role: 'Head of radiology' },
    navs: [
      { id: 'floor', label: 'Floor', b: 'none', why: 'no supervisor view; worklist + diary only' },
      { id: 'escalations', label: 'Escalated', get n() { return escList().length; }, red: true, b: 'part', why: 'two chasers exist; other clocks not built' },
      { id: 'approvals', label: 'Approvals', get n() { return apOpen().length + billOpen().length; }, b: 'part', why: 'gate override + bill decisions API; no screen' },
      { id: 'quality', label: 'Quality', b: 'none', why: 'KPIs out of scope in 18a-iii' },
      { id: 'equipment', label: 'Equipment', b: 'none', why: 'no resources screen' },
      { id: 'roster', label: 'Roster', b: 'part', why: 'roster backbone merged, no radiology use' },
      { id: 'money', label: 'Money', b: 'part', why: 'tariff + authorisationOf; no view' },
      { id: 'audit', label: 'Access log', b: 'part', why: 'imaging_image_views + PHI audit exist; no screen' },
    ],
    layout: v => v === 'escalations' ? 'three' : ['approvals', 'equipment', 'roster', 'audit'].includes(v) ? 'two' : 'one',
    lane: v => v === 'escalations' ? escLane() : '',
    centre: v => ({ floor: floorCentre, escalations: escCentre, approvals: apprCentre, quality: qualityCentre, equipment: eqCentre, roster: rosterCentre, money: moneyCentre, audit: auditCentre }[v] || floorCentre)(),
    right: v => ({ escalations: escRight, approvals: apprRight, equipment: eqRight, roster: rosterRight, audit: auditRight }[v] || (() => ''))(),
    drop: () => { H.esc = null; H.reason = ''; H.err = null; },
  });

  /* ═════════ actions ═════════ */
  ACT['hod.stage'] = k => { const list = byStage(k); S.ans = `<b>${esc((STAGES.find(s => s[0] === k) || [])[1])}</b>: ${list.length ? list.map(s => `${esc(PT[s.pt].n)} — ${esc(s.n)}${s.hold ? ' <span style="color:var(--red)">(held: ' + esc(GATE_N[s.hold] || s.hold) + ')</span>' : ''}`).join('; ') : 'nobody'}.`; };
  ACT['hod.esc'] = id => { H.esc = id; H.reason = ''; H.err = null; S.view.hod = 'escalations'; S.listOpen = false; };
  ACT['hod.escAll'] = () => { H.esc = null; H.err = null; };
  const find = id => escList().find(x => x.id === id);
  const close = (e, how) => { H.acted[e.id] = { what: e.what + ' · ' + e.who, how: how + ' · ' + hm(now()) }; logEv(e.acc, 'escalation.acted', e.what + ' · ' + how); H.esc = null; H.reason = ''; H.err = null; };
  ACT['hod.do'] = id => { const e = find(id); if (!e) return; close(e, 'Opened: ' + e.act[0].toLowerCase()); const [st, v] = e.act[1].split(':'); if (st === 'room' && e.id.startsWith('dev:')) S.room = e.id.slice(4); go(st, v); return false; };
  ACT['hod.page'] = id => { const e = find(id); if (!e) return; close(e, 'Paged ' + e.page); toast('Paged ' + esc(e.page) + '. The clock keeps running on their seat until the act is done.'); };
  ACT['hod.take'] = id => { const e = find(id); if (!e) return; close(e, 'Taken over by Dr. Sahay'); toast('It is in your queue now, under your name.'); };
  INP['hod.reason'] = v => { H.reason = v; };
  ACT['hod.accept'] = id => { const e = find(id); if (!e) return; if (!H.reason.trim() || H.reason.trim().length < 8) { H.err = ['reason_required', 'Write why the delay is acceptable. The reason is kept with your name in the audit.']; return; } close(e, 'Delay accepted: “' + H.reason.trim() + '”'); toast('Accepted with your reason.'); };
  INP['hod.ar'] = (v, el) => { H.apprReason[el.dataset.k] = v; };
  INP['hod.pct'] = v => { H.pct = v; };
  ACT['hod.approve'] = id => {
    const a = APPROVALS.find(x => x.id === id), r = (H.apprReason[id] || '').trim(); if (!a) return;
    if (a.kind === 'credit') { H.err = ['credit_owner_only', 'Credit is the owner’s decision alone, hospital-wide (ruled 28 Sep 2026). It has gone to the owner’s phone; collect now or wait for the owner.', id]; toast('Forwarded to the owner.'); return; }
    if (r.length < 8) { H.err = ['reason_required', 'Every approval carries a reason in a sentence.', id]; return; }
    if (a.kind === 'discount' && +(H.pct || a.pct) > 10) { H.err = ['discount_over_limit', 'The HOD can approve up to 10%. Pick 10% or less, or decline.', id]; return; }
    if (a.kind === 'gate_override' && a.gate === 'renal_function' && !/hydrat|nephro|plain|benefit|iso-?osmolar|half/i.test(r)) { H.err = ['override_reason_thin', 'A kidney-function override names the benefit and the protection (IV hydration, iso-osmolar contrast, nephrology informed). Write it down.', id]; return; }
    if (a.kind === 'discount') a.pct = +(H.pct || a.pct);
    const err = decideApproval(id, true, r);
    if (err) { H.err = [err.code, err.msg, id]; return; }
    H.err = null; const sx = a.acc && study(a.acc);
    toast(esc(AP_T(a)) + ' approved.' + (a.kind === 'gate_override' && sx ? (sx.state === 'ready' ? ` ${esc(ptn(sx))} is ready for ${esc(sx.dev || 'the room')}.` : ` ${esc(ptn(sx))} still has ${openGateKinds(sx).length} gate${openGateKinds(sx).length === 1 ? '' : 's'} open in the prep bay.`) : ''));
  };
  ACT['hod.decline'] = id => { const a = APPROVALS.find(x => x.id === id), r = (H.apprReason[id] || '').trim(); const err = decideApproval(id, false, r); if (err) { H.err = [err.code, err.msg, id]; return; } H.err = null; toast('Declined. ' + esc(a.askedBy || 'The requester') + ' sees your reason at their seat.'); };
  const billDecide = (id, ok) => { const b = BILLQ.find(x => x.id === id), r = (H.apprReason[id] || '').trim(); if (!b) return;
    if (r.length < 8) { H.err = ['reason_required', 'A bill decision carries a reason; the cashier and the audit read it.', id]; return; }
    b.state = 'resolved'; b.by = RAD.sahay.n; b.reason = r; b.decision = ok ? (BILL_OK[b.kind] || 'Resolved') + ' · Dr. Sahay' : 'Declined · “' + r + '”'; H.err = null; logEv(b.acc, 'bill.resolved', b.decision); toast(esc(b.decision) + '.'); };
  ACT['hod.billOk'] = id => billDecide(id, true);
  ACT['hod.billNo'] = id => billDecide(id, false);
  ACT['hod.export'] = () => { toast(`Audit export prepared: ${ALOG.length} openings and ${LOG.length} acts, with who, role, time and reason. In the live build it downloads as CSV.`); return false; };
  INP['hod.dpdp'] = v => { H.dpdp = v; render(); };
  ACT['hod.dpdpSend'] = () => { H.dpdpSent = true; toast('Sent. The patient opens the list after an OTP; the request is closed in the register.'); };
  ACT['hod.bgOk'] = i => { H.bgDone = H.bgDone || {}; H.bgDone[i] = 'Justified · Dr. Sahay'; logEv(ALOG[+i].acc, 'audit.break_glass_reviewed', 'justified'); };

  ACT['hod.audFocus'] = a => { if (a === 'dpdp') { H.dpdp = 'Farida'; } S.listOpen = false; };
  ACT['hod.focus'] = id => { const el = document.getElementById('hod-ar-' + id); if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } S.listOpen = false; };
  ACT['hod.ticket'] = () => { modal('Raise a service ticket', `<div style="display:grid;gap:10px"><label class="fl" for="hod-tm">Machine<select class="in sm" id="hod-tm">${Object.keys(DEV).map(d => `<option>${d} · ${esc(DEV[d].n)}</option>`).join('')}</select></label><label class="fl" for="hod-tf">Fault, as seen<textarea class="in" id="hod-tf" rows="3" placeholder="What the screen showed, when, which study was on"></textarea></label><label class="fl" for="hod-td">Take the machine out of service?<select class="in sm" id="hod-td"><option>No — watch it</option><option>Yes — mark down; the front desk moves booked patients</option></select></label></div>`, `<button class="sec" data-act="closeModal">Cancel</button><button class="pri" data-act="hod.ticketSave">Raise ticket</button>`); };
  ACT['hod.ticketSave'] = () => {
    const m = ($('#hod-tm') || {}).value || '', dev = m.split(' · ')[0], fault = (($('#hod-tf') || {}).value || '').trim(), down = /^Yes/.test(($('#hod-td') || {}).value || '');
    S.modal = null;
    if (down && DEV[dev]) { const mv = setDevice(dev, 'down', fault || 'ticket BME-2609-042'); toast(`Ticket BME-2609-042 raised; ${esc(dev)} marked down. ${mv.length ? mv.length + ' booked patient' + (mv.length > 1 ? 's' : '') + ' for the front desk to move.' : 'Nobody booked on it.'} Arvind Prasad is paged.`); }
    else toast('Ticket BME-2609-042 raised. Arvind Prasad is paged.');
  };
  ACT['hod.up'] = d => { setDevice(d, 'up', 'back in service'); toast(esc(d) + ' is back in service.'); };
  ACT['hod.pageP'] = w => { toast('Paged ' + esc(w) + '.'); return false; };
  ACT['hod.gap'] = i => { H['gap' + i] = true; toast(esc(GAPS[+i].fix) + ' — done. The people moved are told by app.'); };
  ACT['hod.nop'] = () => false;
})();

</script>
