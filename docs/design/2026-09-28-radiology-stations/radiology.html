<title>Radiology Stations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Paper & Pine, as on the owner-approved boards (lab stations v19). One light theme by choice. */
:root {
  --paper:#f4f7f4; --card:#ffffff; --ink:#132420; --line:#dfe7e1; --line2:#ecf1ed; --dim:#5c6f66; --wash:#eef3ef;
  --green:#0e6b4e; --green-soft:rgba(14,107,78,.08); --green-line:rgba(14,107,78,.35);
  --gold:#dd8f1c; --gold-ink:#9a6208; --gold-soft:rgba(221,143,28,.10); --gold-line:rgba(221,143,28,.45);
  --red:#b23a30; --red-soft:rgba(178,58,48,.08); --red-line:rgba(178,58,48,.4);
  --blue:#2d5f8a; --blue-soft:rgba(45,95,138,.08); --blue-line:rgba(45,95,138,.35);
  --agent:#132420; --agent-fg:#d9efe4; --agent-dim:#9dbdae; --mint:#35c48f;
  --film:#0d1311; --film-fg:#cfd8d3;
  --sans:'IBM Plex Sans', 'IBM Plex Sans Devanagari', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; background: var(--paper); }
body { margin: 0; color: var(--ink); font: 13.5px/19px var(--sans); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; text-align: left; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.mo { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tag { font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.kb { display: inline-flex; align-items: center; justify-content: center; height: 16px; min-width: 20px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); background: var(--card); font: 600 10px var(--mono); color: var(--dim); }
.kb.dk { border-color: #2c443a; background: #1c332b; color: var(--agent-dim); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 23px; padding: 0 9px; border-radius: 4px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--dim); white-space: nowrap; }
.pill.on { border-color: var(--green-line); background: var(--green-soft); color: var(--green); }
.pill.gd { border-color: var(--gold-line); background: var(--gold-soft); color: var(--gold-ink); }
.pill.rd { border-color: var(--red-line); background: var(--red-soft); color: var(--red); }
.pill.bl { border-color: var(--blue-line); background: var(--blue-soft); color: var(--blue); }
.pill.ink { border-color: var(--ink); color: var(--ink); }
.pill.sm { height: 20px; padding: 0 7px; font-size: 10px; }
button.pill:hover { border-color: var(--green-line); }
.stamp { display: inline-flex; padding: 2px 10px; border-radius: 4px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; white-space: nowrap; border: 2px solid var(--green); color: var(--green); }
.stamp.gd { border-color: var(--gold); color: var(--gold-ink); }
.stamp.rd { border-color: var(--red); color: var(--red); }
.pri { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 6px; background: var(--green); color: #f2faf6; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pri:hover { background: #0b5a41; }
.pri.sm { height: 28px; padding: 0 12px; font-size: 12px; }
.pri.red { background: var(--red); }
.pri:disabled { background: var(--line); color: var(--dim); cursor: not-allowed; }
.sec { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.sec:hover { border-color: var(--dim); }
.sec.grn { border-color: var(--green); color: var(--green); font-weight: 600; }
.sec.rd { border-color: var(--red-line); color: var(--red); }
.sec.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.lnk { font-size: 12px; color: var(--green); font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.lnk:hover { background: var(--green-soft); }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.in { height: 38px; width: 100%; border-radius: 6px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-size: 13.5px; }
textarea.in { height: auto; padding: 10px 12px; line-height: 19px; resize: vertical; }
.in.sm { height: 32px; font-size: 13px; }
.in:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.grow { flex-grow: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.dim { color: var(--dim); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.src { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .1em; padding: 1px 6px; border-radius: 3px; background: var(--wash); color: var(--dim); flex-shrink: 0; white-space: nowrap; }
.src.em { background: var(--red-soft); color: var(--red); }
.src.ip { background: var(--blue-soft); color: var(--blue); }
.src.rp { background: var(--green-soft); color: var(--green); }
.src.gd { background: var(--gold-soft); color: var(--gold-ink); }
.mod { font: 700 10px var(--mono); letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; color: #fff; background: var(--ink); white-space: nowrap; flex-shrink: 0; }
.mod.CT { background: #2d5f8a; } .mod.MR { background: #5b4a8a; } .mod.US { background: #0e6b4e; } .mod.XR { background: #4f5d57; }
.mod.MG { background: #a0506e; } .mod.DX { background: #7a6a2f; } .mod.FL { background: #8a5a2d; } .mod.IR { background: #b23a30; }

/* ── app shell: header · (lane · centre · right) · ask ── */
.app { height: 100%; display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: 46px minmax(0,1fr) 52px; }
.top { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--card); border-bottom: 1px solid var(--line); min-width: 0; position: relative; z-index: 40; }
.brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.dia { width: 10px; height: 10px; border-radius: 2px; background: var(--green); transform: rotate(45deg); flex-shrink: 0; }
.bn { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.stsel { height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--wash); font-size: 12.5px; font-weight: 600; padding: 0 8px; max-width: 220px; }
.nav { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nv { height: 30px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--dim); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.nv:hover { background: var(--wash); color: var(--ink); }
.nv[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--green); }
.nv .n { font-family: var(--mono); font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--gold-soft); color: var(--gold-ink); }
.nv .n.r { background: var(--red-soft); color: var(--red); }
.nvbtn { display: none; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; flex-shrink: 0; }
.navdrop { position: absolute; top: 44px; left: 12px; z-index: 45; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 28px rgba(19,36,32,.16); padding: 6px; display: grid; min-width: 240px; max-height: 70vh; overflow-y: auto; }
.navdrop .nv { justify-content: space-between; height: 34px; }
.vr { width: 1px; height: 22px; background: var(--line); flex-shrink: 0; }
.who { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: auto; }
.who .nm { font-size: 12px; font-weight: 600; line-height: 14px; white-space: nowrap; }
.who .rl { font-size: 10.5px; color: var(--dim); line-height: 13px; white-space: nowrap; }
.av { width: 26px; height: 26px; border-radius: 50%; background: var(--green-soft); border: 1px solid var(--green-line); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); flex-shrink: 0; }
.listbtn { display: none; }
.body { display: grid; grid-template-columns: 296px minmax(0,1fr) 352px; min-height: 0; position: relative; }
.app.two .body { grid-template-columns: minmax(0,1fr) 352px; }
.app.one .body { grid-template-columns: minmax(0,1fr); }
.app.two .lane, .app.one .lane, .app.one .right { display: none; }
.lane { border-right: 1px solid var(--line); background: var(--card); overflow-y: auto; min-height: 0; }
.centre { min-width: 0; min-height: 0; overflow-y: auto; padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.centre > * { flex-shrink: 0; }
.app.one .centre { padding-inline: max(22px, calc((100% - 1360px) / 2)); }
.right { border-left: 1px solid var(--line); background: var(--paper); overflow-y: auto; min-height: 0; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.right > * { flex-shrink: 0; }
.scrim { display: none; }
@media (max-width: 1279px) {
  .body { grid-template-columns: 272px minmax(0,1fr); overflow: hidden; }
  .app.two .body { grid-template-columns: minmax(0,1fr); }
  .right { position: absolute; top: 0; right: 0; bottom: 0; width: min(352px, 100vw); z-index: 30; transform: translateX(105%); box-shadow: -12px 0 32px rgba(19,36,32,.18); }
  .app.list-open .right { transform: none; }
  .app.list-open .scrim { display: block; position: absolute; inset: 0; z-index: 20; background: rgba(19,36,32,.28); }
  .listbtn { display: inline-flex; }
  .app.one .listbtn { display: none; }
}
@media (max-width: 1099px) { .nav { display: none; } .nvbtn { display: inline-flex; } }
@media (max-width: 899px) {
  .body { display: block; overflow-y: auto; overflow-x: hidden; }
  .lane { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .centre { overflow: visible; padding: 16px; }
  .app.one .centre { padding-inline: 16px; }
  .right { position: fixed; top: 46px; bottom: 52px; }
  .hide-md { display: none !important; }
}
@media (max-width: 720px) {
  .top { gap: 8px; padding: 0 12px; }
  .hide-sm { display: none !important; }
  .who .nm, .who .rl { display: none; }
  .bn { display: none; }
  .stsel { max-width: 150px; }
}

/* ── lane ── */
.lane-pad { padding: 18px 18px 26px; }
.lane .sect { margin-top: 18px; }
.lane-p { margin: 8px 0 0; font-size: 12.5px; line-height: 18px; color: var(--dim); }
.kvr { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.kvr span { flex-grow: 1; font-size: 12.5px; color: var(--dim); }
.kvr b { font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: right; }
.pname { font-size: 17px; font-weight: 600; line-height: 22px; }
.pmeta { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 2px; }
.alert { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px; border-radius: 6px; font-size: 12px; line-height: 16px; margin-top: 6px; background: var(--red-soft); color: var(--red); border: 1px solid var(--red-line); }
.alert.gd { background: var(--gold-soft); color: var(--gold-ink); border-color: var(--gold-line); }
.alert.ok { background: var(--green-soft); color: var(--green); border-color: var(--green-line); }
.vrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 4px; border-top: 1px solid var(--line2); }
.vrow:hover { background: var(--wash); }
.vrow.sel { background: var(--green-soft); box-shadow: inset 3px 0 0 var(--green); }
.vrow .when { width: 50px; flex-shrink: 0; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.vrow .l1 { display: block; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .l2 { display: block; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── centre ── */
.chead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chead h1 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
.sub { margin: 3px 0 0 0; font-size: 12.5px; color: var(--dim); }
.brief { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 8px; padding: 11px 14px; font-size: 12.5px; line-height: 18px; }
.brief b { color: var(--gold-ink); }
.card-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px 10px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line2); }
.card-h h2 { margin: 0; font-size: 13px; font-weight: 600; }
.card-b { padding: 12px 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
@media (max-width: 1100px) { .grid3, .grid4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 720px) { .grid2, .grid3, .grid4 { grid-template-columns: minmax(0,1fr); } }
.tile { padding: 11px 12px 12px; }
.tile .v { margin-top: 6px; font-family: var(--mono); font-size: 22px; line-height: 24px; font-weight: 600; letter-spacing: -.02em; }
.tile .v.rd { color: var(--red); } .tile .v.gd { color: var(--gold-ink); } .tile .v.ok { color: var(--green); }
.tile .nt { margin-top: 3px; font-size: 11px; color: var(--dim); }
.seg2 { display: inline-flex; background: var(--wash); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg2 button { height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg2 button[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(19,36,32,.12); }
.stepper { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0,1fr)); gap: 8px; }
.stp { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
.stp .nb { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font: 600 11.5px var(--mono); color: var(--dim); flex-shrink: 0; }
.stp b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stp small { display: block; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stp.done .nb { background: var(--green); border-color: var(--green); color: #fff; }
.stp.cur { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.stp.cur .nb { border-color: var(--ink); color: var(--ink); }
@media (max-width: 720px) { .stepper { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.step-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 2px; }
.step-h .num { font: 600 11px var(--mono); color: var(--dim); }
.step-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
.ck { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line2); }
.ck:first-child { border-top: 0; }
.ck .t { flex: 1 1 auto; min-width: 0; font-size: 12.5px; }
.ck .t small { display: block; font-size: 11.5px; color: var(--dim); }
.ck .st { font: 700 12px var(--mono); width: 18px; text-align: center; flex-shrink: 0; }
.ck .st.ok { color: var(--green); } .ck .st.no { color: var(--red); } .ck .st.wt { color: var(--gold-ink); }
.sw { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--line); flex-shrink: 0; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(19,36,32,.25); transition: transform .15s; }
.sw[aria-pressed="true"] { background: var(--green); }
.sw[aria-pressed="true"]::after { transform: translateX(16px); }
.chk { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 500; color: var(--dim); }
.chk[aria-pressed="true"] { border-color: var(--green-line); background: var(--green-soft); color: var(--green); font-weight: 600; }
.chk.no[aria-pressed="true"] { border-color: var(--red-line); background: var(--red-soft); color: var(--red); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.formgrid label, .fl { display: grid; gap: 5px; font-size: 12px; color: var(--dim); }
.refuse { border: 1px solid var(--red-line); background: var(--red-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.refuse code { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--red); white-space: nowrap; }
.warnline { border: 1px solid var(--gold-line); background: var(--gold-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.okline { border: 1px solid var(--green-line); background: var(--green-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.dock { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(19,36,32,.08); flex-wrap: wrap; }
.dock .w { font-size: 13.5px; font-weight: 600; }
.dock .s { font-size: 11.5px; color: var(--dim); }
.tblw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; padding: 8px 12px; background: var(--wash); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .r { text-align: right; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--wash); }
table.t tr.hot td { background: var(--red-soft); }
table.t tr.warn td { background: var(--gold-soft); }
table.t tr.sel td { background: var(--green-soft); }
.nrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line2); }
.nrow:first-child { border-top: 0; }
.nrow .w { font-size: 12.5px; font-weight: 500; }
.nrow .y { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
.empty { padding: 16px; font-size: 12.5px; color: var(--dim); }
.bar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); border-radius: 4px; }
.bar > i.gd { background: var(--gold); } .bar > i.rd { background: var(--red); }

/* ── right rail ── */
.plist-h { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-bottom: 1px solid var(--line2); }
.plist-h b { font-size: 12.5px; flex-grow: 1; }
.prow { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line2); width: 100%; cursor: pointer; }
.prow:first-of-type { border-top: 0; }
.prow:hover { background: var(--wash); }
.prow.sel { background: var(--green-soft); box-shadow: inset 3px 0 0 var(--green); }
.prow.dim { opacity: .7; }
.prow .no { width: 44px; flex-shrink: 0; font: 11px var(--mono); color: var(--dim); padding-top: 2px; }
.prow .nm { font-size: 12.5px; font-weight: 600; }
.prow .ln { font-size: 11px; color: var(--dim); margin-top: 2px; line-height: 15px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.prow .wt { font-family: var(--mono); font-size: 11px; flex-shrink: 0; padding-top: 2px; text-align: right; }
.wt.rd { color: var(--red); font-weight: 600; } .wt.gd { color: var(--gold-ink); font-weight: 600; }
.fold { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px 14px; }
.fold b { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.fold .s { flex-grow: 1; font-size: 11.5px; color: var(--dim); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { display: inline-flex; color: var(--dim); transition: transform .15s; }
.fold[aria-expanded="true"] .chev { transform: rotate(180deg); }
.crow { display: flex; align-items: flex-start; gap: 11px; padding: 9px 14px; border-top: 1px solid var(--line2); }
.crow .d { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--gold); }
.crow .d.rd { background: var(--red); } .crow .d.ok { background: var(--green); }
.crow .w { font-size: 12.5px; font-weight: 500; }
.crow .y { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
.crow .t { font-family: var(--mono); font-size: 11.5px; font-weight: 600; white-space: nowrap; margin-left: auto; }
.plmin { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.plmin b { font-size: 12.5px; }
.plmin .s { flex-grow: 1; min-width: 0; font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── copilot panel: light card, dark only as the highlight ── */
.cop { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: inset 3px 0 0 var(--mint); overflow: hidden; }
.cop.zoom { animation: copIn .3s cubic-bezier(.2,.8,.2,1); }
@keyframes copIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.cop-h { display: flex; align-items: center; gap: 9px; padding: 12px 14px 9px; }
.cop-h .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px rgba(53,196,143,.2); flex-shrink: 0; }
.cop-h b { font-size: 13px; font-weight: 600; }
.cop-h span { font-size: 11px; color: var(--dim); }
.cop-sec { padding: 9px 14px; border-top: 1px solid var(--line2); display: grid; gap: 7px; }
.ci { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 8px; font-size: 12px; line-height: 17px; }
.ci > i { font: 700 12px var(--mono); font-style: normal; line-height: 17px; }
.ci.ok > i { color: var(--green); } .ci.warn > i { color: var(--gold); } .ci.no > i { color: var(--red); }
.agdo { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 5px; background: var(--agent); color: var(--agent-fg); font-size: 11px; font-weight: 700; white-space: nowrap; margin-top: 5px; }
.agdo:hover { background: #1f3a31; }
.say { background: var(--wash); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; line-height: 19px; }
.draft { background: var(--wash); border: 1px dashed var(--green-line); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 19px; }
.langs { display: inline-flex; gap: 2px; background: var(--wash); border-radius: 6px; padding: 2px; }
.langs button { height: 22px; padding: 0 8px; border-radius: 4px; font-size: 11px; color: var(--dim); }
.langs button[aria-pressed="true"] { background: var(--agent); color: var(--agent-fg); font-weight: 700; }

/* ── ask bar, toasts, modal ── */
.ask { display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--agent); position: relative; min-width: 0; }
.askbox { flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 14px; border-radius: 7px; background: rgba(255,255,255,.07); border: 1px solid #2c443a; min-width: 0; }
.askbox input { flex-grow: 1; min-width: 0; background: none; border: none; outline: none; color: #eaf5ef; font-size: 12.5px; }
.askbox input::placeholder { color: #88a698; }
.answer { position: absolute; left: 20px; right: 20px; bottom: 58px; z-index: 40; max-width: 760px; margin-inline: auto; background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(19,36,32,.2), inset 3px 0 0 var(--mint); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height: 18px; }
.toasts { position: fixed; right: 20px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 8px; max-width: min(420px, calc(100vw - 40px)); }
.toast { background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(19,36,32,.16); padding: 10px 14px; font-size: 12.5px; display: flex; gap: 12px; align-items: center; }
.toast .ok { width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
.toast.err .ok { background: var(--red); }
.modal-bg { position: fixed; inset: 0; z-index: 55; background: rgba(19,36,32,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--card); border-radius: 10px; width: min(520px, 100%); max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(19,36,32,.3); }
.modal .card-h { position: sticky; top: 0; background: var(--card); }

/* ── imaging: the viewer ── */
.viewer { background: var(--film); border-radius: 8px; overflow: hidden; color: var(--film-fg); display: grid; grid-template-rows: auto minmax(0,1fr) auto; min-height: 380px; }
.vw-bar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid #22302b; flex-wrap: wrap; font: 11px var(--mono); }
.vw-bar button { height: 24px; padding: 0 8px; border-radius: 4px; border: 1px solid #2c3a35; color: var(--film-fg); font: 11px var(--mono); }
.vw-bar button[aria-pressed="true"] { background: #24332e; border-color: var(--mint); color: #fff; }
.vw-grid { display: grid; gap: 2px; background: #000; min-height: 0; }
.vw-grid.g2 { grid-template-columns: 1fr 1fr; }
.vw-cell { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
.vw-cell canvas { max-width: 100%; max-height: 100%; aspect-ratio: 1; width: 100%; height: auto; display: block; }
.vw-ov { position: absolute; font: 10px/13px var(--mono); color: #d7e3dd; text-shadow: 0 1px 2px #000; pointer-events: none; }
.vw-ov.tl { top: 6px; left: 8px; } .vw-ov.tr { top: 6px; right: 8px; text-align: right; } .vw-ov.bl { bottom: 6px; left: 8px; } .vw-ov.br { bottom: 6px; right: 8px; text-align: right; }
.vw-foot { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid #22302b; overflow-x: auto; }
.thumb { width: 54px; height: 54px; border-radius: 4px; border: 1px solid #2c3a35; flex-shrink: 0; overflow: hidden; background: #000; position: relative; }
.thumb canvas { width: 100%; height: 100%; display: block; }
.thumb[aria-pressed="true"] { border-color: var(--mint); }
.thumb span { position: absolute; left: 3px; bottom: 2px; font: 9px var(--mono); color: #cfd8d3; }

/* ── printed paper ── */
.paper { background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 26px rgba(19,36,32,.08); border-radius: 4px; padding: 26px 30px; font-size: 12.5px; line-height: 19px; max-width: 760px; }
.paper h3 { margin: 14px 0 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-family: var(--mono); color: var(--dim); }
.paper .hd { display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; flex-wrap: wrap; }
.paper .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 4px 16px; font-size: 11.5px; margin-top: 10px; }

/* ── blueprint (the brainstorm) ── */
.bp-hero { padding: 22px 24px; border-radius: 12px; background: var(--agent); color: var(--agent-fg); display: grid; gap: 10px; }
.bp-hero .tag { color: var(--mint); }
.bp-hero h1 { margin: 0; font-size: 27px; line-height: 34px; font-weight: 600; color: #fff; letter-spacing: -.015em; max-width: 30ch; }
.bp-hero p { margin: 0; font-size: 13.5px; line-height: 21px; max-width: 78ch; color: var(--agent-fg); }
.bp-hero .words { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.bp-hero .words span { font: 600 12px var(--mono); letter-spacing: .08em; padding: 5px 10px; border-radius: 5px; border: 1px solid #2c443a; color: #fff; }
.prose { font-size: 13px; line-height: 20px; max-width: 80ch; }
.prose p { margin: 0 0 8px; }
.spine { display: flex; gap: 0; overflow-x: auto; padding-bottom: 4px; }
.spine .sn { flex: 1 0 118px; padding: 10px 10px 11px; border-top: 3px solid var(--green); position: relative; }
.spine .sn + .sn { border-left: 1px solid var(--line2); }
.spine .sn b { display: block; font-size: 12.5px; }
.spine .sn small { display: block; font-size: 11px; color: var(--dim); line-height: 15px; margin-top: 3px; }
.spine .sn .who2 { font: 600 9.5px var(--mono); letter-spacing: .1em; color: var(--green); text-transform: uppercase; }
.scr { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line2); width: 100%; }
.scr:hover { background: var(--wash); }
.scr .id { font: 600 10.5px var(--mono); color: var(--dim); width: 36px; flex-shrink: 0; padding-top: 1px; }
.scr b { font-size: 12.5px; font-weight: 600; display: block; }
.scr small { font-size: 11.5px; color: var(--dim); display: block; line-height: 16px; }
.st-now { font: 700 9.5px var(--mono); letter-spacing: .08em; padding: 1px 6px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
.st-now.have { background: var(--green-soft); color: var(--green); }
.st-now.part { background: var(--gold-soft); color: var(--gold-ink); }
.st-now.none { background: var(--red-soft); color: var(--red); }
@media (prefers-reduced-motion: reduce) { .cop.zoom { animation: none; } .sw, .sw::after, .chev { transition: none; } }
/* narrow header: the menu button shrinks before the page scrolls sideways */
.nvbtn { min-width: 0; flex-shrink: 1; }
.nvbtn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stsel { min-width: 0; flex-shrink: 1; }
@media (max-width: 480px) { .stsel { max-width: 128px; } .top { gap: 6px; } .brand .dia { display: none; } }
span.mod { display: inline-block; }
.nrow .w, .nrow .y { display: block; }
.jrow { display: flex; align-items: stretch; gap: 6px; padding: 12px 14px; overflow-x: auto; }
.jstep { display: grid; gap: 2px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); min-width: 118px; flex-shrink: 0; }
.jstep:hover { border-color: var(--green-line); background: var(--green-soft); }
.jstep b { font-size: 12.5px; } .jstep small { font: 10.5px var(--mono); color: var(--dim); }
.jarr { align-self: center; color: var(--dim); flex-shrink: 0; }

/* front desk: the day diary */
.dy { display: grid; grid-template-columns: 52px repeat(7, minmax(128px, 1fr)); min-width: 960px; }
.dy-col, .dy-t { border-left: 1px solid var(--line2); min-width: 0; }
.dy-t { border-left: 0; }
.dy-h { height: 50px; padding: 6px 8px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; background: var(--wash); position: sticky; top: 0; z-index: 4; }
.dy-h b { font-size: 12px; }
.dy-h small { width: 100%; font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dy-body { position: relative; background-image: repeating-linear-gradient(to bottom, var(--line2) 0, var(--line2) 1px, transparent 1px, transparent 66px); }
.dy-t .dy-body span { position: absolute; left: 6px; font: 10.5px var(--mono); color: var(--dim); transform: translateY(-1px); }
.dy-b { position: absolute; left: 3px; right: 3px; border-radius: 4px; padding: 1px 5px; font-size: 10.5px; line-height: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid rgba(19,36,32,.08); }
.dy-b b { font-family: var(--mono); font-weight: 600; }
.dy-b:hover { box-shadow: 0 0 0 1px var(--ink); z-index: 2; }
.dy-free { position: absolute; left: 3px; right: 3px; border-radius: 4px; border: 1.5px dashed var(--green); background: var(--green-soft); color: var(--green); font: 600 10.5px var(--mono); padding: 0 5px; z-index: 3; }
.dy-free:hover { background: var(--green); color: #fff; }
.dy-now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--red); z-index: 5; pointer-events: none; }
/* front desk: the waiting-hall display (a TV; large type, light, one accent) */
.tv { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.tv-call { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 14px 18px; border-radius: 10px; background: var(--green-soft); border: 2px solid var(--green); }
.tv-call b { font: 700 40px/44px var(--mono); color: var(--green); letter-spacing: .02em; }
.tv-call span { font-size: 18px; font-weight: 600; }
.tv-call .tv-hi { width: 100%; font-size: 16px; font-weight: 500; color: var(--dim); }
.tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tv-room { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.tv-room.off { background: var(--wash); }
.tv-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tv-h b { font: 700 20px var(--mono); }
.tv-h span { font-size: 13px; color: var(--dim); }
.tv-l { display: block; font: 600 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); width: 100%; }
.tv-now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.tv-tok { font: 700 34px/38px var(--mono); color: var(--ink); }
.tv-tok.idle, .tv-tok.off { color: var(--dim); font-size: 22px; }
.tv-nm { font-size: 16px; font-weight: 600; }
.tv-next { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tv-chip { font: 700 17px var(--mono); padding: 4px 9px; border-radius: 6px; background: var(--wash); white-space: nowrap; }
.tv-chip small { font: 500 12px var(--sans); color: var(--dim); }
.tv-notes { display: grid; gap: 8px; }
.tv-notes div { border: 1px solid var(--gold-line); background: var(--gold-soft); border-radius: 8px; padding: 10px 14px; display: grid; gap: 3px; }
.tv-notes b { font-size: 16px; }
.tv-notes span { font-size: 15px; color: var(--gold-ink); }
.tv-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; font-size: 13px; color: var(--dim); border-top: 1px solid var(--line2); padding-top: 10px; }
@media (max-width: 720px) { .tv { padding: 12px; } .tv-call b { font-size: 30px; } .tv-tok { font-size: 28px; } }

/* ── patient's phone (st-pt) ── */
.ph-wrap { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .ph-wrap { grid-template-columns: minmax(0, 1fr); } }
.phone { width: 100%; max-width: 390px; margin-inline: auto; border-radius: 30px; background: #101b17; padding: 10px; box-shadow: 0 18px 40px rgba(19,36,32,.22); }
.ph-scr { border-radius: 22px; overflow: hidden; background: #ece5dd; display: grid; grid-template-rows: auto minmax(0,1fr) auto; height: 700px; max-height: 76vh; }
.ph-top { background: #075e54; color: #fff; display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; }
.ph-top .av2 { width: 32px; height: 32px; border-radius: 50%; background: #d9efe4; color: #075e54; display: flex; align-items: center; justify-content: center; font: 700 11px var(--mono); flex-shrink: 0; }
.ph-top b { display: block; font-size: 13.5px; }
.ph-top small { display: block; font-size: 11px; opacity: .8; }
.ph-body { overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.ph-day { align-self: center; font-size: 10.5px; background: #e1f2fb; color: #3b5563; border-radius: 6px; padding: 3px 9px; }
.bub { max-width: 86%; border-radius: 9px; padding: 8px 10px 5px; font-size: 13px; line-height: 18px; background: #fff; color: #111b21; box-shadow: 0 1px 1px rgba(0,0,0,.08); align-self: flex-start; }
.bub.me { align-self: flex-end; background: #d9fdd3; }
.bub .tm { display: block; text-align: right; font-size: 10px; color: #667781; margin-top: 3px; }
.bub .hi { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #d4d9d6; font-family: var(--sans); }
.bub .btns { display: grid; gap: 1px; margin: 8px -10px -5px; border-top: 1px solid #e9edef; }
.bub .btns button { padding: 9px; text-align: center; color: #027eb5; font-size: 13px; font-weight: 500; background: #fff; }
.bub .btns button + button { border-top: 1px solid #e9edef; }
.bub .btns button[aria-pressed="true"] { color: #667781; }
.bub .doc { display: flex; align-items: center; gap: 9px; background: #f5f6f6; border-radius: 6px; padding: 8px; margin-bottom: 4px; }
.bub .doc i { font: 700 10px var(--mono); font-style: normal; background: #e3483d; color: #fff; border-radius: 3px; padding: 3px 5px; }
.bub .link { color: #027eb5; word-break: break-all; }
.bub .tpl { display: inline-block; font: 600 9px var(--mono); letter-spacing: .08em; color: #9a6208; background: rgba(221,143,28,.14); border-radius: 3px; padding: 1px 5px; margin-bottom: 4px; }
.ph-in { display: flex; gap: 8px; padding: 8px 10px; background: #f0f2f5; }
.ph-in input { flex-grow: 1; min-width: 0; height: 36px; border: none; border-radius: 18px; padding: 0 14px; font-size: 13px; background: #fff; }
.ph-in button { width: 36px; height: 36px; border-radius: 50%; background: #075e54; color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ph-page { background: #fff; border-radius: 9px; padding: 12px; align-self: stretch; box-shadow: 0 1px 1px rgba(0,0,0,.08); font-size: 13px; line-height: 18px; display: grid; gap: 8px; }
.ph-page .otp { display: flex; gap: 6px; }
.ph-page .otp input { width: 40px; height: 44px; text-align: center; font: 600 18px var(--mono); border: 1px solid var(--line); border-radius: 6px; }
.stars { display: flex; gap: 4px; }
.stars button { font-size: 24px; line-height: 28px; color: #c9d1cc; }
.stars button[aria-pressed="true"] { color: #dd8f1c; }
.note-i { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line2); font-size: 12.5px; line-height: 18px; }
.note-i:first-child { border-top: 0; }
.note-i .nb2 { width: 22px; height: 22px; border-radius: 50%; background: var(--wash); border: 1px solid var(--line); font: 600 11px var(--mono); display: inline-flex; align-items: center; justify-content: center; color: var(--dim); }
.note-i b { display: block; font-size: 12.5px; }
.note-i small { display: block; color: var(--dim); font-size: 11.5px; margin-top: 2px; }

/* ── reading room ── */
.rd-win[data-p="brain"] .vw-cell canvas { filter: contrast(1.35) brightness(.95); }
.rd-win[data-p="subdural"] .vw-cell canvas { filter: contrast(1.15) brightness(1.12); }
.rd-win[data-p="bone"] .vw-cell canvas { filter: contrast(2.1) brightness(.72); }
.rd-win[data-p="lung"] .vw-cell canvas { filter: contrast(.75) brightness(1.45); }
.rd-win[data-p="abdomen"] .vw-cell canvas { filter: contrast(1.1); }
.rd-win.flip .vw-cell:first-child canvas { transform: scaleX(-1); }
.rd-win .vw-cell { min-height: 260px; }
.rd-win .vw-cell.meas::after { content: ""; position: absolute; left: 38%; top: 46%; width: 18%; height: 0; border-top: 1.5px dashed var(--mint); transform: rotate(-18deg); pointer-events: none; }
.rd-key { position: absolute; top: 28px; left: 8px; font: 700 9.5px var(--mono); letter-spacing: .1em; color: #0b2018; background: var(--mint); padding: 1px 6px; border-radius: 3px; }
.rd-lock { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--blue); font-weight: 600; }
.rd-sec { display: grid; gap: 5px; padding: 10px 14px; border-top: 1px solid var(--line2); }
.rd-sec:first-child { border-top: 0; }
.rd-sec label { font: 600 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.rd-sec textarea { min-height: 64px; font-size: 13px; line-height: 19px; }
.rd-sec textarea.tall { min-height: 132px; }
.rd-ro { font-size: 13px; line-height: 20px; white-space: pre-wrap; }
.rd-asp { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
.rd-asp button { height: 34px; border-radius: 6px; border: 1px solid var(--line); font: 600 12px var(--mono); text-align: center; background: var(--card); }
.rd-asp button[aria-pressed="true"] { background: var(--red-soft); border-color: var(--red-line); color: var(--red); text-decoration: line-through; }
.rd-score { font: 600 30px var(--mono); letter-spacing: -.02em; }

/* ══════════════════════════════════════════════════════════════════════
   THE SPINE — one set of stores every station reads and writes, so a hand-off made in one seat
   shows in the next. Stations call these functions; they never keep a private copy of a
   department fact (a critical call, a release, a follow-up, a bill decision, an approval).
   Every call appends to LOG, which is the audit trail the HOD's access log and the journeys read.

const by = () => (ST[S.st] && ST[S.st].person ? ST[S.st].person.n : 'system');

let SEQ = 70, BSEQ = 100;
const nextBill = () => 'BD' + (++BSEQ);
function nextAcc() { SEQ++; return 'I26092800' + SEQ; }

/* H1 · the doctor orders. o: {pt, svc, n, st, dev?, mod, pri, src, doc, q, price, contrast?, pndt?, side?} */
function orderStudy(o) {
  const s = Object.assign({ acc: nextAcc(), state: o.src === 'ER' || o.src === 'IPD' ? 'scheduled' : 'to_book', ordered: now() }, o);
  if (s.state === 'scheduled' && !s.slot) s.slot = now();

}
const PRI_N = { stat: 'STAT', urgent: 'URGENT', routine: 'ROUTINE' };
/* H2 · the desk books a slot (refuses an unlicensed ionising room and a down room) */
function bookStudy(acc, dev, slot) {
  const s = study(acc), d = DEV[dev];
  if (d && d.aerb !== 'ok' && d.aerb !== 'na') return { code: 'device_not_licensed', msg: `${dev} (${d.room}) has no active AERB licence. Book another room, or the RSO files the certificate under Radiation safety → Licences.` };
  if (d && d.up === 'down') return { code: 'device_down', msg: `${dev} is down. Book another room of the same kind.` };
  s.dev = dev; s.slot = slot; s.state = 'scheduled'; logEv(acc, 'study.scheduled', `${dev} ${hm(slot)}`); return null;
}
/* H3 · arrival: opening the patient at the desk on the day checks them in; the gates open from facts */
function checkIn(acc) {
  const s = study(acc); if (!s || !['scheduled', 'to_book'].includes(s.state)) return;
  s.state = 'checked_in'; s.arrived = now(); s.gates = s.gates || openGates(s); logEv(acc, 'study.checked_in');
}
function openGates(s) {
  const p = PT[s.pt], m = modOf(s), g = { identity_two_factor: 'open' };
  if (p.sex === 'F' && p.age >= 10 && p.age <= 55 && ['CT', 'XR', 'MG', 'FL', 'IR', 'DX'].includes(m)) g.pregnancy_screen = 'open';
  if (s.contrast) { g.contrast_consent = 'open'; g.renal_function = p.crea > 2.0 ? 'open' : 'satisfied'; if ((p.allergy || []).some(a => /contrast/i.test(a))) g.prior_contrast_reaction = 'open'; }

  if (s.pndt) g.form_f = 'open';
  if (m === 'MG' || /transvaginal|breast/i.test(s.n)) g.chaperone_present = 'open';
  if (s.side) g.laterality_confirm = 'open';

const openGateKinds = s => Object.keys(s.gates || {}).filter(k => s.gates[k] === 'open');
/* H4 · a gate closes; how: 'satisfied' | 'waived' | 'overridden'. When none is open the study is ready. */
const NEVER_WAIVE_K = ['form_f', 'identity_two_factor'], NEVER_OVERRIDE_K = ['form_f', 'laterality_confirm'], WAIVABLE_K = ['pregnancy_screen', 'chaperone_present'];
function closeGate(acc, kind, how, reason) {
  const s = study(acc); s.gates = s.gates || openGates(s);
  if (how === 'waived' && !WAIVABLE_K.includes(kind)) return { code: 'gate_not_waivable', msg: `${GATE_N[kind]} cannot be waived.` };
  if (how === 'overridden' && NEVER_OVERRIDE_K.includes(kind)) return { code: 'gate_not_overridable', msg: `${GATE_N[kind]} has no override. The statute or the side of the body is not a judgement call.` };
  if (how !== 'satisfied' && !(reason && reason.trim().length >= 8)) return { code: 'reason_required', msg: 'Write the reason in a sentence; it goes on the record.' };
  s.gates[kind] = how; if (s.hold === kind) s.hold = null; logEv(acc, 'gate.' + how, GATE_N[kind] + (reason ? ' · ' + reason : ''));
  if (!openGateKinds(s).length && s.state === 'checked_in') { s.state = 'ready'; s.hold = null; logEv(acc, 'study.ready'); }
  return null;
}
/* an override the technologist cannot give goes to the radiologist or HOD as an approval */
function askApproval(o) { const a = Object.assign({ id: 'AP' + (APPROVALS.length + 1), state: 'open', askedBy: by(), at: now() }, o); APPROVALS.push(a); logEv(o.acc, 'approval.asked', o.ask); return a; }

/* H5 · the room: start refuses without licence, payment and closed gates; acquired writes dose */
function startScan(acc) {
  const s = study(acc), d = DEV[s.dev];

  if (d && (d.up === 'down' || d.up === 'qa_blocked')) return { code: 'device_unavailable', msg: `${s.dev} is ${d.up === 'down' ? 'down' : 'blocked by a failed QA test'}. Move the patient to another room.` };
  const open = openGateKinds(s); if (open.length) return { code: 'gate_open', msg: `Still open: ${open.map(k => GATE_N[k]).join(', ')}. The prep bay closes them.` };
  if (s.unpaid) return { code: 'payment_required', msg: 'Self-pay study not settled. The front desk collects before the room.' };

function acquire(acc, dose) {

function raiseBill(acc, kind, amount, note) { const b = { id: nextBill(), at: now(), acc, kind, amount: amount || 0, state: 'open', note: note || '' }; BILLQ.push(b); logEv(acc, 'bill.' + kind, note); return b; }

function signReport(acc, signer) {

}
/* H8/H9 · critical findings: raised by the reader, closed only by a correct read-back */
function raiseCritical(acc, cat, finding) {
  const s = study(acc); const c = { id: 'CR' + (CRIT.length + 1), acc, cat, finding, to: s.doc, rung: 1, state: 'open', raisedAt: now(), raisedBy: by() };
  CRIT.push(c); logEv(acc, 'critical.flagged', cat + ' · ' + finding); return c;
}
function ackCritical(id, readBack) {

}
/* H10 · the loop closes: the treating doctor says what the report changed */
function actedUpon(acc, note) {
  if (!(note && note.trim().length >= 4)) return { code: 'note_required', msg: 'Say in a line what the report changed.' };
  REL[acc] = REL[acc] || { patient: 'sent', film: 'none' }; REL[acc].doctor = 'acted'; REL[acc].actedNote = note; REL[acc].actedAt = now();
  logEv(acc, 'report.acted_upon', note); return null;
}
function readReport(acc) { REL[acc] = REL[acc] || { patient: 'sent', film: 'none' }; if (REL[acc].doctor !== 'acted') REL[acc].doctor = 'read'; ALOG.push({ t: now(), who: by(), role: 'doctor', acc, what: 'report', reason: 'treating doctor' }); }
/* H11 · follow-ups: recommended by the reader, booked by the doctor, which places a new order */
function addFollowup(acc, rec, due, dueDays) { const s = study(acc); const f = { id: 'FU' + (FU.length + 1), acc, pt: s.pt, rec, due, dueDays: dueDays || 180, state: 'open' }; FU.push(f); logEv(acc, 'followup.recommended', rec); return f; }
function bookFollowup(id, o) { const f = FU.find(x => x.id === id); const src = study(f.acc); const s = orderStudy(Object.assign({ pt: f.pt, src: 'OPD', doc: src.doc, pri: 'routine', q: 'Follow-up: ' + f.rec }, o)); f.state = 'booked'; f.newAcc = s.acc; return s; }

function fileLicence(dev, text) { DEV[dev].aerb = 'ok'; DEV[dev].lic = text || 'eLORA licence · filed ' + hm(now()); logEv(null, 'aerb.licence_filed', dev);

  function how() {

      `<div class="grid2">` +
      card('Moving around', `<div class="card-b prose"><p><b>Station</b> — the dropdown at the top left switches seat: front desk, prep bay, rooms, ultrasound, reading room, radiation safety, HOD, the doctor’s door, the patient’s phone, setup.</p><p><b>Menu</b> — each station’s screens sit in the header, as on the lab and pharmacy boards.</p><p><b>Keys</b> — <span class="kb">Esc</span> puts the patient down, <span class="kb">Enter</span> runs the next act in the dock, <span class="kb">/</span> opens the copilot bar.</p><p style="margin:0"><b>One study, many seats</b> — sign a study in the reading room and it shows as signed at the desk and in the doctor’s inbox.</p></div>`) +
      card('Start here — five walks', `<div>${[
        ['Stroke at 09:55', 'read:report', 'Kamla Devi’s STAT CT: read, score, call the ER doctor, sign.'],
        ['A study nobody could order', 'doc:order', 'Order imaging from the consult — the door that is missing today.'],

        ['The HOD’s morning', 'hod:escalations', 'Everything whose clock ran out, each needing an act.'],
      ].map(w => `<button class="scr" data-act="go" data-arg="${w[1]}"><span class="grow"><b>${w[0]}</b><small>${w[2]}</small></span><span class="lnk">Open</span></button>`).join('')}</div>`) +
      `</div>` +
      `<div class="okline">Synthetic people and numbers throughout. Images are drawn by the page, not taken from any patient. Machine names and licence numbers are illustrative; no licence is claimed for the hospital.</div>`;
  }

  station({
    id: 'bp', name: 'Blueprint', person: { n: 'Radiology', i: 'R', role: 'the brainstorm · 28 Sep 2026' },
    navs: [
      { id: 'north', label: 'North star', b: 'part', why: 'The one number, targets, the spine, seats' },
      { id: 'map', label: 'Every screen', b: 'part', why: 'All stations and screens, with build status' },
      { id: 'today', label: 'Today → next', b: 'part', why: 'Inventory of the code, defects, build order' },
      { id: 'journeys', label: 'Journeys', b: 'none', why: 'Eleven journeys, every hand-off between seats' },
      { id: 'rules', label: 'Rules & clocks', b: 'part', why: 'Decided under delegation, clocks, copilot limits' },
      { id: 'how', label: 'How to read', b: 'have', why: 'Navigation and five walks' },
    ],
    layout: () => 'one',
    centre: v => v === 'map' ? map() : v === 'today' ? today() : v === 'journeys' ? journeys() : v === 'rules' ? rules() : v === 'how' ? how() : north(),
  });
})();

<script>
/* ══════ Front desk (R-01): counter · schedule · report hand-over · outside CDs ══════ */
(function () {
'use strict';

/* ── station-local data ── */

PT.ramesh = { id: 'ramesh', n: 'Ramesh Gope', age: 54, sex: 'M', uhid: 'UH2310144', phone: '99311 45208', wt: 74, allergy: [], flags: ['walk-in · outside prescription (Dr. P. Lakra, Kadma)'] };
PT.sabita = { id: 'sabita', n: 'Sabita Devi', age: 49, sex: 'F', uhid: 'UH2304877', phone: '70043 21890', wt: 60, allergy: [], flags: [] };
if (!study('I2609280061')) STUDY.push({ acc: 'I2609280061', pt: 'ramesh', svc: 'RAD-XR-KNEE', n: 'X-ray right knee, AP and lateral', st: 'XR-KNEE', dev: 'XR-2', pri: 'routine', src: 'WALK', doc: 'lakra', state: 'to_book', ordered: ago(4), q: 'Right knee pain for 2 months, swelling. Osteoarthritis?', price: 500, side: 'right', outsideRx: true });

/* DECIDED 28 Sep (owner delegated to top-hospital practice): one film included with an X-ray; CT/MRI/USG film on request ₹250 a sheet;

const FILM = 250, CDP = 300;
const filmFree = s => modOf(s) === 'XR' || modOf(s) === 'MG';
// the diary needs a time for every study already in motion this morning
[['I2609280044', at(15, 10)], ['I2609280049', at(14, 0)], ['I2609280046', at(10, 30)], ['I2609280047', at(10, 30)], ['I2609280050', at(10, 0)], ['I2609280053', at(11, 20)], ['I2609280054', at(10, 20)], ['I2609280030', at(9, 30)], ['I2609280038', at(10, 10)], ['I2609280041', at(10, 50)], ['I2609280033', at(9, 5)]].forEach(([a, t]) => { const x = study(a); if (x && !x.slot) x.slot = t; });
const TARIFF = {
  'RAD-CT-HEAD': 2200, 'RAD-CT-TRAUMA': 9800, 'RAD-XR-CHEST-PORT': 600, 'RAD-CT-ABD-CECT': 6500, 'RAD-MR-LSS': 6800, 'RAD-US-OB-ANOM': 2500,
  'RAD-MG-BIL': 3200, 'RAD-MR-BRAIN': 7500, 'RAD-XR-LS': 700, 'RAD-US-ABD': 1400, 'RAD-XR-CHEST-PA': 450, 'RAD-US-THY': 1200, 'RAD-2ND-OPINION': 1500,
  'RAD-CT-CHEST-LD': 3200, 'RAD-US-OB-EARLY': 1200, 'RAD-XR-KNEE': 500,
};
// imaging done in the last 30 days — what `duplicate_recent` reads
const HIST = {
  salma: [{ n: 'X-ray lumbosacral spine, AP and lateral', date: '12 Sep 2026', acc: 'I2609120022', where: 'XR-2', doc: 'bose' }],
  mohan: [{ n: 'CT chest, plain', date: '14 Mar 2026', acc: 'I2603140009', where: 'CT-1', doc: 'minz', old: true }],
  farida: [{ n: 'USG whole abdomen', date: '19 Sep 2026', acc: 'I2609190031', where: 'US-1', doc: 'mishra' }],
};
const PAYERS = {
  self: { n: 'Self-pay', note: 'pays before the room' },
  corp: { n: 'CCL · corporate credit', note: 'letter CCL/MED/2026/1182 · valid to 31 Mar 2027 · 15% off tariff by contract', factor: .85, credit: true },
  tpa: { n: 'TPA · cashless', note: 'Star Health via MediAssist · pre-authorisation needed for MRI and CT', credit: true, preauth: true },
  ipd: { n: 'IPD · running bill', note: 'posts to the admission', credit: true },
  er: { n: 'Emergency · bill follows', note: 'STAT authorisation under Dr. Ila Chandra (DR-0107)', credit: true },
};
const D = { sel: null, acc: null, step: 0, checks: {}, payer: {}, paid: {}, preauth: {}, slot: {}, dupReason: {}, sent: {}, film: {}, cd: {}, discReq: {} };
const payerOf = p => D.payer[p.id] || (studiesOf(p.id).some(s => s.src === 'ER') ? 'er' : p.ip ? 'ipd' : 'self');

// which studies the counter works on for a patient: not yet checked-in or booked
const deskStudies = pid => studiesOf(pid).filter(s => ['to_book', 'scheduled', 'checked_in'].includes(s.state));
const counterRows = () => {
  const ids = [...new Set(STUDY.filter(s => ['to_book', 'scheduled'].includes(s.state) || (s.state === 'checked_in' && s.src !== 'IPD')).map(s => s.pt))];
  const rank = p => { const ss = studiesOf(p).filter(s => ['to_book', 'scheduled', 'checked_in'].includes(s.state)); return ss.some(s => s.pri === 'stat') ? 0 : ss.some(s => s.pri === 'urgent') ? 1 : ss.some(s => s.state === 'to_book') ? 2 : 3; };
  return ids.sort((a, b) => rank(a) - rank(b));
};

/* the checks a study needs at the counter, computed from the study type (the prep bay satisfies the gates later) */
function checksFor(s) {
  const p = PT[s.pt], m = modOf(s), fem = p.sex === 'F' && p.age >= 10 && p.age <= 50, ion = ['CT', 'XR', 'MG', 'DX', 'FL', 'IR'].includes(m), out = [];
  if (s.contrast) {
    out.push({ k: 'crea', t: 'Creatinine within 30 days', s: p.crea != null ? `${p.crea} mg/dL on 24 Sep · eGFR ${p.egfr}` : 'No result on file — send to the lab before the slot', auto: p.crea != null ? (p.egfr < 30 ? 'no' : 'ok') : 'wt' });
    out.push({ k: 'cons', t: 'Contrast consent form handed over (Hindi / English)', s: 'Signed in the prep bay, not at the counter' });
    out.push({ k: 'fast4', t: 'Nil by mouth 4 hours', s: 'Water allowed until 2 hours before' });
    if ((p.allergy || []).some(a => /contrast/i.test(a))) out.push({ k: 'aller', t: 'Previous contrast reaction — premedication plan', s: 'Prep bay starts the steroid schedule; earliest slot 5 hours after dose 1', auto: 'wt' });
  }
  if (fem && ion) out.push({ k: 'preg', t: 'Pregnancy question asked (LMP)', s: p.lmp ? `LMP ${p.lmp}` : (p.flags || []).find(f => /LMP/.test(f)) || 'Ask: “Is there any chance you are pregnant? When was your last period?”' });
  if (s.pndt) out.push({ k: 'formf', t: 'PCPNDT Form F will be filled by the sonologist', s: 'Bring ID proof and the referral slip. Sex of the foetus is never disclosed — the board in Room 111 says so.', auto: 'wt' });
  if (m === 'MR') { out.push({ k: 'impl', t: 'Implant question: pacemaker, stent, cochlear implant, metal in the eye?', s: (p.flags || []).find(f => /pacemaker/i.test(f)) || 'Nothing declared yet', auto: (p.flags || []).some(f => /pacemaker/i.test(f)) ? 'no' : undefined }); out.push({ k: 'claus', t: 'Claustrophobia asked', s: '45 minutes in the tunnel; music offered' }); }
  if (s.sedation) out.push({ k: 'sed', t: 'Sedation: nil by mouth 6 h (milk 4 h), guardian present', s: 'Anaesthetist slot confirmed with OT desk', auto: 'wt' });
  if (/USG-ABDO/.test(s.st)) out.push({ k: 'fast6', t: 'Fasting 6 hours (gall bladder)', s: 'Last meal time asked' });
  if (/PELVIS|KUB|OBS-EARLY/.test(s.st)) out.push({ k: 'blad', t: 'Full bladder: 4–5 glasses of water 1 hour before', s: 'Do not pass urine until the scan' });
  if (s.outsideRx) out.push({ k: 'rx', t: 'Outside prescription scanned and attached', s: 'Referrer name, registration no. and the question must be legible', auto: 'wt' });
  if (s.side) out.push({ k: 'side', t: `Side stated by the patient: ${s.side.toUpperCase()}`, s: 'Checked again in the room (laterality gate)' });
  out.push({ k: 'id', t: 'Two identifiers: name and UHID match the slip', s: 'Photo ID for PCPNDT and medico-legal cases' });
  return out;
}
const ckState = (s, c) => D.checks[s.acc + ':' + c.k] || c.auto || 'wt';

function bill(p) {
  const pay = payerOf(p), f = PAYERS[pay].factor || 1, lines = [];
  deskStudies(p.id).forEach(s => {
    lines.push({ c: s.svc, n: s.n, a: (TARIFF[s.svc] || s.price) * f });
    if (s.contrast) lines.push({ c: 'incl.', n: 'Contrast and premedication', a: 0, note: 'inside the study price; nothing to reverse if contrast is not given' });
    if (s.sedation) lines.push({ c: 'ANS-SED-SHORT', n: 'Procedural sedation (anaesthetist)', a: 2500 * f });
    if (filmFree(s)) lines.push({ c: 'incl.', n: 'One printed film', a: 0, note: 'included with every X-ray and mammogram' });
    else if (D.film[s.acc]) lines.push({ c: 'RAD-FILM', n: 'Printed film, 1 sheet', a: FILM * f, note: 'on request · the digital images are free' });
    if (D.cd[s.acc]) lines.push({ c: 'RAD-CD', n: 'Images on CD with viewer', a: CDP * f });
  });
  return { pay, lines, total: lines.reduce((t, l) => t + l.a, 0) };
}

/* slots: next free times per machine (the diary route exists: GET /radiology/studies/device/:id/diary) */
const FREE = { 'CT-1': [at(12, 40), at(13, 20), at(15, 10), at(16, 0)], 'MR-1': [at(13, 30), at(16, 15), at(17, 0)], 'XR-2': [at(11, 20), at(11, 30), at(11, 45), at(12, 0)], 'US-1': [at(11, 40), at(12, 20), at(14, 0)], 'US-2': [at(11, 50), at(12, 30), at(15, 30)], 'MG-1': [at(12, 0), at(14, 30)], 'DX-1': [at(11, 30), at(12, 45)] };
const devFor = s => s.dev === 'XR-1' ? 'XR-2' : s.dev;

/* ═══════════ COUNTER ═══════════ */
function counterLane() {
  if (!D.sel) {
    return laneEmpty('Nobody in hand', 'Open a patient from the list, or scan the doctor’s slip. Opening a patient means they are at the counter.',
      kv('Booked today', '31') + kv('Walk-ins', '9') + kv('Collected', rupee(48650)) + kv('Median at counter', '4m 10s') + kv('Your session', 'cash drawer open · 08:02'));
  }

  return lanePatient(p, `<div class="sect"><div class="row"><span class="tag grow">Today</span>${first ? `<button class="iconbtn" data-act="desk.bell" data-arg="${first.acc}" aria-label="Call the token on the hall display" title="Call on the hall display">${icon.bell}</button>` : ''}</div>${studiesOf(p.id).map(s => `<div data-acc="${s.acc}">${studyRows([s], 'desk.acc', D.acc)}</div>`).join('')}</div>
    <div class="sect"><span class="tag">Imaging in 30 days</span>${(HIST[p.id] || []).filter(h => !h.old).map(h => `<div class="kvr"><span>${esc(h.n)}</span><b>${esc(h.date.slice(0, 6))}</b></div>`).join('') || '<p class="lane-p">None</p>'}</div>
    <div class="sect"><span class="tag">Payer</span><p class="lane-p"><b style="color:var(--ink)">${esc(PAYERS[payerOf(p)].n)}</b><br>${esc(PAYERS[payerOf(p)].note)}</p></div>`);
}

function counterCentre() {
  const head = chead('Imaging counter · R-01', 'Order to slot in four steps. The dock always offers the next act.', '');
  const b = built('part', '<code>/radiology/reception</code> lists today, schedules, walks in and checks in. Orders cannot arrive from a screen today: <code>POST /radiology/orders</code> has no web caller (plan 18a-iv). The order queue, checks, bill and slip on one screen are new.');
  if (!D.sel) {
    return head + b +
      card('Scan the slip or search', `<div class="card-b"><div class="row"><label class="sr" for="desk-q">Search</label><input class="in" id="desk-q" data-in="desk.q" placeholder="UHID, phone, name or accession · e.g. Deepa, UH2310144" value="${esc(D.q || '')}" style="flex:1 1 240px"><button class="pri" data-act="desk.search">Open</button></div>
        <p class="sub" style="margin-top:8px">A doctor’s slip carries the visit number; scanning it opens the patient with the advised imaging lines already listed.</p></div>`) +
      card('Where orders come from', `<div class="card-b prose"><p><b>A doctor in this hospital</b> orders from the consult (Doctor’s door → Order imaging). The order lands on the right as <i>to book</i> with the clinical question, checks and price already on it.</p><p><b>The ER and the wards</b> skip this counter: STAT and ward orders go straight to the room’s worklist; the bill follows the ER or IPD account.</p><p style="margin:0"><b>An outside doctor</b> — the patient brings a paper prescription. Scan it; the referrer’s name and registration number become the order’s authority.</p></div>`);

  return head + b + stepper(steps, D.step, 'desk.step') + body + counterDock(p, list);
}

function stepStudies(p, list) {
  const dup = list.map(s => ({ s, h: (HIST[p.id] || []).find(h => !h.old && h.n.split(',')[0] === s.n.split(',')[0]) })).filter(x => x.h);
  return `<div class="step-h"><span class="num">01</span><h2>Studies</h2><span class="dim">from the doctor’s advice · type-ahead from the study book (20 types today)</span></div>` +
    card('Advised for this visit', list.map(s => `<div class="nrow">${mod(modOf(s))}<div class="grow"><div class="w">${esc(s.n)} ${pri(s.pri)}</div><div class="y">${esc(s.svc)} · ${esc(s.st)} · ${esc((DOC[s.doc] || {}).n || '')} (${esc((DOC[s.doc] || {}).id || '')}) · ${src(s.src)}</div><div class="y">Question: ${esc(s.q)}</div></div><span class="mo">${rupee(TARIFF[s.svc] || s.price)}</span></div>`).join('') +
      `<div class="nrow"><label class="sr" for="desk-add">Add a study</label><input class="in sm" id="desk-add" placeholder="Add a study: “USG KUB”, “CT KUB”, “X-ray chest”" data-in="desk.add" style="flex:1"><button class="sec sm" data-act="desk.addStudy">Add</button></div>`,
      pill('advised lines reader · 18a-iv not built', 'gd sm')) +
    dup.map(x => refuse('duplicate_recent', `${esc(p.n)} had <b>${esc(x.h.n)}</b> on ${esc(x.h.date)} (${esc(x.h.acc)}, ${esc(x.h.where)}), 16 days ago. Repeating it needs the ordering doctor’s reason, recorded with the order.`) +
      `<div class="box card-b"><div class="formgrid"><label>Reason from the doctor<select class="in sm" id="desk-dup-${x.s.acc}" data-in="desk.dupr" data-acc="${x.s.acc}"><option value="">Choose…</option><option ${D.dupReason[x.s.acc] === 'New injury since the last film' ? 'selected' : ''}>New injury since the last film</option><option ${D.dupReason[x.s.acc] === 'Symptoms worse; previous film normal' ? 'selected' : ''}>Symptoms worse; previous film normal</option><option ${D.dupReason[x.s.acc] === 'Previous image not diagnostic' ? 'selected' : ''}>Previous image not diagnostic</option></select></label><label>Confirmed by<input class="in sm" value="${esc((DOC[x.s.doc] || {}).n || '')} (phone, ${hm(now())})" disabled></label></div>
      <p class="sub">The copilot has the old report ready: “Mild lumbar spondylosis, no fracture.” Show it to the doctor before re-ordering.</p></div>`).join('') +
    (list.some(s => s.outsideRx) ? `<div class="warnline"><b>Outside prescription.</b> Scan the paper slip before billing. An order on an outside prescription carries the referrer (Dr. P. Lakra, Kadma) and the scanned slip as its authority; reports go to the patient, and a copy to the referrer only on the patient’s consent.<div class="row" style="margin-top:8px"><button class="sec sm ${D.checks['rx:' + p.id] ? 'grn' : ''}" data-act="desk.scanRx" data-arg="${p.id}">${D.checks['rx:' + p.id] ? '✓ Slip scanned · 1 page' : 'Scan the slip'}</button></div></div>` : '');
}

function stepChecks(p, list) {
  return `<div class="step-h"><span class="num">02</span><h2>Checks</h2><span class="dim">asked at the counter; the prep bay turns them into gates</span></div>` +
    list.map(s => card(`${mod(modOf(s))} ${esc(s.n)}`, checksFor(s).map(c => {
      const st = ckState(s, c);
      return ck(st, esc(c.t), esc(c.s), `<span class="row" style="gap:4px"><button class="chk" aria-pressed="${st === 'ok'}" data-act="desk.ck" data-arg="${s.acc}:${c.k}:ok">Yes</button><button class="chk no" aria-pressed="${st === 'no'}" data-act="desk.ck" data-arg="${s.acc}:${c.k}:no">No</button></span>`);
    }).join(''), `<span class="dim" style="font-size:11.5px">${esc(DEV[devFor(s)] ? DEV[devFor(s)].room : '')}</span>`)).join('') +
    list.filter(s => checksFor(s).some(c => c.k === 'impl' && ckState(s, c) === 'no')).map(s => refuse('gate_open · mri_safety', `Pacemaker declared for ${esc(p.n)}. MR-1 can take him only with the MR-conditional card, the cardiologist’s programming plan and a radiologist on the floor. Book the slot at 16:15 when Dr. Hembrom’s technician is free, or send him to the prep bay first.`) + `<div class="row"><button class="lnk" data-act="go" data-arg="prep:mri">Open MRI screening</button></div>`).join('') +
    list.filter(s => s.contrast && p.egfr != null && p.egfr < 30).map(() => refuse('gate_open · renal_function', `Creatinine ${p.crea} mg/dL is above the ceiling. The radiologist decides: plain study, or contrast with an override and hydration. Do not book a contrast slot until Dr. Anjali Mehta answers.`) + `<div class="row"><button class="lnk" data-act="go" data-arg="prep:bay">Open the prep bay</button><button class="lnk" data-act="go" data-arg="hod:approvals">See the override request</button></div>`).join('');
}

function stepBill(p) {
  const b = bill(p), pay = b.pay;
  const tpaNeeded = pay === 'tpa' && deskStudies(p.id).some(s => ['CT', 'MR'].includes(modOf(s)));
  return `<div class="step-h"><span class="num">03</span><h2>Bill</h2><span class="dim">prices from the active tariff version · no discount at the counter</span></div>` +
    card('Who pays', `<div class="card-b">${seg(Object.entries(PAYERS).map(([k, v]) => [k, v.n]), pay, 'desk.payer')}<p class="sub" style="margin-top:8px">${esc(PAYERS[pay].note)}</p></div>`) +
    card('Lines', b.lines.map(l => `<div class="nrow"><span class="mo dim" style="width:132px;flex-shrink:0;font-size:11px">${esc(l.c)}</span><div class="grow"><div class="w">${esc(l.n)}</div>${l.note ? `<div class="y">${esc(l.note)}</div>` : ''}</div><span class="mo">${l.a ? rupee(l.a) : '₹ —'}</span></div>`).join('') +
      `<div class="nrow"><div class="grow"><div class="w">Extras the patient may ask for</div><div class="y">${deskStudies(p.id).map(s => `${filmFree(s) ? '' : `<button class="chk" aria-pressed="${!!D.film[s.acc]}" data-act="desk.film" data-arg="${s.acc}">Film ${rupee(FILM)} · ${esc(s.n.split(',')[0])}</button> `}<button class="chk" aria-pressed="${!!D.cd[s.acc]}" data-act="desk.cd" data-arg="${s.acc}">CD ${rupee(CDP)} · ${esc(s.n.split(',')[0])}</button>`).join(' ')}</div></div></div>
      <div class="nrow"><span class="mo dim" style="width:132px;flex-shrink:0;font-size:11px">GST</span><div class="grow"><div class="w">Exempt · healthcare service</div><div class="y">SAC 9993 · Notification 12/2017-CT(Rate) entry 74 · film and CD are part of the same supply</div></div><span class="mo">₹0</span></div>
      <div class="nrow" style="border-top:2px solid var(--ink)"><b class="grow">Total ${PAYERS[pay].credit ? '(to the payer)' : 'to collect'}</b><b class="mo" style="font-size:20px">${rupee(b.total)}</b></div>`,

    (pay === 'self' ? card('Collect', `<div class="card-b">${D.paid[p.id] ? `<div class="okline">Paid ${rupee(D.paid[p.id].amt)} by ${esc(D.paid[p.id].how)} · invoice ${esc(D.paid[p.id].inv)} · ${hm(D.paid[p.id].at)}</div>` : `<div class="row">${['Cash', 'UPI', 'Card'].map(h => `<button class="sec" data-act="desk.pay" data-arg="${p.id}:${h}">${h}</button>`).join('')}<span class="dim" style="font-size:12px">Wallet: deduct only. Refund of an unperformed study: automatic by the bill-decisions queue, same day.</span></div>`}</div>`) : '') +

function stepSlot(p, list) {

    list.map(s => {

      const rer = s.dev === 'XR-1' ? `<div class="warnline">XR-1 (Room 101) cannot take X-rays: its AERB licence lapsed on 21 Sep. All X-rays go to <b>XR-2, Room 102</b>.</div>` : '';
      const blocked = d && (d.aerb === 'lapsed' || d.aerb === 'pending'), down = d && d.up === 'down';
      return card(`${mod(modOf(s))} ${esc(s.n)}`, `<div class="card-b" style="display:grid;gap:10px">${rer}
        ${blocked ? refuse('device_not_licensed', `${esc(dv)} (${esc(d.n)}, ${esc(d.room)}) has no active AERB licence (${esc(d.lic)}), so it cannot be booked. The Radiological Safety Officer, Bikash Mondal, files the certificate. Offer the patient a date after the licence, or the partner centre.`) + `<div class="row"><button class="lnk" data-act="go" data-arg="rso:licences">Open licences</button><button class="lnk" data-act="desk.later" data-arg="${s.acc}">Keep the order open and tell the patient</button></div>` : ''}
        ${down ? refuse('device_down', `${esc(dv)} (${esc(d.room)}) is down. Book the next day, or send the patient to a room of the same kind.`) + `<div class="row"><button class="lnk" data-act="go" data-arg="room:downtime">Open downtime</button></div>` : ''}
        ${blocked || down ? '' : `<div class="row">${(FREE[dv] || []).filter(t => t > now()).map(t => `<button class="chk" aria-pressed="${!!chosen && chosen.t === t}" data-act="desk.slot" data-arg="${s.acc}:${dv}:${t}">${hm(t)}</button>`).join('')}<button class="chk" aria-pressed="${!!chosen && chosen.now}" data-act="desk.slot" data-arg="${s.acc}:${dv}:now">Now · walk in</button></div>`}
        <p class="sub">${esc(dv)} · ${esc(d ? d.room : '')} · ${s.pri === 'stat' ? 'STAT goes next, no slot' : modOf(s) === 'MR' ? '45-minute block' : modOf(s) === 'CT' && s.contrast ? '30-minute block, plus 20 minutes in the prep bay' : '15-minute block'}</p></div>`);
    }).join('') + (list.some(s => D.slot[s.acc]) ? slip(p, list.filter(s => D.slot[s.acc])) : '');
}

function slip(p, list) {
  const tok = 'R-' + String(40 + list[0].acc.slice(-2) % 50);
  const prep = list.map(s => checksFor(s).filter(c => /Fasting|Nil|bladder|Sedation/i.test(c.t)).map(c => c.t)).flat();
  return `<div class="grid2"><div class="paper" style="padding:18px 20px;font-family:var(--mono);font-size:11.5px;line-height:17px">
    <div style="text-align:center;font-weight:700;letter-spacing:.1em">IMAGING · SLIP</div><div style="text-align:center;font-size:38px;line-height:44px;font-weight:700;margin:6px 0">${tok}</div>
    <div>${esc(p.n)} · ${p.age}${p.sex} · ${esc(p.uhid)}</div>${list.map(s => `<div style="margin-top:6px"><b>${esc(s.n)}</b><br>${esc(D.slot[s.acc].dev)} · ${esc(DEV[D.slot[s.acc].dev].room)} · ${D.slot[s.acc].now ? 'now' : hm(D.slot[s.acc].t)}<br>Acc ${esc(s.acc)} · ordered by ${esc((DOC[s.doc] || {}).id || '')}</div>`).join('')}
    ${prep.length ? `<hr style="border:0;border-top:1px dashed #c9d6ce"><div>${prep.map(esc).join('<br>')}</div>` : ''}<hr style="border:0;border-top:1px dashed #c9d6ce"><div>Report on WhatsApp ${esc(p.phone.slice(0, 5))} •••${esc(p.phone.slice(-2))}<br>Reports counter: ground floor, window R-03</div></div>
    <div class="box card-b" style="display:grid;gap:8px;align-content:start"><span class="tag">WhatsApp · prep instructions</span><div class="say">नमस्ते ${esc(p.n.split(' ')[0])} जी, आपका ${esc(list[0].n)} ${D.slot[list[0].acc].now ? 'अभी' : hm(D.slot[list[0].acc].t) + ' बजे'} ${esc(DEV[D.slot[list[0].acc].dev].room)} में है। ${prep.length ? 'तैयारी: ' + esc(prep[0]) + '।' : ''} रिपोर्ट इसी नंबर पर आएगी।</div>
      <div class="row">${D.sent[p.id] ? pill('Sent ' + hm(D.sent[p.id]) + ' · delivered', 'on') : '<button class="sec sm" data-act="desk.wa" data-arg="' + p.id + '">Send on WhatsApp</button>'}<span class="dim" style="font-size:11.5px">Template “imaging_prep_v1” · not yet approved at Meta</span></div></div></div>`;
}

function counterDock(p, list) {
  const b = bill(p);
  if (D.step === 0) {
    const dupOpen = list.some(s => (HIST[p.id] || []).some(h => !h.old && h.n.split(',')[0] === s.n.split(',')[0]) && !D.dupReason[s.acc]);
    const rxOpen = list.some(s => s.outsideRx) && !D.checks['rx:' + p.id];
    return dock(dupOpen ? 'Record the doctor’s reason for the repeat' : rxOpen ? 'Scan the outside prescription' : 'Studies are right', dupOpen ? 'duplicate_recent is refused without it' : list.length + ' to book', `<button class="pri" data-act="desk.step" data-arg="1" ${dupOpen || rxOpen ? 'disabled' : ''}>Checks <span class="kb dk">Enter</span></button>`);
  }
  if (D.step === 1) {
    const open = list.reduce((n, s) => n + checksFor(s).filter(c => ckState(s, c) === 'wt').length, 0);
    return dock(open ? `${open} check${open > 1 ? 's' : ''} not asked yet` : 'Checks asked', 'answers go to the prep bay with the patient', `<button class="pri" data-act="desk.step" data-arg="2">Bill <span class="kb dk">Enter</span></button>`);
  }
  if (D.step === 2) {
    const needPay = b.pay === 'self' && !D.paid[p.id], needPa = b.pay === 'tpa' && D.preauth[p.id] !== 'ok' && list.some(s => ['CT', 'MR'].includes(modOf(s)));
    return dock(needPay ? `Collect ${rupee(b.total)}` : needPa ? 'Waiting for pre-authorisation' : 'Bill settled', needPay ? 'cash, UPI or card above' : PAYERS[b.pay].n, `<button class="pri" data-act="desk.step" data-arg="3" ${needPay || needPa ? 'disabled' : ''}>Slot <span class="kb dk">Enter</span></button>`);
  }
  const all = list.every(s => D.slot[s.acc]);
  const stuck = list.filter(x => { const d = DEV[devFor(x)]; return d && (d.aerb === 'lapsed' || d.aerb === 'pending' || d.up === 'down'); });
  const bookable = list.filter(x => !stuck.includes(x)), ready = bookable.length && bookable.every(x => D.slot[x.acc]);
  return dock(ready ? 'Give the slip and send the patient on' : bookable.length ? 'Pick a time for each study' : 'This room cannot take bookings', ready ? (stuck.length ? stuck.length + ' kept open until its room can take it · ' : '') + 'now-slots check in at once; the prep bay or the room sees them' : (all ? '' : ''), `<button class="pri" data-act="desk.finish" ${ready ? '' : 'disabled'}>Book and print slip <span class="kb dk">Enter</span></button>`);
}

function counterRight() {
  if (D.sel) {
    const p = PT[D.sel], list = deskStudies(p.id), s = list[0];
    const rows = counterRows();
    return plmin(`${rows.length} at the counter · next ${esc(PT[rows.find(x => x !== D.sel) || rows[0]].n)}`) + copilot({
      sub: 'checked before you asked',
      secs: [{ tag: 'Checked', items: [
        { k: 'ok', h: `Identity: <b>${esc(p.uhid)}</b> matches the slip’s visit.` },

        ...(p.allergy || []).map(a => ({ k: 'warn', h: `Allergy: <b>${esc(a)}</b>. The prep bay needs 5 hours before contrast; I picked the 15:10 CT slot.` })),
