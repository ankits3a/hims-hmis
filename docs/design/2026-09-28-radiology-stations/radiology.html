  if (!s) { const L = wardList(); return laneEmpty('Nobody in hand', 'Open a patient from the ward list to see where their scan is, what the ward must do, and the report when it is signed.', kv('Imaging for inpatients', L.length) + kv('Waiting for a porter', L.filter(x => !portable(x) && ['scheduled', 'checked_in', 'ready'].includes(x.state) && !W.porter[x.acc]).length) + kv('Reports ready', L.filter(x => x.state === 'published').length)); }
  const p = PT[s.pt];
  return lanePatient(p, `<div class="sect"><span class="tag">Where</span>${kv('Bed', esc(bedOf(s)))}${p.ip || s.ip ? kv('Admission', esc(p.ip || s.ip)) : ''}${kv('Consultant', esc(DOC[s.doc].n))}</div>
    <div class="sect"><span class="tag">Imaging this admission</span>${studyRows(STUDY.filter(x => x.pt === s.pt), 'doc.wsel', s.acc)}</div>`);
}
function wardCentre() {
  const s = study(W.sel), L = wardList();
  if (!s) return chead('Ward imaging', 'Wards 2 and 3 and the ICU · every inpatient scan, where it is and what the ward must do') +
    built('none', 'Nothing for the ward exists. The study keeps <code>bedside_location</code>, which nothing writes; no ward screen tracks an inpatient study, and no porter request exists.') +
    `<div class="grid3">${tile('Portable coming', L.filter(x => portable(x) && ['scheduled', 'checked_in', 'ready'].includes(x.state)).length, 'the radiographer comes to the bed')}${tile('Send with a porter', L.filter(x => !portable(x) && ['scheduled', 'checked_in', 'ready'].includes(x.state) && !W.porter[x.acc]).length, 'patient goes down to imaging', 'gd')}${tile('Held at a check', L.filter(x => x.hold).length, 'the ward can help clear it', L.some(x => x.hold) ? 'rd' : 'ok')}</div>` +
    card('How the ward and imaging meet', `<div class="card-b prose"><p><b>Portable</b> — the radiographer brings the machine to the bed. The ward clears the space; nobody moves the patient.</p><p><b>In imaging</b> — the ward prepares (nil by mouth, cannula, consent signed by the patient or next of kin) and sends the patient with a porter when the slot nears. The list turns red if a patient is not sent 10 minutes before the slot.</p><p style="margin:0"><b>Report</b> — when the radiologist signs, the report appears here and in the consultant’s inbox. A critical finding is phoned to the consultant; the ward sees the call in the patient’s row.</p></div>`);
  const p = PT[s.pt], w = whereMust(s), st = wStep(s), c = CRIT.find(x => x.acc === s.acc && x.state === 'open');
  const next = s.state === 'published' ? `<button class="pri" data-act="doc.openRep" data-arg="${s.acc}">Open the report</button>`
    : s.hold ? `<button class="pri" data-act="go" data-arg="${seatOf(s)}">Open the ${esc(SEAT_N[seatOf(s)])}</button>`
    : !portable(s) && ['scheduled', 'checked_in', 'ready'].includes(s.state) && !W.porter[s.acc] ? `<button class="pri" data-act="doc.porter" data-arg="${s.acc}">Send with a porter</button>` : '';
  return chead(`${esc(s.n)} · ${esc(p.n)}`, `${esc(bedOf(s))} · ${esc(s.acc)} · ordered ${hm(s.ordered)} by ${esc(DOC[s.doc].n)} · ${PRI_N[s.pri] || ''}`) +
    built('none', 'No ward view exists. The state, gates and bedside field exist on the study; this screen reads them.') +
    stepper(WSTEPS.map((t, i) => ({ t, s: i === st ? stateLabel(s) : '' })), st) +
    (c ? `<div class="refuse" data-crit="${c.id}"><code>critical · ${esc(c.cat)}</code><span>${esc(c.finding)}. Phoned to ${esc(DOC[c.to].n)}; waiting for the read-back.</span></div>` : '') +
    (s.hold ? refuse(holdCode(s.hold), (HOLD_N[s.hold] || 'A safety check is open.') + ` <button class="lnk" data-act="go" data-arg="${seatOf(s)}">Open the ${esc(SEAT_N[seatOf(s)])}</button>`) : '') +
    card('What the ward does now', ck(w[0], w[1], W.porter[s.acc] ? `Porter requested at ${hm(W.porter[s.acc])} — ${esc(bedOf(s))} → ${esc(DEV[s.dev] ? DEV[s.dev].room : 'imaging')}` : '')) +
    card('The question the radiologist reads', `<div class="card-b" style="font-size:12.5px">${esc(s.q || '')}</div>`) +
    (s.state === 'published' ? card('Report', `<div class="card-b" style="font-size:12.5px"><b>Impression.</b> ${impOf(s)}</div>`) : '') +
    card('Another scan for this patient', `<div class="card-b row"><span class="grow dim" style="font-size:12.5px">A portable film comes to the bed within 30 minutes (urgent) or 10 (STAT). It lands on the radiographer’s portable round.</span><button class="sec" data-act="doc.portForm" data-arg="${s.pt}">Request portable X-ray</button></div>`) +
    (next ? dock(s.state === 'published' ? 'Report signed' : s.hold ? 'Held at a safety check' : 'Slot ' + (s.slot ? hm(s.slot) : 'booked'), s.state === 'published' ? 'Opening it marks it read for the consultant too.' : s.hold ? 'The seat that clears it is one click away.' : 'The porter takes the patient with the file and the consent.', next) : dock(W.porter[s.acc] ? 'Porter on the way' : portable(s) ? 'Portable coming to the bed' : stateLabel(s), w[1], ''));
}
function wardRight() {
  const L = wardList(), sel = study(W.sel);
  const rows = L.map(s => ({ act: 'doc.wsel', arg: s.acc, hook: `data-acc="${s.acc}" data-state="${s.state}"`, sel: s.acc === W.sel, no: esc(bedOf(s).replace('Ward ', 'W').replace(', bed ', '-').replace('ICU bed ', 'ICU-').replace(' · bed ', '-')),
    nm: esc(PT[s.pt].n), ln: `${pri(s.pri)}${mod(modOf(s))} ${esc(s.n)} · <span style="color:${s.hold ? 'var(--red)' : 'inherit'}">${esc(stateLabel(s))}</span>${W.porter[s.acc] ? ' · porter sent' : ''}`, wt: s.state === 'published' ? '✓' : since(s.ordered), wc: s.hold ? 'rd' : s.pri === 'stat' ? 'rd' : '' }));
  const ck2 = [];
  L.filter(s => s.hold).forEach(s => ck2.push({ d: 'rd', w: 'Held at a check', y: `${PT[s.pt].n} · ${GATE_N[s.hold] || s.hold}`, t: since(s.ordered) }));
  L.filter(s => portable(s) && ['scheduled', 'checked_in', 'ready'].includes(s.state)).forEach(s => ck2.push({ d: s.pri === 'stat' ? 'rd' : '', w: 'Portable not yet done', y: `${PT[s.pt].n} · ${bedOf(s)}`, t: since(s.ordered) }));
  if (sel) return plmin(`${L.length} on the ward list · next ${esc(PT[(L.find(x => x.acc !== sel.acc) || sel).pt].n)}`) + copilot({ sub: 'reads the study · you act', secs: [{ tag: 'Checked', items: [
    sel.contrast ? { k: PT[sel.pt].crea > 2 ? 'no' : 'ok', h: `Creatinine ${PT[sel.pt].crea || '—'} mg/dL${PT[sel.pt].crea > 2 ? ': above the contrast ceiling; the radiologist decides.' : ' on file.'}` } : { k: 'ok', h: 'No contrast; no kidney check needed.' },
    { k: 'ok', h: `The patient’s wristband carries ${esc(PT[sel.pt].uhid)}; the room checks it against the order.` },
    sel.state === 'published' ? { k: 'ok', h: 'Report signed. The consultant has it in the results inbox.' } : { k: 'warn', h: `Now at the ${esc(SEAT_N[seatOf(sel)])}.` }] }], ask: 'e.g. when will the report come?' });
  return hookList('Ward imaging', rows, 'No inpatient imaging today.') + clocks('doc-ward', ck2);
}

/* ─────────────────────────── actions ─────────────────────────── */
ACT['doc.open'] = pid => { D.pid = pid; D.picks = []; D.q = ''; D.preg = PT[pid].lmp ? 'yes' : null; D.pri = 'routine'; D.side = {}; };
ACT['doc.pick'] = code => { if (!D.picks.includes(code)) D.picks.push(code); D.q = ''; };
ACT['doc.quick'] = code => { ACT['doc.pick'](code); };
ACT['doc.unpick'] = code => { D.picks = D.picks.filter(c => c !== code); };
ACT['doc.side'] = a => { const [c, s] = a.split(':'); D.side[c] = s; };
ACT['doc.preg'] = v => { D.preg = v; };
ACT['doc.pri'] = v => { D.pri = v; };
ACT['doc.addCrea'] = () => { LABS[D.pid] = { crea: null, when: 'ordered today', days: 0, pending: true }; toast('Creatinine added to the lab order for this consult. Imaging books the slot after the result.'); };
ACT['doc.swap'] = () => {
  if (!CATX['MRCP']) { const c = { code: 'MRCP', svc: 'RAD-MR-MRCP', n: 'MRCP (MRI of the bile ducts)', mod: 'MR', aka: 'mrcp bile duct', price: 7800, prep: 'Fasting 4 h. Metal and implant questions answered at the desk.', mins: 30 }; CAT.push(c); CATX.MRCP = c; }
  D.picks = D.picks.filter(c => c !== 'CT-ABDO-CONTRAST'); if (!D.picks.includes('MRCP')) D.picks.push('MRCP');
  toast('Swapped CECT abdomen for MRCP. No iodine; no premedication needed.');
};
ACT['doc.useDraft'] = () => { const p = pat(); D.picks.forEach(c => { if (!(D.ind[c] || '').trim()) D.ind[c] = draftQ(p, CATX[c]); }); toast('Clinical question filled from your notes. Edit it if it is not what you meant.'); };
/* H1 — the order goes through the spine: OPD lands at the desk as "To book"; STAT is booked into the room now */
ACT['doc.send'] = () => {
  const p = pat(); if (!p) return false;
  const bad = D.picks.flatMap(c => needs(p, CATX[c])); if (bad.length) { toast(esc(bad[0][1]), true); return false; }
  const msgs = [];
  D.picks.forEach(c => {
    const x = CATX[c];
    const s = orderStudy({ pt: p.id, svc: x.svc, n: x.n, st: x.code, mod: x.mod, pri: D.pri, src: 'OPD', doc: ME, q: D.ind[c], price: x.price, contrast: !!x.contrast, pndt: !!x.pndt, side: D.side[c] || undefined });
    if (D.pri === 'stat') {
      const dev = x.pndt ? 'US-2' : DEV_FOR[x.mod];
      const r = bookStudy(s.acc, dev, now());
      msgs.push(r ? `${esc(x.n)}: ${esc(r.code)} — ${esc(r.msg)} It waits at the desk.` : `${esc(x.n)} is on the ${esc(dev)} worklist now.`);
    }
    D.sent.push({ pid: p.id, code: c, acc: s.acc });
  });
  toast(D.pri === 'stat' ? msgs.join(' ') : `Sent ${D.picks.length} to imaging. The desk sees ${esc(p.n)} as “To book”; the prep goes out on WhatsApp.`, msgs.some(m => m.includes('—')));
  D.picks = []; D.ind = {}; D.pri = 'routine';
};
/* H9 — the read-back closes the call; a vague read-back is refused by the spine */
ACT['doc.ackForm'] = id => {
  const c = CRIT.find(x => x.id === id), s = study(c.acc);
  modal(`Read back · ${esc(PT[s.pt].n)}`, `<div style="display:grid;gap:10px"><div class="refuse"><code>${esc(c.cat)}</code><span>${esc(c.finding)}</span></div>
    <label class="fl" for="doc-rb">Say it back in your own words: the finding and what you will do<input class="in" id="doc-rb" autocomplete="off" placeholder="e.g. free air under the diaphragm, perforation likely; surgery called"></label>
    <div class="dim" style="font-size:11.5px">The radiologist sees your read-back word for word. A read-back that does not name the finding is refused.</div>${D.rbErr ? refuse(D.rbErr.code, esc(D.rbErr.msg)) : ''}</div>`,
    `<button class="sec" data-act="closeModal">Cancel</button><button class="pri red" data-act="doc.ack" data-arg="${id}">Acknowledge</button>`);
};
ACT['doc.ack'] = id => {
  const v = ($('#doc-rb') || {}).value || ''; const r = ackCritical(id, v);
  if (r) { D.rbErr = r; ACT['doc.ackForm'](id); const el = $('#doc-rb'); return; }
  D.rbErr = null; S.modal = null; const c = CRIT.find(x => x.id === id); readReport(c.acc);
  toast('Read back and acknowledged. The chaser stops; the radiologist sees your words.');
};
ACT['doc.refer'] = () => { toast('Referral to General Surgery sent to Dr. Alka Mishra with the report attached.'); return false; };
ACT['doc.openRep'] = acc => { D.rsel = acc; readReport(acc); S.view.doc = 'report'; const c = $('#centre'); if (c) c.scrollTop = 0; };
ACT['doc.rsel'] = acc => { D.rsel = acc; readReport(acc); };
ACT['doc.images'] = acc => { viewImages(acc, 'treating doctor'); readReport(acc); toast('The PACS viewer opens at this accession. The view is logged against your name.'); };
ACT['doc.actedForm'] = acc => {
  const s = study(acc); D.actSel = D.actSel || 'Changed treatment';
  modal(`What did the report change? · ${esc(PT[s.pt].n)}`, `<div style="display:grid;gap:10px"><div class="row">${['Changed treatment', 'Referred', 'Follow-up booked', 'Discussed with patient', 'No change needed'].map(o => `<button class="chk" aria-pressed="${D.actSel === o}" data-act="doc.actSel" data-arg="${esc(o)}" data-id="${acc}">${esc(o)}</button>`).join('')}</div>
    <label class="fl" for="doc-actnote">One line for the record<input class="in sm" id="doc-actnote" placeholder="e.g. started antibiotics; review in 5 days" value="${esc(D.actNote || '')}"></label>
    <div class="dim" style="font-size:11.5px">Saved with your name and time. The radiologist sees it; the order-to-acted-on clock stops.</div>${D.actErr ? refuse(D.actErr.code, esc(D.actErr.msg)) : ''}</div>`,
    `<button class="sec" data-act="closeModal">Cancel</button><button class="pri" data-act="doc.acted" data-arg="${acc}">Save</button>`);
};
ACT['doc.actSel'] = (o, el) => { D.actNote = ($('#doc-actnote') || {}).value || D.actNote; D.actSel = o; ACT['doc.actedForm'](el.dataset.id); };
ACT['doc.acted'] = acc => {
  const n = (($('#doc-actnote') || {}).value || '').trim();
  const r = actedUpon(acc, n ? `${D.actSel}: ${n}` : ''); if (r) { D.actErr = r; D.actNote = n; ACT['doc.actedForm'](acc); return; }
  D.actErr = null; D.actNote = ''; readReport(acc); REL[acc].doctor = 'acted'; S.modal = null; toast('Recorded as acted on. The loop is closed for this report.');
};
/* H11 — booking a follow-up places a new order at the desk */
ACT['doc.bookFu'] = id => {
  const f = FU.find(x => x.id === id), c = fuGuess(f); if (!c) return false;
  const s = bookFollowup(id, { svc: c.svc, n: c.n, st: c.code, mod: c.mod, price: c.price, contrast: !!c.contrast });
  toast(`${esc(c.n)} ordered as ${esc(s.acc)}. It waits at the imaging desk as “To book”; ${esc(PT[f.pt].n)} gets the prep on WhatsApp.`);
};
ACT['doc.closeFu'] = id => { const f = FU.find(x => x.id === id); f.state = 'closed'; f.closeReason = 'Done outside imaging (ordered from the consult)'; logEv(f.acc, 'followup.closed', f.closeReason); toast('Follow-up closed with the reason. The reading room’s tracker shows it closed.'); };
ACT['doc.msg'] = acc => { const el = $('#doc-msg'); const m = el && el.value.trim(); if (!m) return false; D.thread[acc].push({ who: 'rao', t: now(), m }); logEv(acc, 'report.question', m); toast('Sent. The radiologist sees it on the report in the reading room.'); };
/* ward */
ACT['doc.wsel'] = acc => { W.sel = acc; S.listOpen = false; };
ACT['doc.porter'] = acc => { const s = study(acc); W.porter[acc] = now(); logEv(acc, 'porter.requested', `${bedOf(s)} → ${DEV[s.dev] ? DEV[s.dev].room : 'imaging'}`); toast(`Porter requested: ${esc(bedOf(s))} → ${esc(DEV[s.dev] ? DEV[s.dev].room : 'imaging')}. Imaging sees the patient is on the way.`); };
ACT['doc.portForm'] = pid => {
  const p = PT[pid]; D.port = D.port || { kind: 'chest', pri: 'urgent' };
  modal(`Portable X-ray · ${esc(p.n)}`, `<div style="display:grid;gap:10px"><div class="row">${[['chest', 'Chest AP · ₹600'], ['abdomen', 'Abdomen erect · ₹500']].map(([k, l]) => `<button class="chk" aria-pressed="${D.port.kind === k}" data-act="doc.portSet" data-arg="kind:${k}" data-pid="${pid}">${l}</button>`).join('')}</div>
    <div class="row">${[['urgent', 'Urgent · 30 min'], ['stat', 'STAT · 10 min']].map(([k, l]) => `<button class="chk ${k === 'stat' ? 'no' : ''}" aria-pressed="${D.port.pri === k}" data-act="doc.portSet" data-arg="pri:${k}" data-pid="${pid}">${l}</button>`).join('')}</div>
    <label class="fl" for="doc-portq">Clinical question (required)<input class="in" id="doc-portq" autocomplete="off" placeholder="e.g. breathless after the central line; pneumothorax?" value="${esc(D.portQ || '')}"></label>
    ${D.portErr ? refuse('indication_required', 'Write the clinical question. The radiologist reads it first.') : ''}</div>`,
    `<button class="sec" data-act="closeModal">Cancel</button><button class="pri" data-act="doc.portSend" data-arg="${pid}">Send to the portable round</button>`);
};
ACT['doc.portSet'] = (a, el) => { D.portQ = ($('#doc-portq') || {}).value || D.portQ; const [k, v] = a.split(':'); D.port[k] = v; ACT['doc.portForm'](el.dataset.pid); };
ACT['doc.portSend'] = pid => {
  const q = (($('#doc-portq') || {}).value || '').trim(); if (!q) { D.portErr = true; ACT['doc.portForm'](pid); return; }
  const cur = study(W.sel), bed = cur && cur.pt === pid ? bedOf(cur) : bedOf({ pt: pid });
  const chest = D.port.kind === 'chest';
  const s = orderStudy({ pt: pid, svc: chest ? 'RAD-XR-CHEST-PORT' : 'RAD-XR-ABD-PORT', n: chest ? 'X-ray chest AP, portable' : 'X-ray abdomen erect, portable', st: chest ? 'XR-CHEST' : 'XR-ABDO', mod: 'XR', dev: 'PX-1', pri: D.port.pri, src: 'IPD', doc: ME, q, price: chest ? 600 : 500, bed });
  D.portErr = false; D.portQ = ''; S.modal = null; W.sel = s.acc;
  toast(`${esc(s.n)} on the portable round (${esc(s.acc)}). ${esc(STAFF.ravi.n)} comes to ${esc(bed)}.`);
};
INP['doc.q'] = v => { D.q = v; const box = $('#doc-res'); if (box) box.innerHTML = searchResults(); };
INP['doc.ind'] = (v, el) => { D.ind[el.dataset.code] = v; };
INP['doc.dup'] = (v, el) => { D.dup[el.dataset.code] = v; };

station({
  id: 'doc', name: 'Doctor’s door', person: { n: DOC.rao.n, i: 'NR', role: 'General Medicine · OPD room 12 · Wards 2–3' },
  navs: [
    { id: 'order', label: 'Order imaging', b: 'none', why: 'No web caller for POST /radiology/orders; plan 18a-iv not approved.' },
    { id: 'results', label: 'Results', get n() { const k = critOpen().length; return k || published().filter(s => relOf(s.acc).doctor === 'unread').length || 0; }, get red() { return critOpen().length > 0; }, b: 'part', why: 'Reports reach the consult brief; no inbox, no acknowledge, no acted-on.' },
    { id: 'report', label: 'Report', b: 'part', why: 'Report text in the brief; no doctor-side report view, comparison or follow-up booking.' },
    { id: 'ward', label: 'Ward', get n() { return wardList().filter(s => s.hold).length || 0; }, red: true, b: 'none', why: 'No ward view; bedside_location has no writer; no porter request.' },
  ],
  layout: v => v === 'order' || v === 'ward' ? 'three' : 'two',
  lane: v => v === 'order' ? orderLane() : v === 'ward' ? wardLane() : '',
  centre: v => v === 'order' ? orderCentre() : v === 'results' ? resultsCentre() : v === 'ward' ? wardCentre() : reportCentre(),
  right: v => v === 'order' ? orderRight() : v === 'results' ? resultsRight() : v === 'ward' ? wardRight() : reportRight(),
  drop: () => { const v = S.view.doc; if (v === 'order') { D.pid = null; D.picks = []; } else if (v === 'ward') { W.sel = null; } else if (v === 'report') { S.view.doc = 'results'; } },
});
})();

</script>

<script>
/* ══════ Patient's phone — what Farida sees on WhatsApp: prep, the report, feedback ══════ */
(function () {
'use strict';
const P = { reply: null, stage: 'live', otp: ['', '', '', ''], otpOk: false, abha: null, shared: false, stars: 0, gv: '', gvSent: false, extra: [], lang: 'both' };
const p = PT.farida;
const TPL = n => `<span class="tpl">TEMPLATE · ${esc(n)} · hospital wording · IT submits to Meta</span>`;
const ACC = 'I2609280044';
const fs = () => study(ACC);
/* live: the phone shows the report only when the study is published; the preview switch shows either side */
const isAfter = () => P.stage === 'after' || (P.stage === 'live' && fs() && fs().state === 'published');
const SEAT_N = { to_book: ['imaging desk', 'desk:counter'], scheduled: ['imaging desk', 'desk:counter'], checked_in: ['prep bay', 'prep:bay'], ready: ['CT room', 'room:console'], in_acquisition: ['CT room', 'room:console'], acquired: ['reading room', 'read:worklist'], drafted: ['reading room', 'read:worklist'], reported: ['reading room', 'read:worklist'] };
const send = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>';
const bub = (html, tm, me) => `<div class="bub ${me ? 'me' : ''}">${html}<span class="tm">${tm}${me ? ' ✓✓' : ''}</span></div>`;
const both = (en, hi) => P.lang === 'hi' ? hi : P.lang === 'en' ? en : `${en}<span class="hi">${hi}</span>`;

function phone(body, sub) {
  return `<div class="phone" role="img" aria-label="Farida’s phone, WhatsApp chat with the hospital"><div class="ph-scr">
    <div class="ph-top"><span class="av2">HOS</span><span class="grow"><b>Hospital Imaging ✓</b><small>${sub || 'Verified business account'}</small></span></div>
    <div class="ph-body" id="ph-body">${body}</div>
    <div class="ph-in"><label class="sr" for="ph-msg">Type a message</label><input id="ph-msg" placeholder="Message" autocomplete="off"><button data-act="pt.type" aria-label="Send">${send}</button></div>
  </div></div>`;
}
function notes(items) {
  return `<section class="box"><div class="card-h"><h2>What each message is, and its rules</h2></div>${items.map((x, i) => `<div class="note-i"><span class="nb2">${i + 1}</span><div><b>${x.t}</b><small>${x.s}</small></div></div>`).join('')}</section>`;
}
const langBar = () => `<div class="row"><span class="dim" style="font-size:12px">Message language</span>${seg([['both', 'English + हिंदी'], ['en', 'English'], ['hi', 'हिंदी']], P.lang, 'pt.lang')}</div>`;

/* ─────────────── prep ─────────────── */
function prepThread() {
  let h = `<span class="ph-day">Saturday, 26 September</span>`;
  h += bub(TPL('imaging_booked') + '<br>' + both(`<b>Farida Khatoon</b>, your <b>CECT abdomen and pelvis</b> is booked.<br>📅 <b>Mon 28 Sep, 11:40</b> · CT, Room 104<br>Please come at <b>10:00</b>: the nurse gives you medicine for your contrast allergy first.<br>Booking no. I2609280044 · ${rupee(6500)} paid`,
    `<b>फ़रीदा ख़ातून</b>, आपका <b>CT पेट (कंट्रास्ट के साथ)</b> बुक हो गया है।<br>📅 <b>सोम 28 सितंबर, 11:40</b> · CT, कमरा 104<br>कृपया <b>10:00 बजे</b> आएं: कंट्रास्ट एलर्जी की दवा पहले दी जाएगी।`), '17:40');
  h += bub(TPL('imaging_prep_cect') + '<br>' + both(`<b>Before your scan</b><br>1. Eat nothing for 4 hours before 11:40. A light breakfast before 07:30 is fine. Water is fine.<br>2. Keep taking metformin: your kidney test on 19 Sep is fine.<br>3. Bring your old reports, especially the ultrasound of 16 Sep.<br>4. Wear clothes without metal. Leave jewellery at home.`,
    `<b>जांच से पहले</b><br>1. 11:40 से 4 घंटे पहले कुछ न खाएं। 07:30 से पहले हल्का नाश्ता ठीक है। पानी पी सकते हैं।<br>2. मेटफ़ॉर्मिन लेते रहें: 19 सितंबर की किडनी जांच ठीक है।<br>3. पुरानी रिपोर्ट लाएं, ख़ासकर 16 सितंबर का अल्ट्रासाउंड।<br>4. बिना धातु के कपड़े पहनें। गहने घर पर छोड़ें।`) +
    `<div class="btns"><button data-act="pt.reply" data-arg="1" aria-pressed="${P.reply === '1'}">1 · Confirm</button><button data-act="pt.reply" data-arg="2" aria-pressed="${P.reply === '2'}">2 · Change the time</button></div>`, '17:41');
  if (P.reply === '1') h += bub('1', '18:02', true) + bub(both('Thank you. See you on Monday at 10:00. Reply HELP any time to talk to the imaging desk.', 'धन्यवाद। सोमवार 10:00 बजे मिलते हैं। कभी भी HELP लिखें, इमेजिंग डेस्क से बात होगी।'), '18:02');
  if (P.reply === '2') h += bub('2', '18:02', true) + bub(both('Free CT slots with premedication time: <b>Tue 29 Sep 11:40</b> · <b>Wed 30 Sep 09:40</b> · <b>Thu 01 Oct 12:20</b>. Reply A, B or C.', 'खाली समय: <b>मंगल 29 सितं 11:40</b> · <b>बुध 30 सितं 09:40</b> · <b>गुरु 1 अक्टू 12:20</b>। A, B या C लिखें।') + '<div class="btns"><button data-act="pt.rebook" data-arg="A">A · Tue 11:40</button><button data-act="pt.rebook" data-arg="B">B · Wed 09:40</button><button data-act="pt.rebook" data-arg="C">C · Thu 12:20</button></div>', '18:02');
  h += `<span class="ph-day">Sunday, 27 September</span>`;
  h += bub(TPL('imaging_reminder') + '<br>' + both(`Reminder: CT tomorrow, <b>come at 10:00</b>. Last food before 07:30.<br>📍 Gate 2 → ground floor → Imaging (follow the green line). Parking at Gate 3.<br><span class="link">maps.app.goo.gl/…imaging</span>`,
    `याद दिला रहे हैं: कल CT है, <b>10:00 बजे आएं</b>। 07:30 के बाद कुछ न खाएं।<br>📍 गेट 2 → भूतल → इमेजिंग (हरी लाइन देखें)। पार्किंग गेट 3 पर।`), '18:00');

  P.extra.forEach(m => { h += bub(esc(m.t), m.tm, true) + bub(both('Thank you. The imaging desk will reply within 10 minutes (08:00–21:00).', 'धन्यवाद। इमेजिंग डेस्क 10 मिनट में जवाब देगा (08:00–21:00)।'), m.tm); });
  return h;
}
function prepCentre() {
  return chead('Patient’s phone · before the scan', `${esc(p.n)} · ${p.age}${p.sex} · CECT abdomen booked for today 11:40`, langBar()) +
    built('none', 'No patient-facing prep, reminder or recall messaging exists (out of scope in 18a-iii). The WhatsApp Cloud adapter and webhook sit in lane/whatsapp-cloud; Meta holds 0 templates until IT submits these.') +
    `<div class="ph-wrap">${phone(prepThread(), P.reply === '2' ? 'choosing a new time' : 'Verified business account')}<div style="display:grid;gap:14px;min-width:0">` +
    notes([
      { t: 'Booking confirmation · imaging_booked', s: 'Sent when the desk books the slot. The arrival time is the slot minus the prep time the study type needs (premedication 90 min, full bladder 60 min, plain 15 min). The template names the study, room, time, booking number and amount paid.' },
      { t: 'Prep instructions · one template per prep family', s: 'Built from the study type’s prep text and the patient’s own record: contrast allergy, metformin, the last creatinine, old reports to bring. The metformin line is computed (eGFR 58: continue; under 45: hold 48 h after), never typed.' },
      { t: 'Reply 1 or 2 · quick-reply buttons', s: '1 confirms and marks the slot “confirmed” on the desk’s schedule. 2 offers three real free slots that fit the prep; the patient picks, and the old slot is released at once.' },
      { t: 'Reminder the evening before · 18:00', s: 'Carries directions and the last-food time. Not sent between 21:00 and 08:00. No reply in 2 hours before the slot puts the patient on the desk’s “call to confirm” list.' },
      { t: 'Check-in · session message', s: 'Free-form, allowed because the 24-hour window is open after the patient’s reply. Undelivered for 30 min → the same text by SMS.' },
    ]) +
    `<div class="okline"><b>DECIDED · 28 Sep · industry standard.</b> The wording above is the hospital’s standard bilingual text, written the way large Indian hospital groups phrase booking, prep and reminder messages: plain, time-first, no clinical detail. IT submits each template to Meta (a vendor step, usually 1–2 days); a later wording change is a new template.</div></div></div>`;
}

/* ─────────────── report ─────────────── */
function reportThread() {
  let h = `<span class="ph-day">Today</span>`;
  const st = fs() ? fs().state : 'published', scanned = P.stage !== 'live' || ['acquired', 'drafted', 'reported', 'published'].includes(st);
  h += scanned ? bub(both(`Your CT is done at ${fs() && fs().done ? hm(fs().done) : '11:52'}. The report will be ready by <b>17:00</b>. We will message you here.`, `आपका CT ${fs() && fs().done ? hm(fs().done) : '11:52'} पर हो गया। रिपोर्ट <b>17:00</b> बजे तक तैयार होगी। हम यहीं संदेश भेजेंगे।`), '11:55')
    : bub(both('You are checked in. Nurse Rekha will call you to the prep bay. The report comes here after the doctor signs it.', 'आपका नाम दर्ज हो गया है। नर्स रेखा आपको तैयारी कक्ष में बुलाएंगी। डॉक्टर के हस्ताक्षर के बाद रिपोर्ट यहीं आएगी।'), '10:02');
  if (!isAfter()) {
    h += `<div class="ph-page"><b>Not ready — no summary before signing.</b><span class="dim" style="font-size:12px">The report is not signed. Nothing about the findings is sent before the radiologist signs, not even a draft. If Farida asks “is it serious?”, the desk answers “the doctor will tell you after reading it”.</span></div>`;
    return h;
  }
  h += bub(TPL('imaging_report_ready') + '<br>' + both(`Your <b>CT abdomen</b> report is ready.<br>Open it securely: <span class="link">hms.link/r/7Kq2…</span><br>You will get a 4-digit code on this number to open it.`,
    `आपकी <b>CT पेट</b> की रिपोर्ट तैयार है।<br>सुरक्षित रूप से खोलें: <span class="link">hms.link/r/7Kq2…</span><br>खोलने के लिए इसी नंबर पर 4 अंकों का कोड आएगा।`) + `<div class="btns"><button data-act="pt.openLink">Open report</button></div>`, '15:18');
  if (!P.otpOk) {
    h += `<div class="ph-page"><b>Enter the code sent to 82102 ••• 17</b><div class="otp">${P.otp.map((d, i) => `<label class="sr" for="otp${i}">Digit ${i + 1}</label><input id="otp${i}" inputmode="numeric" maxlength="1" value="${esc(d)}" data-in="pt.otp" data-i="${i}">`).join('')}</div><span class="dim" style="font-size:11.5px">Sample code: 4821. Five wrong codes lock the link for 30 minutes.</span><button class="pri sm" data-act="pt.verify">Open</button></div>`;
    return h;
  }
  h += `<div class="ph-page">
    <div class="row"><b class="grow">CT abdomen and pelvis</b><span class="pill on sm">Signed</span></div>
    <span class="dim" style="font-size:11.5px">28 Sep 2026 · I2609280044 · reported by Dr. Anjali Mehta, MD (Radiodiagnosis) · Reg. JMC/2011/4127</span>
    <div style="background:var(--wash);border-radius:8px;padding:9px 10px"><span class="tag">In plain words</span><div style="margin-top:4px">${both('Your scan shows a small stone in the bile duct, the tube that carries bile from the liver. This explains the pain and the raised liver test. Your liver, pancreas and kidneys look normal. Dr. Rao will discuss treatment with you; a stone like this is usually removed without open surgery.', 'आपकी जांच में पित्त नली (जो लीवर से पित्त ले जाती है) में एक छोटी पथरी दिखी है। इसी से दर्द और लीवर जांच का बढ़ा हुआ नतीजा है। लीवर, पैंक्रियास और किडनी सामान्य हैं। डॉ. राव इलाज पर बात करेंगे; ऐसी पथरी आमतौर पर बिना बड़े ऑपरेशन के निकाल दी जाती है।')}</div>
    <span class="dim" style="font-size:10.5px;margin-top:4px;display:block">Written by software from the signed report and checked against it. The report below is the official record.</span></div>
    <div class="doc"><i>PDF</i><span class="grow">Report · I2609280044.pdf · 2 pages</span><button class="lnk" data-act="pt.pdf">Save</button></div>
    <div class="doc"><i style="background:#2d5f8a">IMG</i><span class="grow">Images · 4 key images, full study in the viewer</span><button class="lnk" data-act="pt.images">View</button></div>
    <div class="row"><button class="sec sm" data-act="pt.share">${P.shared ? 'Shared · link valid 7 days' : 'Share with another doctor'}</button></div>
    <div style="border-top:1px solid var(--line2);padding-top:8px"><b style="font-size:12.5px">Save to your ABHA health locker?</b><div class="dim" style="font-size:11.5px">Your ABHA 91-4417-••••-2210. The hospital sends this report to your locker only if you say yes.</div>
      <div class="row" style="margin-top:6px"><button class="chk" aria-pressed="${P.abha === true}" data-act="pt.abha" data-arg="y">Yes, save it</button><button class="chk" aria-pressed="${P.abha === false}" data-act="pt.abha" data-arg="n">Not now</button></div></div>
  </div>`;
  return h;
}
function reportCentre() {
  const s = fs(), seat = s ? SEAT_N[s.state] : null;
  return chead('Patient’s phone · the report', `${esc(p.n)} · CECT abdomen · the report reaches her only after signing`, `${seg([['live', 'Live'], ['before', 'Preview: before signing'], ['after', 'Preview: after signing']], P.stage, 'pt.stage')}${langBar()}`) +
    (s ? `<div class="${s.state === 'published' ? 'okline' : 'warnline'}" data-acc="${ACC}" data-state="${s.state}"><b>Live:</b> ${esc(s.acc)} is <b>${esc(s.hold ? 'held at a check' : (STATE_N[s.state] || s.state))}</b>${s.state === 'published' ? ` · released ${hm(s.releasedAt || now())} · link ${REL[ACC] && REL[ACC].patient === 'opened' ? 'opened by Farida' : 'sent, not opened yet'}` : seat ? ` — now at the ${esc(seat[0])}. The phone shows “not ready” until the radiologist signs. <button class="lnk" data-act="go" data-arg="${seat[1]}">Open the ${esc(seat[0])}</button>` : ''}</div>` : '') +
    built('part', 'Published reports go to ABDM through <code>abdm-release.ts</code>, and <code>imaging_report_delivery</code> records the first read. Not built: the patient link, the OTP page, the plain-words summary, sharing, and any WhatsApp template.') +
    `<div class="ph-wrap">${phone(reportThread())}<div style="display:grid;gap:14px;min-width:0">` +
    notes([
      { t: 'Scan done · session message', s: 'Tells the promise time (the study type’s report target) and nothing about findings.' },
      { t: 'Report ready · imaging_report_ready', s: 'Sent when the radiologist publishes. The link carries no health data; it opens only after a 4-digit code to the registered number. Undelivered for 30 min → SMS link. Unopened in 24 h with an abnormal report → the desk calls.' },
      { t: 'Plain-words summary', s: '<b>Drafted by the copilot only after signing, never before.</b> It restates the impression in simple words, adds no finding the report does not contain, and never gives a prognosis. A critical or cancer-suspicious report sends no summary: the doctor tells the patient first.' },
      { t: 'Who signed it', s: '<b>DECIDED · 28 Sep:</b> the patient page and the PDF carry the signing radiologist’s name, qualification and council registration number, as Indian hospitals print on every imaging report. The referring doctor still prints as a Doctor ID.' },
      { t: 'Share and ABHA', s: 'Sharing makes a separate 7-day link, logged in the image-view audit. The ABHA push waits for her yes, recorded as consent under the DPDP Act.' },
    ]) + '</div></div>';
}

/* ─────────────── feedback ─────────────── */
function fbThread() {
  let h = `<span class="ph-day">Today</span>`;
  h += bub(TPL('imaging_cd_ready') + '<br>' + both(`Your CD with the full CT images (₹300, paid at booking) is ready at the <b>report counter R-01</b> from 16:00.<br>Show this code: <b style="font-family:var(--mono);font-size:16px;letter-spacing:.1em">7305</b><br>A family member can collect it with this code and their own ID.`,
    `पूरी CT तस्वीरों वाली CD <b>रिपोर्ट काउंटर R-01</b> पर 16:00 से तैयार है।<br>यह कोड दिखाएं: <b style="font-family:var(--mono);font-size:16px">7305</b><br>परिवार का कोई सदस्य इस कोड और अपनी ID से ले सकता है।`), '15:20');
  h += bub(TPL('imaging_feedback') + '<br>' + both(`How was your visit today?<br>Arrived 10:00 · premedication 10:05–11:30 · scan 11:44 · done 11:52.<br>Waiting after the medicine: <b>14 min</b>.`,
    'आज का अनुभव कैसा रहा?<br>आए 10:00 · दवा 10:05–11:30 · जांच 11:44 · पूरी 11:52।<br>दवा के बाद इंतज़ार: <b>14 मिनट</b>।') +
    `<div style="margin-top:8px" class="stars">${[1, 2, 3, 4, 5].map(n => `<button aria-label="${n} star${n > 1 ? 's' : ''}" aria-pressed="${P.stars >= n}" data-act="pt.star" data-arg="${n}">★</button>`).join('')}</div>`, '15:40');
  if (P.stars) {
    h += bub('★'.repeat(P.stars), '15:44', true);
    h += P.stars >= 4 ? bub(both('Thank you, Farida. We share your words with the imaging team.', 'धन्यवाद फ़रीदा जी। आपकी बात टीम तक पहुंचाएंगे।'), '15:44')
      : bub(both('We are sorry. Tell us what went wrong, in your own words. A senior person will call you within 24 hours.', 'हमें खेद है। अपने शब्दों में बताएं क्या ग़लत हुआ। 24 घंटे में एक वरिष्ठ व्यक्ति आपको फ़ोन करेंगे।'), '15:44');
  }
  if (P.stars && P.stars < 4) {
    h += P.gvSent ? bub(esc(P.gv), '15:47', true) + bub(both(`Your complaint is registered: <b>GRV-2609-0142</b>. The radiology head reads it today; you will get a call by tomorrow 15:47.`, `आपकी शिकायत दर्ज हो गई: <b>GRV-2609-0142</b>। कल 15:47 तक फ़ोन आएगा।`), '15:47')
      : `<div class="ph-page"><label class="fl" for="pt-gv" style="color:var(--ink)">What went wrong?<textarea class="in" rows="3" id="pt-gv" data-in="pt.gv" placeholder="e.g. nobody told me why I had to wait">${esc(P.gv)}</textarea></label><button class="pri sm" data-act="pt.gvSend">Send</button></div>`;
  }
  return h;
}
function fbCentre() {
  return chead('Patient’s phone · after the visit', `${esc(p.n)} · as it will read this afternoon · CD collection, feedback and grievance`, langBar()) +
    built('none', 'No CD or film counter, no collection code, no feedback or grievance flow exists in radiology. Prices are DECIDED (28 Sep): digital link free, CD ₹300, film ₹250 a sheet on request.') +
    `<div class="ph-wrap">${phone(fbThread())}<div style="display:grid;gap:14px;min-width:0">` +
    notes([
      { t: 'CD ready · imaging_cd_ready', s: 'The collection code is single-use; the counter scans it and records who collected (patient, or a relative with their own ID). DECIDED prices: the digital report and image link are free; a CD is ₹300; film is ₹250 a sheet on request (one film included with an X-ray).' },
      { t: 'Feedback · 2 hours after the study ends', s: 'Shows her own timeline so the rating is about facts. Premedication time is shown separately from waiting, so the department is not blamed for a safety step, and not excused for a real wait.' },
      { t: '1–3 stars opens a grievance', s: 'Free text goes to the hospital grievance register with a number, a 24-hour callback clock and the radiology head as owner (NABH patient-rights standard). 4–5 stars never ask for more.' },
      { t: 'Wait time is measured, not asked', s: 'Arrival, check-in, prep, table and done come from the study’s own timestamps. The same numbers feed the head of department’s turnaround board.' },
    ]) + '</div></div>';
}

/* ─────────────── actions ─────────────── */
ACT['pt.lang'] = v => { P.lang = v; };
ACT['pt.reply'] = v => { if (!P.reply) P.reply = v; else return false; };
ACT['pt.rebook'] = v => { toast(`Rebooked to option ${esc(v)}. The Monday slot is released on the desk’s schedule.`); P.reply = '1'; };
ACT['pt.type'] = () => { const el = $('#ph-msg'); const t = el && el.value.trim(); if (!t) return false; if (V() === 'prep') { P.extra.push({ t, tm: hm(now()) }); } else toast('Messages outside the prep thread go to the imaging desk inbox.'); };
ACT['pt.stage'] = v => { P.stage = v; };
ACT['pt.openLink'] = () => { toast('The link opens the secure page; the code is sent to her number.'); return false; };
ACT['pt.verify'] = () => { if (P.otp.join('') === '4821') { P.otpOk = true; if (REL[ACC]) { REL[ACC].patient = 'opened'; logEv(ACC, 'report.patient_opened', 'OTP link'); } toast('Code accepted. The first open is recorded as first read; the unread chaser stops.'); } else { toast('That code is not right. 4 tries left.', true); return false; } };
ACT['pt.pdf'] = () => { toast('In the live build the PDF saves to the phone. This board cannot download files.'); return false; };
ACT['pt.images'] = () => { viewImages(ACC, 'patient, own images'); toast('Opens the patient image viewer at this study (key images first). The view is logged.'); return false; };
ACT['pt.share'] = () => { P.shared = true; toast('A 7-day link was made to share with another doctor. It is in the access log.'); };
ACT['pt.abha'] = v => { P.abha = v === 'y'; toast(P.abha ? 'Consent recorded. The report goes to her ABHA locker as a FHIR DiagnosticReport.' : 'Not sent. She can say yes later from the same link.'); };
ACT['pt.star'] = v => { P.stars = +v; };
ACT['pt.gvSend'] = () => { if (!P.gv.trim()) { toast('Write a few words first.', true); return false; } P.gvSent = true; };
INP['pt.gv'] = v => { P.gv = v; };
INP['pt.otp'] = (v, el) => { const i = +el.dataset.i; P.otp[i] = v.replace(/\D/g, '').slice(-1); el.value = P.otp[i]; if (P.otp[i] && i < 3) { const n = document.getElementById('otp' + (i + 1)); if (n) n.focus(); } };

station({
  id: 'pt', name: 'Patient’s phone', person: { n: p.n, i: 'FK', role: 'patient' },
  navs: [
    { id: 'prep', label: 'Before the scan', b: 'none', why: 'No prep, reminder or recall messaging; 0 approved WhatsApp templates.' },
    { id: 'report', label: 'The report', b: 'part', why: 'ABDM push and first-read tracking exist; no patient link, OTP page or plain-words summary.' },
    { id: 'feedback', label: 'After the visit', b: 'none', why: 'No CD counter code, feedback or grievance flow in radiology.' },
  ],
  layout: () => 'one',
  centre: v => v === 'prep' ? prepCentre() : v === 'report' ? reportCentre() : fbCentre(),
  onEnter: () => { setTimeout(() => { const b = document.getElementById('ph-body'); if (b) b.scrollTop = b.scrollHeight; }, 0); },
});
})();

</script>

/* ─────────────── tariff ─────────────── */
function tariff() {
  const svc = ROWS.slice(0, 20).map(r => `<tr><td class="mo" style="font-size:11.5px">${esc(r.svc)}</td><td>${esc(r.code)}</td><td class="r mo">${rupee(r.price)}</td><td class="r mo">${rupee(Math.round(r.price * .85))}</td><td>${pill('investigation · exempt', 'on sm')}</td></tr>`);
  return chead('Imaging prices', 'The tariff lines behind every RAD- service; money changes are the owner’s', seg([['v7', 'v7 active'], ['v8', 'v8 draft']], G.tv, 'setup.tv')) +
    built('part', 'Prices come from the active tariff version, and <code>authorisationOf</code> refuses an unpaid routine scan (402 <code>payment_required</code>). There is no tariff screen: rows are priced through the routes. Every imaging service is GST category <code>investigation</code>, which <code>seed:tariff</code> does not create yet.') +
    `<div class="okline"><b>DECIDED · 28 Sep · GST.</b> Diagnostic imaging by a clinical establishment is a health-care service, <b>exempt</b> under Notification 12/2017-Central Tax (Rate), entry 74 (SAC heading 9993). The category <code>investigation</code> is created at <b>0%, exempt</b>; film and CD supplied with a study follow the study. The same category serves the laboratory. The CA confirms the six-digit SAC at the first return.</div>` +
    card(`Services · tariff ${esc(G.tv)}`, table(['Service', 'Study type', '>Self-pay', '>Corporate (−15%)', 'GST category'], svc)) +
    `<div class="grid2">` + card('Add-ons and extras', table(['Item', '>Price', 'Status'], [
      `<tr><td>Contrast (iodinated), up to 100 mL</td><td class="r mo">included</td><td>${pill('DECIDED · standard', 'on sm')}</td></tr>`,
      `<tr><td>Premedication and cannula</td><td class="r mo">included</td><td>${pill('DECIDED · standard', 'on sm')}</td></tr>`,
      `<tr><td>Sedation (paediatric MRI), anaesthetist present</td><td class="r mo">${rupee(1500)}</td><td>${pill('DECIDED · standard', 'on sm')}</td></tr>`,
      `<tr><td>Digital report and image link</td><td class="r mo">free</td><td>${pill('DECIDED · 28 Sep', 'on sm')}</td></tr>`,
      `<tr><td>Film, 14 × 17 dry laser · one included with every X-ray</td><td class="r mo">${rupee(250)} / sheet</td><td>${pill('DECIDED · 28 Sep', 'on sm')}</td></tr>`,
      `<tr><td>CD / DVD of the study</td><td class="r mo">${rupee(300)}</td><td>${pill('DECIDED · 28 Sep', 'on sm')}</td></tr>`,
      `<tr><td>Outside study second opinion · X-ray or USG</td><td class="r mo">${rupee(600)}</td><td>${pill('DECIDED · 28 Sep', 'on sm')}</td></tr>`,
      `<tr><td>Outside study second opinion · CT or MRI</td><td class="r mo">${rupee(1500)}</td><td>${pill('DECIDED · 28 Sep', 'on sm')}</td></tr>`,
      `<tr><td>Repeat for technical fault</td><td class="r mo">${rupee(0)}</td><td>${pill('bill decision · repeat_no_charge', 'bl sm')}</td></tr>`])) +
    card('Packages that contain imaging', table(['Package', 'Imaging inside', 'Billed as'], [
      `<tr><td>Executive health check</td><td>X-ray chest, USG abdomen, mammography (women 40+)</td><td>package line; studies at ₹0</td></tr>`,
      `<tr><td>Pre-operative profile</td><td>X-ray chest</td><td>package line</td></tr>`,
      `<tr><td>Antenatal care</td><td>USG early, USG anomaly</td><td>package line; Form F still required</td></tr>`])) + '</div>';
}

/* ─────────────── stock ─────────────── */
const STK = [
  { n: 'Iohexol 350 mgI/mL, 100 mL', lot: 'OMN24K118', exp: '11/2026', qty: 14, par: 40, u: 'bottles', days: 4 },
  { n: 'Iohexol 350 mgI/mL, 50 mL', lot: 'OMN25B042', exp: '03/2027', qty: 22, par: 20, u: 'bottles', days: 11 },
  { n: 'Gadoterate meglumine 0.5 mmol/mL, 10 mL', lot: 'DOT25A310', exp: '10/2026', qty: 6, par: 10, u: 'vials', days: 6, near: true },
  { n: 'Barium sulphate suspension, 250 mL', lot: 'BAR24H551', exp: '12/2026', qty: 9, par: 6, u: 'bottles', days: 45 },
  { n: 'Injector syringe kit, 200 mL dual-head', lot: 'MED25C009', exp: '08/2028', qty: 31, par: 50, u: 'kits', days: 8 },
  { n: 'Dry laser film, 14 × 17 in', lot: 'FLM25D220', exp: '06/2027', qty: 180, par: 300, u: 'sheets', days: 12 },
  { n: 'CD-R with printed sleeve', lot: '—', exp: '—', qty: 420, par: 300, u: 'discs', days: 60 },
  { n: 'Ultrasound gel, 5 L', lot: 'GEL25E100', exp: '05/2028', qty: 3, par: 6, u: 'cans', days: 5 },
  { n: 'IV cannula 20 G', lot: 'CAN25A884', exp: '01/2029', qty: 140, par: 200, u: 'pcs', days: 20 },
];
function stock() {
  return chead('Contrast and consumables', 'The department’s sub-store: drawn from the pharmacy store, used against a study, counted every week') +
    built('part', 'Contrast given is recorded per study with agent, volume, batch and expiry (<code>imaging_contrast_administrations</code>), but nothing decrements a stock. The pharmacy store’s ledger and emergency-tray checks exist in the pharmacy module; radiology has no sub-store.') +
    `<div class="grid4">${tile('Below par', STK.filter(s => s.qty < s.par).length, 'raise one indent', 'gd')}${tile('Expiring in 60 days', STK.filter(s => s.near).length, 'gadoterate · use first', 'rd')}${tile('Contrast used today', '4 × 100 mL', 'matches 4 CECT/CTA studies', 'ok')}${tile('Emergency tray, CT room', 'sealed', 'checked 08:10 by Rekha Soren', 'ok')}</div>` +
    card('Stock by batch', table(['Item', 'Batch', 'Expiry', '>On hand', '>Par', '>Days left', ''], STK.map((s, i) => `<tr class="${s.near ? 'hot' : s.qty < s.par ? 'warn' : ''}"><td>${esc(s.n)}</td><td class="mo" style="font-size:11.5px">${esc(s.lot)}</td><td class="mo">${esc(s.exp)}${s.near ? ' ' + pill('near expiry', 'rd sm') : ''}</td><td class="r mo">${s.qty} ${esc(s.u)}</td><td class="r mo">${s.par}</td><td class="r mo">${s.days}</td><td>${s.qty < s.par ? (G.reorder[i] ? pill('in indent', 'bl sm') : `<button class="lnk" data-act="setup.reorder" data-arg="${i}">Add to indent</button>`) : ''}</td></tr>`))) +
    dock(Object.keys(G.reorder).length ? `Indent to the pharmacy store · ${Object.keys(G.reorder).length} items` : 'Nothing in the indent yet', 'The pharmacy store issues against the indent; receipts land here by batch. Contrast is a Schedule H item: the store records the issue.', `<button class="pri" data-act="setup.indent" ${Object.keys(G.reorder).length ? '' : 'disabled'}>Send the indent</button>`);
}

/* ─────────────── right rail ─────────────── */
function right(v) {
  if (v === 'catalogue') return govern('study_types', 3) + copilot({ sub: 'checks the book', secs: [{ tag: 'Checked', items: [{ k: 'warn', h: '<b>CT-TRAUMA</b> and <b>CT-STROKE</b> are ordered by the ER today as “CT head” + free text. Adding them lets the stroke clock start at the order.', act: 'setup.addMany', arg: 'CT-TRAUMA,CT-STROKE', label: 'Add both to the draft' }, { k: 'warn', h: 'No study type for portable X-ray: bedside studies are unreachable (nothing writes <code>bedside_location</code>).', act: 'setup.add', arg: 'XR-CHEST-PORT', label: 'Add portable chest' }, { k: 'ok', h: 'Every active study type has prep text and a service code.' }] }], ask: 'e.g. which study types open the renal gate?' });
  if (v === 'templates') return govern('critical_categories', 1) + copilot({ sub: 'checks the book', secs: [{ tag: 'Checked', items: [{ k: 'warn', h: 'The pregnancy policy has no active version, so the pregnancy gate reads nothing it can cite.' }, { k: 'ok', h: 'The red window (15 min) matches the chaser job’s 60-second sweep.' }] }] });
  if (v === 'rooms') return govern('pacs_settings', 1) + clocks('setup-rooms', Object.values(DEV).filter(d => d.aerb === 'lapsed' || d.aerb === 'pending').map(d => ({ d: 'rd', w: `${d.code} licence ${d.aerb}`, y: `${d.room} cannot take ionising studies`, t: d.aerb === 'lapsed' ? '7d' : '26d' })).concat(Object.values(DEV).filter(d => d.up === 'down' || d.up === 'qa_blocked').map(d => ({ d: 'rd', w: `${d.code} ${d.up === 'down' ? 'down' : 'QA blocked'}`, y: d.room, t: 'now' }))).concat([{ w: 'MR-1 helium 71%', y: 'top-up booked Sun 04 Oct', t: '6d' }, { w: 'FL-1 in service', y: 'vendor call V-2291', t: '2d' }]));
  if (v === 'tariff') return `<section class="box"><div class="card-h"><h2>Rulings behind these prices</h2><span class="grow"></span>${pill('all DECIDED · 28 Sep', 'on sm')}</div>${ck('ok', 'GST: category “investigation”, 0%, exempt (SAC 9993)', 'Notification 12/2017-CT(R) entry 74 · CA confirms the six-digit SAC at the first return')}${ck('ok', 'Film ₹250 a sheet on request, one with every X-ray; CD ₹300; the link is free', 'standard at large Indian hospital groups')}${ck('ok', 'Outside read ₹600 (X-ray, USG), ₹1,500 (CT, MRI)', 'second-opinion counter')}${ck('ok', 'Corporate and TPA rates follow each payer’s contract; cashless MRI and CT need the TPA’s pre-authorisation before the scan, or a deposit', 'the desk holds the slot, not the scan')}${ck('ok', 'Contrast and premedication included in the CECT and contrast-MRI price', 'standard Indian corporate practice')}</section>` + govern('tariff', 7);
  if (v === 'stock') return clocks('setup-stock', [{ d: 'rd', w: 'Gadoterate expires 10/2026', y: '6 vials · use before the new batch', t: '33d' }, { w: 'Iohexol 100 mL below par', y: '14 left · 4 days of use', t: '4d' }, { w: 'Gel below par', y: '3 cans', t: '5d' }]) + copilot({ sub: 'counts · you order', secs: [{ tag: 'Checked', items: [{ k: 'ok', h: 'Contrast recorded on studies today (4 × 100 mL) matches the bottles opened.' }, { k: 'warn', h: 'At this week’s rate, iohexol 100 mL runs out on Friday.', act: 'setup.reorder', arg: '0', label: 'Add iohexol to the indent' }] }] });
  return govern('dose_reference_levels', 1);
}

/* ─────────────── actions ─────────────── */
ACT['setup.cat'] = v => { G.cat = v; };
ACT['setup.add'] = c => { const k = 'add ' + c; if (!G.draft.includes(k)) G.draft.push(k); G.approvals = []; toast(`${esc(c)} added to draft v4. Two approvals, then an activator who is not you.`); };
ACT['setup.addMany'] = a => { a.split(',').forEach(c => { const k = 'add ' + c; if (!G.draft.includes(k)) G.draft.push(k); }); G.approvals = []; };
ACT['setup.approve'] = () => { const who = DRAFTERS[G.approvals.length + 1]; G.approvals.push(who.k); toast(`Approval recorded: ${esc(who.n)}.`); };
ACT['setup.activate'] = () => { G.draft.forEach(k => { const r = PROPOSED.find(x => 'add ' + x.code === k); if (r) { r.st = 'active'; ROWS.push(r); PROPOSED.splice(PROPOSED.indexOf(r), 1); } }); G.draft = []; G.approvals = []; toast('Activated by the Medical Superintendent. Orders, slots and gates read the new version now.'); };
ACT['setup.discard'] = () => { G.draft = []; G.approvals = []; };
ACT['setup.proto'] = v => { G.proto = v; };
ACT['setup.tpl'] = v => { G.tpl = v; };
ACT['setup.tv'] = v => { G.tv = v; };
ACT['setup.ae'] = c => { modal(`AE title · ${esc(c)}`, `<label class="fl" for="setup-aein">DICOM AE title (up to 16 characters, capitals)<input class="in" id="setup-aein" maxlength="16" value="${esc(c.replace('-', '') + '_SCU')}"></label><p class="dim" style="font-size:12px">The modality asks the worklist with this name. Once set, patients appear on the machine’s console instead of being typed.</p>`, `<button class="sec" data-act="closeModal">Cancel</button><button class="pri" data-act="setup.aeSave" data-arg="${esc(c)}">Save</button>`); };
ACT['setup.aeSave'] = c => { const v = ($('#setup-aein') || {}).value || ''; if (!/^[A-Z0-9_]{1,16}$/.test(v)) { toast('Use capitals, digits and underscore, up to 16 characters.', true); return false; } G.ae[c] = v; S.modal = null; toast(`${esc(c)} answers the worklist as ${esc(v)}.`); };
ACT['setup.addDev'] = () => { modal('Add a machine', `<div class="formgrid"><label for="sd1">Code<input class="in sm" id="sd1" placeholder="CT-2"></label><label for="sd2">Modality<select class="in sm" id="sd2"><option>CT</option><option>MRI</option><option>X-ray</option><option>Ultrasound</option><option>Mammography</option></select></label><label for="sd3">Room<input class="in sm" id="sd3" placeholder="Room 105"></label><label for="sd4">AE title<input class="in sm" id="sd4" placeholder="CT2_SCU"></label></div><div class="warnline" style="margin-top:10px">An ionising machine is created as <b>not licensed</b>. It takes patients only after the RSO files its AERB licence.</div>`, `<button class="sec" data-act="closeModal">Cancel</button><button class="pri" data-act="setup.devSave">Add</button>`); };
ACT['setup.devSave'] = () => { S.modal = null; toast('Machine added as not licensed. The RSO sees it in the licence gap list.'); };
ACT['setup.reorder'] = i => { G.reorder[i] = true; };
ACT['setup.indent'] = () => { const n = Object.keys(G.reorder).length; G.reorder = {}; toast(`Indent IND-RAD-0931 sent to the pharmacy store with ${n} items.`); };
INP['setup.wt'] = v => { G.wt = Math.max(3, Math.min(200, +v || 0)); const c = PROTO[G.proto].con; const el = $('#setup-vol'); if (c && el) el.textContent = Math.min(c.max, Math.round(G.wt * c.perKg)) + ' mL'; };

station({
  id: 'setup', name: 'Setup', person: { n: RAD.sahay.n, i: RAD.sahay.i, role: 'Head of radiology · department admin' },
  navs: [
    { id: 'catalogue', label: 'Study catalogue', b: 'part', why: 'study_types definition seeded (20); no web caller for definitions.' },
    { id: 'protocols', label: 'Protocols', b: 'none', why: 'No protocol book; DRL definition exists without a screen.' },
    { id: 'templates', label: 'Templates & criticals', b: 'part', why: '7 section templates; no coded scoring; critical and pregnancy books have no screen.' },
    { id: 'rooms', label: 'Rooms & machines', b: 'none', why: 'No resources screen; no AE titles, so MWL is empty.' },
    { id: 'tariff', label: 'Prices', b: 'part', why: 'Tariff versions priced by route; GST category investigation (exempt, decided) not yet seeded.' },
    { id: 'stock', label: 'Contrast & stock', n: 2, b: 'part', why: 'Contrast recorded per study; no radiology sub-store.' },
  ],
  layout: () => 'two',
  centre: v => ({ catalogue, protocols, templates, rooms, tariff, stock })[v](),
  right,
});
})();

</script>

<script>
/* boot: deep link by #station or #station-view, else the blueprint */
(function () {
  let h = ''; try { h = (location.hash || '').slice(1); } catch (e) { /* sandbox */ }
  const i = h.indexOf('-'), st = i > 0 ? h.slice(0, i) : h, v = i > 0 ? h.slice(i + 1) : '';
  if (ST[st]) { S.st = st; if (v && ST[st].navs.some(n => n.id === v)) S.view[st] = v; }
  render();
})();

</script>
